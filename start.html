<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZETSU PACKZ</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#000;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
  }
  a{
    display:inline-block;
    position:relative;
    line-height:0;
  }
  .home-img{
    display:block;
    height:100vh;
    width:auto;
    max-width:100vw;
    object-fit:contain;
  }
  .cta{
    position:absolute;
    left:50%;bottom:6%;
    transform:translateX(-50%);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;
    font-weight:800;
    letter-spacing:.25em;
    text-transform:uppercase;
    text-shadow:0 2px 10px rgba(0,0,0,.85);
    animation:pulse 1.8s ease-in-out infinite;
    pointer-events:none;
    white-space:nowrap;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:.5;}
  }
  @media (prefers-reduced-motion: reduce){
    .cta{animation:none;}
  }
</style>
</head>
<body>
  <a href="shop.html" aria-label="Enter Zetsu Packz">
    <img class="home-img" src="assets/zetsupkzhome.png" alt="Zetsu PackZ">
    <div class="cta">Click to Start</div>
  </a>
</body>
</html>
