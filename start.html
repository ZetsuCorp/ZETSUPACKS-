<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZETSU PACKZ</title>
<style>
  :root{
    --brass:#D4AF6A;
    --brass-dim:#8A7245;
    --ink:#EDE6DC;
    --muted:#6B6478;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#000;
    color:var(--ink);
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:34px;padding:40px 20px;
  }
  a{text-decoration:none;color:inherit;}

  .mark{
    font-size:12px;letter-spacing:.5em;text-transform:uppercase;
    color:var(--muted);font-weight:700;
  }
  .title{
    margin:0;font-size:clamp(38px,8vw,64px);font-weight:900;
    letter-spacing:.06em;text-transform:uppercase;line-height:1;
    color:var(--brass);text-align:center;
  }

  /* ---------- CSS pack, centered ---------- */
  .pack{
    width:220px;height:300px;border-radius:10px;
    background:linear-gradient(150deg,#141018,#241a30 55%,#141018);
    border:1px solid var(--brass-dim);
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    cursor:pointer;
    box-shadow:0 30px 70px -25px rgba(0,0,0,.9);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .pack:hover{transform:translateY(-6px);box-shadow:0 40px 80px -25px rgba(0,0,0,.95);}
  .pack::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(115deg, rgba(212,175,106,.05) 0px, rgba(212,175,106,.05) 1px, transparent 1px, transparent 14px);
  }
  .pack .perf{
    position:absolute;left:0;right:0;top:50%;height:1px;
    background-image:repeating-linear-gradient(90deg, var(--brass-dim) 0 6px, transparent 6px 12px);
  }
  .pack .glyph{font-size:46px;color:var(--brass);}
  .pack .pack-label{
    font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--brass);font-weight:700;
  }
  .pack .sheen{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg, transparent 35%, rgba(255,255,255,.12) 50%, transparent 65%);
    background-size:220% 100%;background-position:120% 0;
    animation:idle-sheen 4.5s ease-in-out infinite;
  }
  @keyframes idle-sheen{
    0%,80%{background-position:120% 0;}
    100%{background-position:-40% 0;}
  }

  .enter-hint{
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;}
  }
</style>
</head>
<body>
  <div class="mark">Zetsumetsu</div>
  <h1 class="title">ZETSU PACKZ</h1>

  <a class="pack" id="enterPack" href="shop.html" aria-label="Enter Zetsu Packz">
    <div class="perf"></div>
    <div class="sheen"></div>
    <div class="glyph">&#9670;</div>
    <div class="pack-label">Tap to Enter</div>
  </a>

  <div class="enter-hint" id="hint"></div>

<script>
  // self-contained state logic -- this page doesn't depend on any other file
  const STORAGE_KEY = "vault_state_v1";
  function defaultState(){
    return { balance: 1000, collection: [], unopened: [], firstVisit: true };
  }
  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      return Object.assign(defaultState(), JSON.parse(raw));
    } catch(e){ return defaultState(); }
  }
  function saveState(state){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
  }
  function fmt(n){ return n.toLocaleString(); }

  const state = loadState();
  const hint = document.getElementById("hint");
  if (!(state.firstVisit && state.collection.length === 0 && state.balance === 1000 && state.unopened.length === 0)){
    hint.textContent = fmt(state.balance) + " chips - " + state.collection.length + " cards collected";
  }
  if (state.firstVisit){
    state.firstVisit = false;
    saveState(state);
  }
</script>
</body>
</html>
