<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZETSU PACKZ — Wallet / Personal Ledger</title>
<style>
:root{
  --bg:#0A0A0A;
  --panel:#141414;
  --panel-2:#1C1C1C;
  --line:#333333;
  --ink:#EDE6DC;
  --muted:#9A958E;
  --brass:#D4AF6A;
  --brass-dim:#8A7245;
  --common:#8C8880;
  --rare:#4FB6A8;
  --epic:#9B6BD6;
  --legendary:#E8A23D;
  --mythic-a:#FF6B9D;
  --mythic-b:#C77DFF;
  --mythic-c:#4FD1E5;
  --danger:#E8636B;
  --good:#5FBF7A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.mono{font-family:'Fredoka',sans-serif;font-weight:700;}

/* ============================================================
   WALLET — header trigger. Chip balance only. No pack count.
   Meant to sit inside the existing .hud-stats slot in the header.
   ============================================================ */
#walletTrigger{
  display:flex;align-items:center;gap:10px;
  background:transparent;border:3px solid var(--line);border-radius:20px;
  padding:6px 16px;cursor:pointer;color:var(--ink);
  transition:border-color .15s ease;
}
#walletTrigger:hover{border-color:var(--brass-dim);}
#walletTrigger .wallet-label{font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;}
#walletTrigger .wallet-amt{font-size:20px;font-weight:800;color:#FFFFFF;letter-spacing:.02em;}
#walletTrigger .wallet-icon{font-size:14px;color:var(--brass);}

/* ============================================================
   LEDGER OVERLAY — full-screen takeover
   ============================================================ */
#ledgerOverlay{
  position:fixed;inset:0;z-index:200;
  background:var(--bg);
  display:none;
  flex-direction:column;
  overflow:hidden;
}
#ledgerOverlay.open{display:flex;}
body.ledger-locked{overflow:hidden;}

.ledger-top{
  flex:none;
  border-bottom:3px solid var(--line);
  padding:20px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
}
.ledger-top .ledger-title-wrap{display:flex;flex-direction:column;gap:2px;}
.ledger-top .mark{font-size:10px;letter-spacing:.28em;color:var(--brass);text-transform:uppercase;font-weight:700;}
.ledger-top h1{margin:0;font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;}
.ledger-close{
  background:transparent;border:3px solid var(--line);color:var(--ink);
  width:40px;height:40px;border-radius:50%;font-size:18px;line-height:1;
  cursor:pointer;flex:none;
}
.ledger-close:hover{border-color:var(--danger);color:var(--danger);}

/* filter bar — Packs Bought / Packs Sold / Chip Allocation */
.ledger-filters{
  flex:none;
  display:flex;gap:10px;flex-wrap:wrap;
  padding:16px 20px;
  border-bottom:3px solid var(--line);
  background:var(--panel);
}
.ledger-filter{
  flex:1 1 160px;
  background:var(--panel-2);border:3px solid var(--line);border-radius:6px;
  padding:10px 14px;cursor:pointer;text-align:left;color:var(--ink);
  transition:border-color .15s ease;
}
.ledger-filter:hover{border-color:var(--brass-dim);}
.ledger-filter.active{border-color:var(--brass);background:rgba(212,175,106,.08);}
.ledger-filter .lf-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.ledger-filter .lf-value{font-size:20px;font-weight:800;margin-top:2px;}

/* body — swaps between transaction list and allocation breakdown */
.ledger-body{flex:1;overflow-y:auto;padding:20px;max-width:820px;margin:0 auto;width:100%;}

.ledger-empty{text-align:center;padding:60px 20px;color:var(--muted);border:3px dashed var(--line);border-radius:8px;}

.ledger-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;border-bottom:1px solid var(--line);
}
.ledger-row:last-child{border-bottom:none;}
.ledger-row .lr-left{display:flex;align-items:center;gap:12px;}
.ledger-row .lr-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.ledger-row .lr-dot.mythic{background:linear-gradient(120deg,var(--mythic-a),var(--mythic-b),var(--mythic-c));}
.ledger-row .lr-dot.legendary{background:var(--legendary);}
.ledger-row .lr-dot.epic{background:var(--epic);}
.ledger-row .lr-dot.rare{background:var(--rare);}
.ledger-row .lr-dot.common{background:var(--common);}
.ledger-row .lr-dot.system{background:var(--brass);}
.ledger-row .lr-info{display:flex;flex-direction:column;gap:2px;}
.ledger-row .lr-type{font-size:14px;font-weight:700;}
.ledger-row .lr-ts{font-size:11px;color:var(--muted);}
.ledger-row .lr-amt{font-size:16px;font-weight:800;font-family:'Fredoka',sans-serif;}
.ledger-row .lr-amt.pos{color:var(--good);}
.ledger-row .lr-amt.neg{color:var(--danger);}

/* chip allocation breakdown view */
.alloc-grid{display:flex;flex-direction:column;gap:12px;}
.alloc-stat{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--panel-2);border:3px solid var(--line);border-radius:6px;
  padding:16px 18px;
}
.alloc-stat .as-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.alloc-stat .as-amt{font-size:22px;font-weight:800;}
.alloc-stat .as-amt.pos{color:var(--good);}
.alloc-stat .as-amt.neg{color:var(--danger);}
.alloc-stat.net{border-color:var(--brass-dim);}
.alloc-stat.net .as-amt{color:#FFFFFF;}

/* ============================================================
   SIGNUP MODAL — gates Buy / Wallet-open until an account exists
   ============================================================ */
.signup-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.85);
  display:none;align-items:center;justify-content:center;
}
.signup-overlay.open{display:flex;}
.signup-card{
  background:var(--panel-2);border:3px solid var(--brass-dim);border-radius:8px;
  padding:28px;width:320px;display:flex;flex-direction:column;gap:12px;
}
.signup-title{font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.signup-input{
  background:var(--panel);border:3px solid var(--line);border-radius:4px;
  padding:10px 12px;color:var(--ink);font-size:14px;
}
.signup-input:focus{outline:none;border-color:var(--brass-dim);}
.signup-error{font-size:12px;color:var(--danger);min-height:14px;}
</style>
</head>
<body>

<!-- ============================================================
     WALLET — drop this markup into the header's .hud-stats slot
     in place of the old packs-count element.
     ============================================================ -->
<div id="wallet">
  <button id="walletTrigger" type="button" title="Open Personal Ledger">
    <span class="wallet-icon">&#128091;</span>
    <span class="wallet-label">Wallet</span>
    <span class="wallet-amt mono" id="walletAmt">0</span>
  </button>
</div>

<!-- ============================================================
     LEDGER OVERLAY — full screen
     ============================================================ -->
<div id="ledgerOverlay">
  <div class="ledger-top">
    <div class="ledger-title-wrap">
      <span class="mark">Zetsumetsu EOe</span>
      <h1>Personal Ledger</h1>
    </div>
    <button class="ledger-close" id="ledgerCloseBtn" type="button" aria-label="Close">&times;</button>
  </div>

  <div class="ledger-filters">
    <button class="ledger-filter" id="filterAll" data-filter="all">
      <div class="lf-label">Show All</div>
      <div class="lf-value mono" id="statAllCount">0</div>
    </button>
    <button class="ledger-filter" id="filterBought" data-filter="bought">
      <div class="lf-label">Packs Bought</div>
      <div class="lf-value mono" id="statBoughtCount">0</div>
    </button>
    <button class="ledger-filter" id="filterSold" data-filter="sold">
      <div class="lf-label">Packs Sold</div>
      <div class="lf-value mono" id="statSoldCount">0</div>
    </button>
    <button class="ledger-filter" id="filterAlloc" data-filter="allocation">
      <div class="lf-label">Chip Allocation</div>
      <div class="lf-value mono" id="statAllocValue">0</div>
    </button>
  </div>

  <div class="ledger-body" id="ledgerBody"></div>
</div>

<!-- ============================================================
     SIGNUP MODAL — shown the first time Buy or Wallet is clicked
     ============================================================ -->
<div id="signupOverlay" class="signup-overlay">
  <div class="signup-card">
    <div class="signup-title">Create Your Wallet</div>
    <input id="signupEmail" class="signup-input" type="text" placeholder="Email or Username" autocomplete="username">
    <input id="signupPassword" class="signup-input" type="password" placeholder="Password" autocomplete="new-password">
    <div class="signup-error" id="signupError"></div>
    <button id="signupSubmitBtn" class="btn btn-brass" type="button">Continue</button>
  </div>
</div>

<script>
/* ==========================================================
   WALLET / PERSONAL LEDGER — shared component
   Depends on the host page already having:
     state          (the shared vault_state_v1 object)
     saveState(s)   (persists it)
     fmt(n)         (number formatter)
   All of those already exist identically on shop.html, index.html,
   collection.html, and redemption.html.
   ========================================================== */

/* ---- SUPABASE / WALLET_LEDGER ROW ----------------------------
   window.walletRow is the person's one row in wallet_ledger.
   id_type "ip"      — auto-seated by IP, no password yet
   id_type "account" — has completed the signup modal
   ---------------------------------------------------------- */

const WALLET_SUPABASE_URL = "https://jqvnrdjrkdjgjbmqmbbl.supabase.co";
const WALLET_SUPABASE_ANON_KEY = "sb_publishable_jmEahTk4OssD_IrOZq_6iQ_P6QFFJr6";

function walletClient(){
  if (!window._walletClient){
    window._walletClient = window.supabase.createClient(WALLET_SUPABASE_URL, WALLET_SUPABASE_ANON_KEY);
  }
  return window._walletClient;
}

/* ----------------------------------------------------------
   NOTIFIES on any change to the current wallet's own row —
   this is the "wallet ledger is notified" step. It doesn't know
   or care about packs; it just tells window.onWalletLedgerChanged
   (defined by shop.html) whenever this row's balance/buys/etc.
   actually changes in the database. Whether that change means
   "go draw a card" is shop.html's decision, not this file's.
   ---------------------------------------------------------- */
function subscribeToWalletLedger(){
  if (!window.walletRow || !window.walletRow.id) return;
  if (window._walletChannel) return; // already subscribed for this row this session

  window._walletChannel = walletClient()
    .channel(`wallet_ledger_${window.walletRow.id}`)
    .on("postgres_changes", {
      event: "UPDATE",
      schema: "public",
      table: "wallet_ledger",
      filter: `id=eq.${window.walletRow.id}`
    }, (payload) => {
      if (typeof window.onWalletLedgerChanged === "function"){
        window.onWalletLedgerChanged(payload.new);
      }
    })
    .subscribe();
}

async function getIp(){
  try {
    const res = await fetch("https://api.ipify.org?format=json");
    const data = await res.json();
    return data.ip;
  } catch (e){
    return "unknown";
  }
}

async function autoSignInByIp(){
  const client = walletClient();
  const stored = localStorage.getItem("wallet_identifier");

  // Returning browser — go straight to their already-claimed row,
  // no IP lookup needed, so a second visit never re-triggers creation.
  if (stored){
    const { data } = await client.from("wallet_ledger").select("*").eq("identifier", stored).maybeSingle();
    if (data){
      window.walletRow = data;
      window.state.balance = data.balance;
      return;
    }
    // stored identifier no longer exists in the table — fall through and re-claim
  }

  // First-ever visit from this browser — find or create by IP.
  const ip = await getIp();
  let candidate = ip;
  while (true){
    const { data } = await client.from("wallet_ledger").select("id").eq("identifier", candidate).maybeSingle();
    if (!data) break;
    candidate += "0"; // same IP already claimed by a different browser — next slot
  }

  const { data: created } = await client.from("wallet_ledger")
    .insert({ identifier: candidate, id_type: "ip", balance: 0 })
    .select().single();

  window.walletRow = created;
  if (created) window.state.balance = created.balance;
  localStorage.setItem("wallet_identifier", candidate);
}

/* ---- SIGNUP MODAL ---------------------------------------------- */

function openSignupModal(onDone){
  window._signupOnDone = onDone;
  document.getElementById("signupError").textContent = "";
  document.getElementById("signupOverlay").classList.add("open");
}

function closeSignupModal(){
  document.getElementById("signupOverlay").classList.remove("open");
}

async function submitSignup(){
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;
  const errEl = document.getElementById("signupError");

  if (!email || !password){
    errEl.textContent = "Enter an email/username and password.";
    return;
  }

  const client = walletClient();
  const { data, error } = await client.from("wallet_ledger")
    .update({ id_type: "account", email_or_username: email, password: password, balance: 1000 })
    .eq("id", window.walletRow.id)
    .select().single();

  if (error || !data){
    errEl.textContent = "Something went wrong — try again.";
    return;
  }

  window.walletRow = data;
  window.state.balance = data.balance;
  renderWallet(); // must come after window.walletRow is reassigned above —
                   // renderWallet() reads window.walletRow.balance, so calling
                   // it first was rendering the pre-signup row (old balance)
                   // and nothing re-rendered it afterward until some unrelated
                   // action (buying a pack, switching tabs) happened to call
                   // renderWallet() again

  localStorage.setItem("wallet_identifier", data.identifier);
  closeSignupModal();

  const fn = window._signupOnDone;
  window._signupOnDone = null;
  if (typeof fn === "function") fn();
}

function wireSignupControls(){
  document.getElementById("signupSubmitBtn").addEventListener("click", submitSignup);
}

async function requireAccount(action){
  if (!window.walletRow){
    await autoSignInByIp();
  }
  renderWallet();
  if (window.walletRow && window.walletRow.id_type === "account"){
    action();
  } else {
    openSignupModal(action);
  }
}

/* ---- ledger entry types -------------------------------------
   type: "buy"      — pack purchase          (always negative)
   type: "sell"     — card sell / redemption (always positive)
   type: "cashout"  — gift card cash-out     (always negative, chips)

   Chip-Spend Ideas — gathering stage, no pricing locked, nothing
   in production yet. Registered here now so these types are
   already on file and logTransaction() doesn't need reshaping
   later when pricing lands. All five are "Paid · Chips" (always
   negative) and are pull-back spends, not tied to a specific pack:
   type: "fusion"    — morph a card's finish (Normal → Holo → Holo Foil).
                        Cosmetic only — never touches tier or redemption value.
   type: "kickstart" — chips put toward funding the next deck's release
                        (ties to real deck cost, $555+ per deck)
   type: "raffle"    — chips spent on raffle entries (main pull-back
                        mechanic — prizes are cards and/or cosmetics)
   type: "sleeve"    — cosmetic border/sleeve upgrade, pure flex spend
   type: "showcase"  — featured display slot for a player's best pulls

   type: "share"     — Free · Growth. Sharing the app earns a free pack.
                        NOT a chip sink — amount is always 0, this is an
                        acquisition/growth lever, logged for history only
                        and excluded from chip allocation totals.

   entry shape: { type, label, amount, rarity, ts }
   rarity is optional — only buy/sell entries carry a tier dot.
   ---------------------------------------------------------- */

// Chip-Spend Ideas types — grouped so the allocation breakdown can
// bucket them together as "Other Chip Spend" without hardcoding
// each name in multiple places once pricing is locked.
const CHIP_SPEND_TYPES = ["fusion", "kickstart", "raffle", "sleeve", "showcase"];

function ensureLedger(state){
  if (!Array.isArray(state.ledger)) state.ledger = [];
  return state;
}

function logTransaction(state, entry){
  ensureLedger(state);
  state.ledger.unshift(Object.assign({ ts: Date.now() }, entry));
  saveState(state);
}

/* ---- WALLET (header) ---------------------------------------- */

function renderWallet(){
  const amt = document.getElementById("walletAmt");
  if (amt) amt.textContent = fmt(window.walletRow ? window.walletRow.balance : 0);
}

/* ---- LEDGER OVERLAY -------------------------------------------- */

let ledgerFilter = "all";

function openLedger(){
  document.body.classList.add("ledger-locked");
  document.getElementById("ledgerOverlay").classList.add("open");
  renderLedgerStats();
  renderLedgerBody();
}

function closeLedger(){
  document.body.classList.remove("ledger-locked");
  document.getElementById("ledgerOverlay").classList.remove("open");
}

function renderLedgerStats(){
  const row = window.walletRow || {};
  document.getElementById("statAllCount").textContent =
    fmt((row.buys||0)+(row.sells||0)+(row.fused_cards||0)+(row.cash_outs||0)+(row.raffle_tickets||0)+(row.shares||0));
  document.getElementById("statBoughtCount").textContent = fmt(row.buys||0);
  document.getElementById("statSoldCount").textContent = fmt(row.sells||0);
  document.getElementById("statAllocValue").textContent = fmt(row.balance||0);

  document.querySelectorAll(".ledger-filter").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.filter === ledgerFilter);
  });
}

function statRow(label, value){
  return `<div class="alloc-stat"><div class="as-label">${label}</div><div class="as-amt mono">${fmt(value)}</div></div>`;
}

function renderLedgerBody(){
  const body = document.getElementById("ledgerBody");
  const row = window.walletRow;

  if (!row){
    body.innerHTML = `<div class="ledger-empty">No wallet yet.</div>`;
    return;
  }

  if (ledgerFilter === "bought"){
    body.innerHTML = `<div class="alloc-grid">${statRow("Packs Bought", row.buys||0)}</div>`;
    return;
  }
  if (ledgerFilter === "sold"){
    body.innerHTML = `<div class="alloc-grid">${statRow("Cards Sold", row.sells||0)}</div>`;
    return;
  }
  if (ledgerFilter === "allocation"){
    body.innerHTML = `<div class="alloc-grid">
      ${statRow("Packs Bought", row.buys||0)}
      ${statRow("Cards Sold", row.sells||0)}
      ${statRow("Fused Cards", row.fused_cards||0)}
      ${statRow("Cash Outs", row.cash_outs||0)}
      ${statRow("Raffle Tickets", row.raffle_tickets||0)}
      ${statRow("Shares", row.shares||0)}
      ${statRow("Sleeve", row.sleeve ? "Yes" : "No")}
      ${statRow("Showcase", row.showcase ? "Yes" : "No")}
      <div class="alloc-stat net">${statRow("Current Balance", row.balance||0)}</div>
    </div>`;
    return;
  }

  // "all"
  body.innerHTML = `<div class="alloc-grid">
    ${statRow("Packs Bought", row.buys||0)}
    ${statRow("Cards Sold", row.sells||0)}
    ${statRow("Fused Cards", row.fused_cards||0)}
    ${statRow("Cash Outs", row.cash_outs||0)}
    ${statRow("Raffle Tickets", row.raffle_tickets||0)}
    ${statRow("Shares", row.shares||0)}
    ${statRow("Sleeve", row.sleeve ? "Yes" : "No")}
    ${statRow("Showcase", row.showcase ? "Yes" : "No")}
    ${statRow("Balance", row.balance||0)}
  </div>`;
}

function wireLedgerControls(){
  document.getElementById("walletTrigger").addEventListener("click", ()=>{
    requireAccount(()=>openLedger());
  });
  document.getElementById("ledgerCloseBtn").addEventListener("click", closeLedger);
  document.querySelectorAll(".ledger-filter").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      ledgerFilter = btn.dataset.filter;
      renderLedgerStats();
      renderLedgerBody();
    });
  });
}

renderWallet();
wireLedgerControls();
wireSignupControls();

autoSignInByIp().then(()=>{ renderWallet(); subscribeToWalletLedger(); });

document.addEventListener("visibilitychange", ()=>{
  if (document.visibilityState === "visible"){
    autoSignInByIp().then(()=>{ renderWallet(); subscribeToWalletLedger(); });
  }
});
</script>

</body>
</html>
