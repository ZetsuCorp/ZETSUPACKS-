<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZETSU PACKZ — Pack Opening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A;
  --panel:#141414;
  --panel-2:#1B1B1B;
  --line:#3D3D3D;
  --ink:#EDE6DC;
  --muted:#8F8A82;
  --brass:#D4AF6A;
  --brass-dim:#8A7245;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
}

/* Full-screen overlay footprint — same pattern as the ledger
   overlay, so this drops into shop.html the same way wallet-ledger
   does: fetched and injected, not copy-pasted. */
#stage{
  position:fixed; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:24px;
  padding:12px;
}

/* ============================================================
   PACK CONTAINER — same markup/CSS as packs-section.html, so the
   pack being opened is visually identical to the one in the shop
   carousel.
   ============================================================ */
.pack-slot{
  flex:0 0 auto;
  /* Constrained by width AND height — the card's aspect ratio
     (~1.9 tall) means a width-only clamp let it run off the top
     and bottom of the screen on normal-height viewports. 38vh
     keeps the whole card (art + deck-info bar) comfortably
     inside the visible area, with room left for the button. */
  width:clamp(240px, min(70vw, 38vh), 460px);
  position:relative;
}
.pack-container{
  width:100%;
  position:relative;
  display:flex;
  flex-direction:column;
  border-radius:18px;
  background:linear-gradient(180deg, var(--panel-2), var(--panel) 55%, #0D0D0D);
  border:1px solid var(--line);
  overflow:hidden;
  transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
  z-index:1;
}
.pack-container::after{
  content:"";
  position:absolute;
  left:8%; right:8%; bottom:-26px;
  height:34px;
  background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);
  filter:blur(4px);
  z-index:-1;
}
.pack-container::before{
  content:"";
  position:absolute; inset:-40%;
  background:conic-gradient(from 0deg, var(--tier-a), var(--tier-b), var(--tier-c), var(--tier-a));
  opacity:.22; /* brighter baseline glow than the resting carousel pack (.14) — this pack is the hero moment */
  filter:blur(30px);
  z-index:-1;
}

.deck-info{
  display:flex; align-items:center;
  gap:12px; white-space:nowrap;
  padding:20px 22px 18px;
  border-bottom:4px solid var(--line);
}
.deck-mark{
  flex:0 0 auto;
  width:26px;height:26px;
  background:linear-gradient(135deg,var(--brass),var(--brass-dim));
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
}
.deck-name{
  font-size:15px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.deck-name b{ color:var(--ink); font-weight:700; }

.pack-stage{
  position:relative;
  overflow:hidden;
  aspect-ratio: 245 / 467;
}
.pack-art{
  position:absolute;
  width:155.51%;
  left:-27.755%;
  top:-17.559%;
  height:auto;
  display:block;
  filter:drop-shadow(0 18px 26px rgba(0,0,0,.55));
}
.tier-layer{
  position:absolute; inset:0;
  z-index:2;
  pointer-events:none;
  overflow:hidden;
}
.tier-layer::before{
  content:"";
  position:absolute; inset:-20% -60%;
  background:linear-gradient(100deg,
    transparent 35%,
    var(--tier-a) 47%,
    var(--tier-b) 50%,
    var(--tier-c) 53%,
    transparent 65%);
  opacity:.7; /* brighter sheen than the resting carousel pack (.55) */
  mix-blend-mode:screen;
  animation:sheen-sweep 4.5s ease-in-out infinite;
}
@keyframes sheen-sweep{
  0%{ transform:translateX(-60%) translateY(-20%); }
  50%{ transform:translateX(60%) translateY(20%); }
  100%{ transform:translateX(-60%) translateY(-20%); }
}

/* ============================================================
   SPARKLES — same two-layer system (behind/in-front) and same
   twinkle keyframes as packs-section.html, reused rather than
   redrawn. Point sets are denser and each sparkle runs bigger
   and glows harder, since this is the hero moment, not the
   resting carousel state.
   ============================================================ */
.pack-sparkles{
  position:absolute;
  inset:-60px;
  opacity:1;
  pointer-events:none;
}
.pack-sparkles.behind{ z-index:0; }
.pack-sparkles.infront{ z-index:4; }

.sparkle{
  position:absolute;
  border-radius:50%;
  animation:sparkle-rise ease-in-out infinite;
}
.sparkle.white{
  background:#FFFFFF;
  box-shadow:0 0 5px 1px rgba(255,255,255,.6), 0 0 1px 0.5px #FFFFFF;
}
.sparkle.gold{
  background:#F2D08A;
  box-shadow:0 0 6px 1px rgba(242,208,138,.6), 0 0 1px 0.5px #F2D08A;
}
@keyframes sparkle-rise{
  0%{ opacity:0; transform:translateY(6px) scale(.5); }
  15%{ opacity:.65; transform:translateY(2px) scale(.85); }
  50%{ opacity:.5; transform:translateY(-8px) scale(1); }
  85%{ opacity:.35; transform:translateY(-16px) scale(.9); }
  100%{ opacity:0; transform:translateY(-22px) scale(.6); }
}

/* Extra surge layer — only shown during the opening/tear beat,
   for an additional burst of brighter sparkles on top of the
   ambient field above. */
.pack-sparkles.surge{
  opacity:0;
  transition:opacity .2s ease;
}
.pack-sparkles.surge.show{ opacity:1; }
.pack-sparkles.surge .sparkle{
  animation-duration:.6s;
}

/* Stage: idle, just-purchased. Gentle float, waiting on the player. */
.pack-container.is-idle{
  animation:idle-float 3.2s ease-in-out infinite;
}
@keyframes idle-float{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-10px); }
}

/* Stage: opening — a building shake/pulse once the player commits.
   Runs once so it has a real end for animationend to fire on —
   that's what unlocks the next Continue click. */
.pack-container.is-opening{
  animation:pack-shake 1.6s cubic-bezier(.36,.07,.19,.97) both;
}
@keyframes pack-shake{
  0%{ transform:scale(1) rotate(0deg); }
  10%{ transform:scale(1.02) rotate(-1deg); }
  20%{ transform:scale(1.02) rotate(1deg); }
  30%{ transform:scale(1.04) rotate(-1.5deg); }
  40%{ transform:scale(1.04) rotate(1.5deg); }
  50%{ transform:scale(1.06) rotate(-2deg); }
  60%{ transform:scale(1.06) rotate(2deg); }
  70%{ transform:scale(1.09) rotate(-2.5deg); }
  80%{ transform:scale(1.09) rotate(2.5deg); }
  90%{ transform:scale(1.14) rotate(-1deg); }
  100%{ transform:scale(1.14) rotate(0deg); }
}
.pack-container.is-opening::before{
  animation:tell-glow 1.6s ease-in-out both;
}
@keyframes tell-glow{
  0%{ opacity:.22; }
  100%{ opacity:.85; }
}

/* Stage: tear — the pack splits into two halves along a jagged
   line and pulls apart. */
.tear-half{
  position:absolute; inset:0;
  display:none;
}
.tear-half.show{ display:block; }
.tear-half .pack-container{
  transition:none; /* the tear keyframes drive movement, not the hover transition */
}
.tear-half.left.animate{
  animation:tear-left .75s cubic-bezier(.36,.07,.4,.97) both;
}
.tear-half.right.animate{
  animation:tear-right .75s cubic-bezier(.36,.07,.4,.97) both;
}
@keyframes tear-left{
  0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
  100%{ transform:translate(-180px,32px) rotate(-22deg); opacity:0; }
}
@keyframes tear-right{
  0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
  100%{ transform:translate(180px,32px) rotate(22deg); opacity:0; }
}
#flash{
  position:fixed; inset:0;
  background:#FFFFFF;
  opacity:0;
  pointer-events:none;
  z-index:10;
}
#flash.hit{
  animation:flash-pop .5s ease-out both;
}
@keyframes flash-pop{
  0%{ opacity:0; }
  30%{ opacity:.95; }
  100%{ opacity:0; }
}

/* Presentation screen placeholder */
#presentation{
  display:none;
  flex-direction:column;
  align-items:center;
  gap:18px;
  text-align:center;
}
#presentation.show{ display:flex; }
#presentation h2{
  margin:0;
  font-family:'Fredoka',sans-serif;
  font-size:22px; font-weight:700;
  text-transform:uppercase; letter-spacing:.04em;
}
#presentation p{
  margin:0; color:var(--muted); font-size:13px; max-width:340px;
}

.continue-btn{
  border:none; border-radius:3px;
  padding:14px 28px;
  font-size:12px; font-weight:800;
  letter-spacing:.12em; text-transform:uppercase;
  background:var(--brass); color:#141414;
  cursor:pointer;
  transition:filter .15s ease, transform .1s ease, opacity .2s ease;
}
.continue-btn:hover{ filter:brightness(1.08); }
.continue-btn:active{ transform:scale(.97); }
.continue-btn[hidden]{ display:none; }

/* ============================================================
   STAGE: SELECT — a row of 5 instances of the pack tier just
   bought (same art/tier, only the physical copy differs), so
   the player picks *which one* to tear open. Same carousel
   mechanics as packs-section.html (scroll-snap + closest-to-
   center detection), just a compact single-tier version scoped
   to this page. Sits between the idle hero pack (now hidden
   until a choice is confirmed) and the shake stage.
   ============================================================ */
#selectStage{
  display:flex; flex-direction:column; align-items:center; gap:18px;
  width:100%;
}
.select-label{
  font-size:11px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--muted); font-weight:700;
}
.select-carousel{
  position:relative;
  width:100%;
  height:clamp(280px, 62vh, 460px); /* scales with viewport instead of a fixed
                                        460px — that fixed height is what let
                                        the wheel overflow the top on shorter
                                        viewports */
  touch-action:pan-y; /* horizontal drag is handled manually below; don't let the
                          browser also try to scroll/zoom on it */
  user-select:none;
  -webkit-user-select:none;
}
/* Soft gold flash behind the whole wheel while it's actively spinning —
   the "whoosh" cue that something moved, independent of any one pack. */
.select-carousel::before{
  content:"";
  position:absolute; left:50%; bottom:6px;
  width:300px; height:300px;
  margin-left:-150px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(212,175,106,.32), transparent 70%);
  opacity:0;
  transition:opacity .35s ease;
  pointer-events:none;
  z-index:0;
}
.select-carousel.is-spinning::before{ opacity:1; }
.select-slot{
  position:absolute;
  left:50%; bottom:6px;
  /* Same clamp pattern as the hero pack-slot (width:clamp(240px, min(70vw,
     38vh), 460px)) so the wheel packs scale down together with it on short
     viewports instead of staying a fixed size and overflowing. */
  width:clamp(150px, min(30vw, 26vh), 230px);
  cursor:pointer;
  transition:transform .45s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
}
/* This wheel sits at a smaller, non-hero size, so it should read like the
   compact packs in packs-section.html's own carousel — not like the big
   hero pack's deck-info bar, which is sized for a much wider container. */
.select-slot .deck-info{ padding:14px 16px 12px; }
.select-slot .deck-mark{ width:18px; height:18px; }
.select-slot .deck-name{ font-size:11px; }
.select-slot.dragging{ transition:none; } /* live 1:1 feedback while the pointer is down */
.wheel-wrap{ position:relative; width:100%; }
.wheel-arrow{
  position:absolute; top:56%; transform:translateY(-50%);
  z-index:20;
  width:44px; height:44px; border-radius:50%;
  border:2px solid var(--line);
  background:rgba(0,0,0,.55);
  color:var(--ink);
  font-size:15px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:border-color .2s ease, background .2s ease, transform .1s ease;
}
.wheel-arrow:hover{ border-color:var(--brass-dim); background:rgba(0,0,0,.75); }
.wheel-arrow:active{ transform:translateY(-50%) scale(.92); }
.wheel-arrow.left{ left:6px; }
.wheel-arrow.right{ right:6px; }
/* Motion blur on the art itself while spinning — reads as speed on
   top of the gold flash and sparkle burst, same "swoosh" beat. */
.select-carousel.is-spinning .select-slot .pack-art{
  filter:blur(2.5px);
  transition:filter .15s ease;
}
.select-carousel:not(.is-spinning) .select-slot .pack-art{
  filter:blur(0px);
  transition:filter .3s ease .1s;
}
.select-slot .pack-container{
  animation:select-idle 5s ease-in-out infinite;
  transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
}
@keyframes select-idle{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
}
.select-slot.is-active .pack-container{
  animation:select-active 2.6s ease-in-out infinite;
  box-shadow:0 26px 50px -16px rgba(0,0,0,.65), 0 0 34px -8px var(--tier-b);
}
@keyframes select-active{
  0%,100%{ transform:scale(1.1) translateY(0); }
  50%{ transform:scale(1.15) translateY(-6px); }
}
</style>
</head>
<body>

<div id="flash"></div>

<div id="stage">

  <div id="selectStage">
    <div class="select-label">Choose Your Pack</div>
    <div class="wheel-wrap">
      <button class="wheel-arrow left" id="wheelPrev" type="button" aria-label="Previous pack">&#10094;</button>
      <div class="select-carousel" id="selectCarousel"></div>
      <button class="wheel-arrow right" id="wheelNext" type="button" aria-label="Next pack">&#10095;</button>
    </div>
  </div>

  <div class="pack-slot" id="packSlot" style="display:none;">
    <div class="pack-container is-idle" id="packContainer">
      <div class="deck-info">
        <div class="deck-mark"></div>
        <div class="deck-name">Deck · <b>ZETSUMETSU EOe</b></div>
      </div>
      <div class="pack-stage">
        <img class="pack-art" id="packArt" alt="pack">
        <div class="tier-layer"></div>
      </div>
    </div>
    <div class="pack-sparkles behind" id="sparklesBehind"></div>
    <div class="pack-sparkles infront" id="sparklesInfront"></div>
    <div class="pack-sparkles infront surge" id="sparklesSurge"></div>
  </div>

  <div id="presentation">
    <img id="revealedCardImage" alt="" style="display:none; max-width:220px; border-radius:12px;">
    <h2 id="revealedCardName">No Card Found</h2>
    <p id="revealedCardFallback">Continuing without a card — nothing came back from the last fetch.</p>
  </div>

  <button class="continue-btn" id="continueBtn">Select Pack</button>
</div>

<script>
/* ==========================================================
   PACK DATA — same tier set as packs-section.html. The pack
   being opened is picked by id via ?pack= in the URL (this is
   how shop.html will hand off which pack was bought); falls
   back to "epic" if none is given.
   ========================================================== */
const PACKS = [
  { id:"common",    name:"Common",    art:"assets/S0pack.png", tierColors:["#8C8880","#ADA9A2","#6E6A64"] },
  { id:"rare",      name:"Rare",      art:"assets/S0pack.png", tierColors:["#4FB6A8","#7FD8CC","#2E7A70"] },
  { id:"epic",      name:"Epic",      art:"assets/S0pack.png", tierColors:["#9B6BD6","#C39BF0","#6B3FA0"] },
  { id:"legendary", name:"Legendary", art:"assets/S0pack.png", tierColors:["#E8A23D","#F5C46B","#B8781F"] },
  { id:"mythic",    name:"Mythic",    art:"assets/S0pack.png", tierColors:["#FF6B9D","#C77DFF","#4FD1E5"] }
];

function getSelectedPack(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get("pack");
  return PACKS.find(p => p.id === id) || PACKS.find(p => p.id === "epic");
}

const selectedPack = getSelectedPack();

const pack = document.getElementById("packContainer");
const packArt = document.getElementById("packArt");
const btn = document.getElementById("continueBtn");
const presentation = document.getElementById("presentation");
const packSlot = document.getElementById("packSlot");
const flash = document.getElementById("flash");

// Apply the selected pack's own tier colors and art — nothing
// about the shine is hardcoded to one pack.
const [tierA, tierB, tierC] = selectedPack.tierColors;
pack.style.setProperty("--tier-a", tierA);
pack.style.setProperty("--tier-b", tierB);
pack.style.setProperty("--tier-c", tierC);
packArt.src = selectedPack.art;
packArt.alt = selectedPack.name + " pack";
packArt.onerror = function(){
  this.style.background = `linear-gradient(160deg, ${tierC}, #1B1B1B)`;
};

/* ----------------------------------------------------------
   SPARKLES — reused point layout from packs-section.html,
   doubled up (jittered copies) for a denser field, since this
   moment should read brighter and busier than the resting
   carousel pack.
   ---------------------------------------------------------- */
const SPARKLE_POINTS_BEHIND = [
  {l:4,  t:6},  {l:16, t:1},  {l:30, t:5},  {l:46, t:0},  {l:62, t:4},
  {l:78, t:1},  {l:92, t:7},  {l:97, t:22}, {l:99, t:40}, {l:98, t:58},
  {l:95, t:76}, {l:88, t:92}, {l:72, t:98}, {l:55, t:100},{l:38, t:97},
  {l:22, t:93}, {l:8,  t:88}, {l:1,  t:70}, {l:0,  t:50}, {l:2,  t:30},
  {l:10, t:14}, {l:24, t:2},  {l:38, t:9},  {l:54, t:1},  {l:70, t:6},
  {l:86, t:2},  {l:99, t:14}, {l:99, t:32}, {l:99, t:50}, {l:99, t:68},
  {l:99, t:86}, {l:80, t:97}, {l:62, t:99}, {l:44, t:96}, {l:26, t:99},
  {l:12, t:96}, {l:0,  t:82}, {l:0,  t:62}, {l:0,  t:42}, {l:0,  t:20}
];
const SPARKLE_POINTS_INFRONT = [
  {l:22, t:18}, {l:68, t:14}, {l:45, t:32}, {l:80, t:46}, {l:14, t:50},
  {l:60, t:62}, {l:30, t:74}, {l:76, t:82}, {l:48, t:92}, {l:10, t:86},
  {l:36, t:10}, {l:88, t:28}, {l:56, t:48}, {l:6,  t:64}, {l:92, t:66},
  {l:40, t:58}, {l:66, t:38}, {l:20, t:38}
];

function jitter(points, dl, dt){
  return points.map(p => ({ l: Math.max(0, Math.min(100, p.l + dl)), t: Math.max(0, Math.min(100, p.t + dt)) }));
}

// Denser field: original points plus two offset passes — more,
// smaller sparkles read better than fewer big ones.
const BEHIND_DENSE = SPARKLE_POINTS_BEHIND
  .concat(jitter(SPARKLE_POINTS_BEHIND, 3, -3))
  .concat(jitter(SPARKLE_POINTS_BEHIND, -3, 3));
const INFRONT_DENSE = SPARKLE_POINTS_INFRONT
  .concat(jitter(SPARKLE_POINTS_INFRONT, -4, 4))
  .concat(jitter(SPARKLE_POINTS_INFRONT, 4, -4));

function makeSparkles(points, idOffset){
  return points.map((p,i)=>{
    const n = i + idOffset;
    const gold = n % 3 === 0;
    const size = 1.5 + (n % 4) * 0.5;      // small: 1.5–3px
    const delay = ((n * 0.47) % 3).toFixed(2);
    const duration = (1.3 + (n % 5) * 0.25).toFixed(2);
    return `<span class="sparkle ${gold?'gold':'white'}" style="left:${p.l}%; top:${p.t}%; width:${size}px; height:${size}px; animation-delay:${delay}s; animation-duration:${duration}s;"></span>`;
  }).join("");
}

document.getElementById("sparklesBehind").innerHTML = makeSparkles(BEHIND_DENSE, 0);
document.getElementById("sparklesInfront").innerHTML = makeSparkles(INFRONT_DENSE, 20);
document.getElementById("sparklesSurge").innerHTML = makeSparkles(INFRONT_DENSE, 60);
const sparklesSurge = document.getElementById("sparklesSurge");

/* ----------------------------------------------------------
   TEAR HALVES — built from the real pack markup (cloned, not
   redrawn), each shown through a clip-path that only reveals
   its side of a jagged line down the middle. Both halves use
   the same point list so the line matches with no gap.
   ---------------------------------------------------------- */
const TEAR_POINTS = [
  {x:50,y:0}, {x:57,y:9}, {x:46,y:18}, {x:60,y:27}, {x:44,y:36},
  {x:58,y:45}, {x:45,y:54}, {x:62,y:63}, {x:47,y:72}, {x:56,y:81},
  {x:50,y:90}, {x:50,y:100}
];
function clipPath(points){
  return "polygon(" + points.map(p=>`${p.x}% ${p.y}%`).join(",") + ")";
}
const leftClip = clipPath([{x:0,y:0}, ...TEAR_POINTS, {x:0,y:100}]);
const rightClip = clipPath([{x:100,y:0}, ...TEAR_POINTS, {x:100,y:100}]);

const leftHalf = document.createElement("div");
leftHalf.className = "tear-half left";
leftHalf.style.clipPath = leftClip;
leftHalf.innerHTML = pack.outerHTML.replace('id="packContainer"', "");

const rightHalf = document.createElement("div");
rightHalf.className = "tear-half right";
rightHalf.style.clipPath = rightClip;
rightHalf.innerHTML = pack.outerHTML.replace('id="packContainer"', "");

packSlot.appendChild(leftHalf);
packSlot.appendChild(rightHalf);

/* ----------------------------------------------------------
   STAGE: SELECT — 5 instances of the pack tier just bought
   (identical art/tier, only which physical copy differs),
   arranged in a circle like a spin-wheel: one at 6 o'clock
   is "front" (large, selectable), the rest arc up behind it.
   Drag left/right to spin the wheel, or tap any pack to spin
   it to the front directly. "Select Pack" confirms whichever
   pack is at front and kicks off the settle → shake → tear
   chain below.
   ---------------------------------------------------------- */
const SELECT_COUNT = 7;
const WHEEL_STEP = 360 / SELECT_COUNT;
const WHEEL_Y_COMPRESS = 0.4; // flattens the arc vertically so packs don't
                               // need an enormous vertical footprint
let WHEEL_RADIUS = 260; // recomputed from the actual rendered slot width
                         // below — this is just a starting value

const selectStage = document.getElementById("selectStage");
const selectCarousel = document.getElementById("selectCarousel");

let wheelRotation = 0; // degrees; slot i sits at (wheelRotation + i*WHEEL_STEP)

function normalizeDeg(a){ return ((a % 360) + 360) % 360; }

// The wheel packs use width:clamp(...) so they shrink on short viewports
// along with the hero pack. The spacing has to shrink with them, so the
// radius is derived from whatever the slots are actually rendered at
// right now, not a fixed pixel value.
function updateWheelRadius(){
  const sample = selectCarousel.querySelector(".select-slot");
  const slotWidth = sample ? sample.getBoundingClientRect().width : 230;
  WHEEL_RADIUS = slotWidth * 1.3;
}

// Lighter sparkle sets for the mini wheel packs — same points used
// for the hero pack, just thinned out so 7 packs' worth of sparkles
// don't turn into visual noise at this size.
const MINI_SPARKLE_BEHIND = SPARKLE_POINTS_BEHIND.filter((_, i) => i % 3 === 0);
const MINI_SPARKLE_INFRONT = SPARKLE_POINTS_INFRONT.filter((_, i) => i % 2 === 0);

function renderSelectCarousel(){
  selectCarousel.innerHTML = Array.from({length: SELECT_COUNT}).map((_, i) => `
    <div class="select-slot" data-idx="${i}">
      <div class="pack-container" style="--tier-a:${tierA}; --tier-b:${tierB}; --tier-c:${tierC};">
        <div class="deck-info">
          <div class="deck-mark"></div>
          <div class="deck-name">Deck · <b>ZETSUMETSU EOe</b></div>
        </div>
        <div class="pack-stage">
          <img class="pack-art" src="${selectedPack.art}" alt="${selectedPack.name} pack">
          <div class="tier-layer"></div>
        </div>
      </div>
      <div class="pack-sparkles behind">${makeSparkles(MINI_SPARKLE_BEHIND, i * 7)}</div>
      <div class="pack-sparkles infront">${makeSparkles(MINI_SPARKLE_INFRONT, i * 7 + 40)}</div>
      <div class="pack-sparkles infront surge">${makeSparkles(MINI_SPARKLE_INFRONT, i * 7 + 80)}</div>
    </div>`).join("");
}

// Places every slot on the arc for the current wheelRotation. Angle 0
// (mod 360) is the front/anchor spot at the bottom of the wheel;
// distance from there drives how big, bright, and frontmost each
// pack reads — that's what actually sells the "circle" shape, not
// just the (x,y) position.
function layoutWheel(){
  selectCarousel.querySelectorAll(".select-slot").forEach(slot => {
    const i = Number(slot.dataset.idx);
    const angleDeg = normalizeDeg(wheelRotation + i * WHEEL_STEP);
    const rad = angleDeg * Math.PI / 180;
    const x = WHEEL_RADIUS * Math.sin(rad);
    const y = (-WHEEL_RADIUS + WHEEL_RADIUS * Math.cos(rad)) * WHEEL_Y_COMPRESS;
    const front = Math.cos(rad); // 1 at the front spot, -1 at the back of the wheel
    const scale = 0.55 + 0.45 * ((front + 1) / 2);
    const opacity = 0.35 + 0.65 * ((front + 1) / 2);
    slot.style.transform = `translate(calc(-50% + ${x}px), ${y}px) scale(${scale})`;
    slot.style.opacity = opacity;
    slot.style.zIndex = Math.round((front + 1) * 50);
    const distFromFront = Math.min(angleDeg, 360 - angleDeg);
    slot.classList.toggle("is-active", distFromFront < WHEEL_STEP / 2);
  });
}

// Movement FX — the gold flash behind the wheel, the motion blur on
// each pack's art, and a burst from each pack's own surge sparkle
// layer (the same layer/keyframes the hero pack uses for its own
// tear-moment surge). All three turn on together for any spin,
// whether it's a drag or a tap-to-select, and turn off once the
// wheel settles.
function startSpinFX(){
  selectCarousel.classList.add("is-spinning");
  selectCarousel.querySelectorAll(".pack-sparkles.surge").forEach(s => s.classList.add("show"));
}
function stopSpinFX(){
  selectCarousel.classList.remove("is-spinning");
  selectCarousel.querySelectorAll(".pack-sparkles.surge").forEach(s => s.classList.remove("show"));
}
let spinFxTimer = null;
function pulseSpinFX(duration){
  startSpinFX();
  clearTimeout(spinFxTimer);
  spinFxTimer = setTimeout(stopSpinFX, duration);
}

// Tapping a pack (not dragging) spins the wheel to bring that exact
// pack to the front spot.
function spinToIndex(i){
  wheelRotation = normalizeDeg(-i * WHEEL_STEP);
  layoutWheel();
  pulseSpinFX(480); // matches the .45s CSS transition on .select-slot's transform
}

selectCarousel.addEventListener("click", (e) => {
  if (selectCarousel.dataset.wasDrag === "1") return; // a drag just ended on this same pointerup; not a tap
  const slot = e.target.closest(".select-slot");
  if (!slot) return;
  spinToIndex(Number(slot.dataset.idx));
});

/* ---- arrow buttons — same spinToIndex() the drag/tap use, just
   stepping one pack at a time off the wheel's current front index ---- */
const wheelPrev = document.getElementById("wheelPrev");
const wheelNext = document.getElementById("wheelNext");

function currentFrontIndex(){
  return ((Math.round(-wheelRotation / WHEEL_STEP) % SELECT_COUNT) + SELECT_COUNT) % SELECT_COUNT;
}
function stepWheel(delta){
  const next = ((currentFrontIndex() + delta) % SELECT_COUNT + SELECT_COUNT) % SELECT_COUNT;
  spinToIndex(next);
}
wheelPrev.addEventListener("click", () => stepWheel(-1));
wheelNext.addEventListener("click", () => stepWheel(1));

/* ---- drag-to-spin ---- */
let dragging = false, dragStartX = 0, dragStartRotation = 0, dragMoved = false;
const DRAG_SENSITIVITY = 0.42; // degrees rotated per pixel dragged

function setDraggingVisual(on){
  selectCarousel.querySelectorAll(".select-slot").forEach(s => s.classList.toggle("dragging", on));
}

selectCarousel.addEventListener("pointerdown", (e) => {
  dragging = true; dragMoved = false;
  dragStartX = e.clientX;
  dragStartRotation = wheelRotation;
  selectCarousel.dataset.wasDrag = "0";
  setDraggingVisual(true);
  clearTimeout(spinFxTimer);
  startSpinFX();
  selectCarousel.setPointerCapture(e.pointerId);
});
selectCarousel.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - dragStartX;
  if (Math.abs(dx) > 4) dragMoved = true;
  wheelRotation = normalizeDeg(dragStartRotation + dx * DRAG_SENSITIVITY);
  layoutWheel();
});
function endDrag(){
  if (!dragging) return;
  dragging = false;
  setDraggingVisual(false);
  // Snap to the nearest pack rather than leaving the wheel mid-spin.
  wheelRotation = normalizeDeg(Math.round(wheelRotation / WHEEL_STEP) * WHEEL_STEP);
  layoutWheel();
  pulseSpinFX(480); // the snap itself is a (short) spin too — keep the FX through it
  if (dragMoved) selectCarousel.dataset.wasDrag = "1"; // suppress the click firing right after this pointerup
}
selectCarousel.addEventListener("pointerup", endDrag);
selectCarousel.addEventListener("pointercancel", endDrag);

renderSelectCarousel();
updateWheelRadius();
layoutWheel();
window.addEventListener("resize", () => {
  updateWheelRadius();
  layoutWheel();
});

/* ==========================================================
   STAGE MACHINE — every stage waits on a click. animationend
   only tells us a CSS animation finished playing; it never
   advances the stage on its own — the button click still does.
   ========================================================== */
let stage = 0; // 0 = choosing which pack instance, 1 = shake, 2 = tear, 3 = presentation, 4 = exit

function goStageSettle(){
  btn.hidden = true;

  const activeSlot = selectCarousel.querySelector(".select-slot.is-active .pack-container");
  const fromRect = activeSlot.getBoundingClientRect();

  // is-idle drives its own CSS animation on transform (the floating
  // bob). A running CSS animation overrides any transform we set from
  // JS on the same element, which silently breaks the FLIP below and
  // the transitionend it depends on — so it has to come off first,
  // the same way goStage1() already removes it before the shake.
  pack.classList.remove("is-idle");

  // Reveal the hero pack so we can measure where it actually rests,
  // then FLIP it: no-transition jump back to the carousel pack's
  // position, then release the transition next frame so it animates
  // from there into place instead of just popping in.
  packSlot.style.display = "";
  const toRect = pack.getBoundingClientRect();

  const dx = (fromRect.left + fromRect.width / 2) - (toRect.left + toRect.width / 2);
  const dy = (fromRect.top + fromRect.height / 2) - (toRect.top + toRect.height / 2);
  const scale = fromRect.width / toRect.width;

  pack.style.transition = "none";
  pack.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
  pack.style.opacity = "0";
  selectStage.style.transition = "opacity .3s ease";
  selectStage.style.opacity = "0";

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      pack.style.transition = "transform .55s cubic-bezier(.2,.8,.2,1), opacity .3s ease";
      pack.style.transform = "translate(0,0) scale(1)";
      pack.style.opacity = "1";
    });
  });

  // Advance on whichever fires first — the real transitionend, or this
  // fallback timer. Belt-and-suspenders: transitionend can be skipped
  // by the browser in edge cases (e.g. the two rects turning out
  // identical, so nothing actually changes value), and this stage
  // must never be able to strand the player on a dead screen.
  let settled = false;
  function finishSettle(){
    if (settled) return;
    settled = true;
    pack.removeEventListener("transitionend", onSettle);
    clearTimeout(fallbackTimer);
    pack.style.transition = "";
    pack.style.transform = "";
    selectStage.style.display = "none";
    goStage1(); // settling flows straight into the shake — no extra click, same pattern as shake -> tear below
  }
  function onSettle(e){
    if (e.propertyName !== "transform") return;
    finishSettle();
  }
  pack.addEventListener("transitionend", onSettle);
  const fallbackTimer = setTimeout(finishSettle, 650);
}

function goStage1(){
  stage = 1;
  btn.hidden = true;
  pack.classList.remove("is-idle");
  pack.classList.add("is-opening");
  sparklesSurge.classList.add("show");

  pack.addEventListener("animationend", function onShakeEnd(e){
    if (e.animationName !== "pack-shake") return;
    pack.removeEventListener("animationend", onShakeEnd);
    goStage2(); // shake flows straight into the tear — no extra click to trigger the rip itself
  });
}

function goStage2(){
  stage = 2;
  btn.hidden = true;
  pack.style.visibility = "hidden"; // the two halves take over the same spot
  leftHalf.classList.add("show");
  rightHalf.classList.add("show");
  flash.classList.add("hit");

  requestAnimationFrame(()=>{
    leftHalf.classList.add("animate");
    rightHalf.classList.add("animate");
  });

  rightHalf.addEventListener("animationend", function onTearEnd(e){
    if (e.animationName !== "tear-right") return;
    rightHalf.removeEventListener("animationend", onTearEnd);
    goStage3(); // the rip itself is the trigger — screen changes right after it finishes, no extra click needed
  });
}

function goStage3(){
  stage = 3;
  packSlot.style.display = "none";
  presentation.classList.add("show");
  btn.textContent = "Back to Shop";
  btn.hidden = false;

  const raw = sessionStorage.getItem("zetsu_drawn_card");
  const img = document.getElementById("revealedCardImage");
  const nameEl = document.getElementById("revealedCardName");
  const fallbackEl = document.getElementById("revealedCardFallback");

  if (raw){
    try {
      const card = JSON.parse(raw);
      img.src = card.image;
      img.alt = card.card || card.name || "Card";
      img.style.display = "block";
      nameEl.textContent = card.card || card.name || "Unknown Card";
      fallbackEl.style.display = "none";
    } catch(e){
      console.error("Failed to parse drawn card from sessionStorage:", e);
    }
    sessionStorage.removeItem("zetsu_drawn_card"); // one-time reveal, don't leave it for the next pack
  }
}

function goStage4(){
  stage = 4;
  //  this hands back to shop.html.
  window.location.href = "shop.html";
}

btn.addEventListener("click", ()=>{
  // Only these two are ever reachable by click — stage 1 (shake) and
  // stage 2 (tear) both auto-advance themselves via animationend
  // above, and hide the button while they run.
  if (stage === 0) goStageSettle();
  else if (stage === 3) goStage4();
});
</script>
</body>
</html>
