<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZETSU POPULARITY — Public Ledger</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --bg: #050505;
            --panel: #0d0d0d;
            --panel-hover: #111111;

            --border: #242424;
            --border-bright: #3a3a3a;

            --text: #f5f5f5;
            --muted: #858585;
            --dim: #555555;

            --common: #bdbdbd;
            --epic: #a875ff;
            --legendary: #ffb347;
            --mythic: #ff4d8d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            width: 100%;

            background: var(--bg);
            color: var(--text);

            font-family: "Fredoka", sans-serif;
        }

        body {
            min-height: 100vh;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        header {
            width: 100%;

            border-bottom: 1px solid var(--border);

            background: #050505;
        }

        .header-inner {
            width: min(1400px, calc(100% - 40px));
            min-height: 82px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;

            display: grid;
            place-items: center;

            border: 1px solid var(--border-bright);
            background: #0b0b0b;

            font-size: 18px;
            font-weight: 700;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .brand-sub {
            margin-top: 2px;

            color: var(--muted);

            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 8px;

            color: var(--muted);

            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .live-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #ffffff;
        }

        /* =========================================================
           MAIN
        ========================================================= */

        main {
            width: min(1400px, calc(100% - 40px));

            margin: 0 auto;

            padding: 48px 0 70px;
        }

        .heading {
            margin-bottom: 34px;
        }

        .eyebrow {
            margin-bottom: 10px;

            color: var(--muted);

            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;

            font-size: clamp(40px, 6vw, 72px);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -0.045em;
        }

        .description {
            max-width: 720px;

            margin-top: 18px;

            color: var(--muted);

            font-size: 15px;
            line-height: 1.6;
        }

        /* =========================================================
           LEDGER HEADER
        ========================================================= */

        .ledger-header {
            min-height: 58px;

            padding: 0 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border: 1px solid var(--border);
            background: var(--panel);
        }

        .ledger-heading {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .ledger-count {
            margin-left: 8px;

            color: var(--muted);

            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
        }

        /* =========================================================
           LEADERBOARD
        ========================================================= */

        .leaderboard {
            margin-top: 8px;

            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .leader-row {
            min-height: 112px;

            display: grid;

            grid-template-columns:
                72px
                minmax(280px, 1.8fr)
                repeat(6, minmax(80px, 0.7fr));

            border: 1px solid var(--border);
            background: var(--panel);

            overflow: hidden;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .leader-row:hover {
            background: var(--panel-hover);
            border-color: var(--border-bright);
        }

        /* =========================================================
           RANK
        ========================================================= */

        .rank {
            display: flex;
            align-items: center;
            justify-content: center;

            border-right: 1px solid var(--border);

            color: var(--muted);

            font-size: 22px;
            font-weight: 700;
        }

        .rank.top-three {
            color: var(--text);
        }

        /* =========================================================
           CARD
        ========================================================= */

        .card-cell {
            min-width: 0;

            padding: 14px 18px;

            display: flex;
            align-items: center;

            gap: 16px;
        }

        .card-image {
            width: 64px;
            height: 84px;

            flex: 0 0 auto;

            object-fit: cover;

            border: 1px solid var(--border-bright);

            background: #080808;
        }

        .card-placeholder {
            width: 64px;
            height: 84px;

            flex: 0 0 auto;

            display: grid;
            place-items: center;

            border: 1px solid var(--border-bright);

            background: #080808;

            color: var(--dim);

            font-size: 9px;
            text-align: center;
            text-transform: uppercase;
        }

        .card-info {
            min-width: 0;
        }

        .card-name {
            overflow: hidden;

            color: var(--text);

            font-size: 18px;
            font-weight: 700;
            line-height: 1.1;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-deck {
            margin-top: 5px;

            overflow: hidden;

            color: var(--muted);

            font-size: 12px;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tier {
            display: inline-block;

            margin-top: 8px;
            padding: 3px 7px;

            border: 1px solid currentColor;

            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .tier-common {
            color: var(--common);
        }

        .tier-epic {
            color: var(--epic);
        }

        .tier-legendary {
            color: var(--legendary);
        }

        .tier-mythic {
            color: var(--mythic);
        }

        /* =========================================================
           STATS
        ========================================================= */

        .stat {
            min-width: 0;

            padding: 14px 12px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            border-left: 1px solid var(--border);
        }

        .stat-label {
            color: var(--dim);

            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .stat-value {
            margin-top: 5px;

            color: var(--text);

            font-size: 20px;
            font-weight: 700;
        }

        /* =========================================================
           STATES
        ========================================================= */

        .message {
            min-height: 220px;

            padding: 40px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            border: 1px solid var(--border);
            background: var(--panel);

            text-align: center;
        }

        .message-title {
            font-size: 20px;
            font-weight: 700;
        }

        .message-copy {
            max-width: 500px;

            margin-top: 8px;

            color: var(--muted);

            font-size: 13px;
            line-height: 1.5;
        }

        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            width: 100%;

            border-top: 1px solid var(--border);

            background: #050505;
        }

        .footer-inner {
            width: min(1400px, calc(100% - 40px));
            min-height: 64px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .footer-copy {
            color: var(--dim);

            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 1100px) {

            .leader-row {
                grid-template-columns:
                    64px
                    minmax(240px, 1.5fr)
                    repeat(3, minmax(80px, 0.7fr));
            }

            .stat:nth-of-type(n + 4) {
                display: none;
            }
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 720px) {

            .header-inner,
            .footer-inner {
                width: calc(100% - 24px);
            }

            .header-inner {
                min-height: 68px;
            }

            main {
                width: calc(100% - 24px);

                padding-top: 30px;
            }

            .brand-sub {
                display: none;
            }

            .live-status {
                font-size: 9px;
            }

            .ledger-header {
                padding: 0 12px;
            }

            .leader-row {
                min-height: 96px;

                grid-template-columns:
                    52px
                    minmax(0, 1fr);
            }

            .rank {
                grid-row: 1 / span 2;
            }

            .card-cell {
                padding: 12px;
            }

            .card-image,
            .card-placeholder {
                width: 52px;
                height: 68px;
            }

            .card-name {
                font-size: 16px;
            }

            .stat {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         HEADER
    ========================================================== -->

    <header>
        <div class="header-inner">

            <div class="brand">

                <div class="brand-mark">
                    Z
                </div>

                <div>
                    <div class="brand-name">
                        ZETSU
                    </div>

                    <div class="brand-sub">
                        Public Popularity Ledger
                    </div>
                </div>

            </div>

            <div class="live-status">
                <span class="live-dot"></span>
                Live Ledger
            </div>

        </div>
    </header>


    <!-- =========================================================
         MAIN
    ========================================================== -->

    <main>

        <section class="heading">

            <div class="eyebrow">
                Zetsumetsu Card Network
            </div>

            <h1>
                POPULARITY
            </h1>

            <div class="description">
                The cards currently leading the Zetsu popularity
                ledger.
            </div>

        </section>


        <!-- =====================================================
             LEDGER HEADER
        ====================================================== -->

        <section class="ledger-header">

            <div class="ledger-heading">
                Current Leaders

                <span
                    class="ledger-count"
                    id="ledgerCount"
                >
                    Loading...
                </span>
            </div>

        </section>


        <!-- =====================================================
             LEADERBOARD
        ====================================================== -->

        <section
            class="leaderboard"
            id="leaderboard"
        >

            <div class="message">

                <div class="message-title">
                    Loading ledger
                </div>

                <div class="message-copy">
                    Reading the current popularity data.
                </div>

            </div>

        </section>

    </main>


    <!-- =========================================================
         FOOTER
    ========================================================== -->

    <footer>

        <div class="footer-inner">

            <div class="footer-copy">
                ZETSUMETSU CORPORATION
            </div>

            <div class="footer-copy">
                POPULARITY LEDGER
            </div>

        </div>

    </footer>


    <script>
        /* =========================================================
           SUPABASE
        ========================================================== */

        const SUPABASE_URL =
            "https://jqvnrdjrkdjgjbmqmbbl.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_jmEahTk4OssD_IrOZq_6iQ_P6QFFJr6";

        const {
            createClient
        } = supabase;

        const client = createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        /* =========================================================
           DOM
        ========================================================== */

        const leaderboard =
            document.getElementById("leaderboard");

        const ledgerCount =
            document.getElementById("ledgerCount");


        /* =========================================================
           HELPERS
        ========================================================== */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function formatNumber(value) {

            return Number(value || 0)
                .toLocaleString();
        }


        function getTierClass(tier) {

            const normalized =
                String(tier || "common")
                    .toLowerCase();

            switch (normalized) {

                case "epic":
                    return "tier-epic";

                case "legendary":
                    return "tier-legendary";

                case "mythic":
                    return "tier-mythic";

                default:
                    return "tier-common";
            }
        }


        function renderCardImage(row) {

            if (!row.image) {

                return `
                    <div class="card-placeholder">
                        No Image
                    </div>
                `;
            }

            return `
                <img
                    class="card-image"
                    src="${escapeHtml(row.image)}"
                    alt="${escapeHtml(row.card)}"
                    loading="lazy"
                >
            `;
        }


        /* =========================================================
           RENDER LEADERBOARD
           
           Ranking is intentionally NOT calculated here yet.
           
           The ordering rules will be added after the popularity
           movement system is defined.
        ========================================================== */

        function renderLeaderboard(rows) {

            if (!rows.length) {

                ledgerCount.textContent =
                    "0 cards";

                leaderboard.innerHTML = `
                    <div class="message">

                        <div class="message-title">
                            No popularity data
                        </div>

                        <div class="message-copy">
                            The popularity ledger currently
                            contains no cards.
                        </div>

                    </div>
                `;

                return;
            }


            ledgerCount.textContent =
                `${rows.length} cards`;


            leaderboard.innerHTML =
                rows.map((row, index) => {

                    const rank =
                        index + 1;

                    const rankClass =
                        rank <= 3
                            ? "rank top-three"
                            : "rank";


                    return `
                        <article class="leader-row">

                            <div class="${rankClass}">
                                #${rank}
                            </div>


                            <div class="card-cell">

                                ${renderCardImage(row)}

                                <div class="card-info">

                                    <div class="card-name">
                                        ${escapeHtml(row.card)}
                                    </div>

                                    <div class="card-deck">
                                        ${escapeHtml(row.deck)}
                                    </div>

                                    <span
                                        class="
                                            tier
                                            ${getTierClass(
                                                row.current_tier
                                            )}
                                        "
                                    >
                                        ${escapeHtml(
                                            row.current_tier ||
                                            "common"
                                        )}
                                    </span>

                                </div>

                            </div>


                            <div class="stat">

                                <div class="stat-label">
                                    Buys
                                </div>

                                <div class="stat-value">
                                    ${formatNumber(row.buys)}
                                </div>

                            </div>


                            <div class="stat">

                                <div class="stat-label">
                                    Sales
                                </div>

                                <div class="stat-value">
                                    ${formatNumber(row.sales)}
                                </div>

                            </div>


                            <div class="stat">

                                <div class="stat-label">
                                    Collections
                                </div>

                                <div class="stat-value">
                                    ${formatNumber(
                                        row.total_in_collections
                                    )}
                                </div>

                            </div>


                            <div class="stat">

                                <div class="stat-label">
                                    Fused
                                </div>

                                <div class="stat-value">
                                    ${formatNumber(row.fused)}
                                </div>

                            </div>


                            <div class="stat">

                                <div class="stat-label">
                                    Ascensions
                                </div>

                                <div class="stat-value">
                                    ${formatNumber(
                                        row.ascensions
                                    )}
                                </div>

                            </div>


                            <div class="stat">

                                <div class="stat-label">
                                    Dissections
                                </div>

                                <div class="stat-value">
                                    ${formatNumber(
                                        row.dissections
                                    )}
                                </div>

                            </div>

                        </article>
                    `;
                }).join("");
        }


        /* =========================================================
           LOAD PUBLIC LEDGER
           
           READ ONLY.
           
           No INSERT.
           No UPDATE.
           No DELETE.
           No RPC.
        ========================================================== */

        async function loadLedger() {

            const {
                data,
                error
            } = await client
                .from("popularity_ledger")
                .select(`
                    card,
                    deck,
                    current_tier,
                    previous_tier,
                    threshold,
                    buys,
                    sales,
                    total_in_collections,
                    fused,
                    ascensions,
                    dissections,
                    updated_at
                `);


            if (error) {

                console.error(
                    "Popularity ledger error:",
                    error
                );

                ledgerCount.textContent =
                    "Unavailable";

                leaderboard.innerHTML = `
                    <div class="message">

                        <div class="message-title">
                            Ledger unavailable
                        </div>

                        <div class="message-copy">
                            ${escapeHtml(error.message)}
                        </div>

                    </div>
                `;

                return;
            }


            /*
             * IMPORTANT:
             *
             * No popularity formula exists here yet.
             *
             * The returned rows are passed through in their
             * current database order.
             *
             * Once the card movement rules are provided,
             * the ranking logic will be inserted here.
             */

            renderLeaderboard(
                data || []
            );
        }


        /* =========================================================
           INITIAL LOAD
        ========================================================== */

        loadLedger();
    </script>

</body>
</html>
```
