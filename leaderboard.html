<script>
    const SUPABASE_URL =
        "https://jqvnrdjrkdjgjbmqmbbl.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_jmEahTk4OssD_IrOq_6iQ_P6QFFJr6";

    const { createClient } = supabase;

    const client = createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    let state = {
        collection: [],
        firstVisit: true
    };

    window.state = state;

    function renderHud(state, currentPage) {
        const mount =
            document.getElementById("hud");

        if (!mount) {
            return;
        }

        const pages = [
            {
                id: "leaderboard",
                href: "leaderboard.html",
                label: "Leaderboard"
            },
            {
                id: "start",
                href: "start.html",
                label: "Start"
            },
            {
                id: "shop",
                href: "shop.html",
                label: "Pack Shop"
            }
        ];

        mount.innerHTML = `
            <a class="brand" href="start.html">
                <span class="mark">
                    Zetsumetsu EOe
                </span>

                <h1>
                    ZETSU PACKZ
                </h1>
            </a>

            <nav>
                ${pages.map(page => `
                    <a
                        class="navlink ${
                            page.id === currentPage
                                ? "current"
                                : ""
                        }"
                        href="${page.href}"
                    >
                        ${page.label}
                    </a>
                `).join("")}
            </nav>

            <div class="hud-stats">
                <div id="walletMount"></div>
            </div>
        `;

        if (window.walletNode) {
            const walletMount =
                document.getElementById("walletMount");

            if (walletMount) {
                walletMount.appendChild(
                    window.walletNode
                );
            }

            if (
                typeof renderWallet ===
                "function"
            ) {
                renderWallet(state);
            }
        }
    }

    renderHud(state, "leaderboard");

    fetch("wallet-ledger.html")
        .then(response => {
            if (!response.ok) {
                throw new Error(
                    `wallet-ledger.html failed: ${response.status}`
                );
            }

            return response.text();
        })
        .then(html => {
            const parsed =
                new DOMParser().parseFromString(
                    html,
                    "text/html"
                );

            const walletDiv =
                parsed.getElementById("wallet");

            const walletMount =
                document.getElementById("walletMount");

            if (walletDiv && walletMount) {
                window.walletNode = walletDiv;

                walletMount.appendChild(
                    walletDiv
                );
            }

            const ledgerOverlay =
                parsed.getElementById(
                    "ledgerOverlay"
                );

            if (ledgerOverlay) {
                document.body.appendChild(
                    ledgerOverlay
                );
            }

            const signupOverlay =
                parsed.getElementById(
                    "signupOverlay"
                );

            if (signupOverlay) {
                document.body.appendChild(
                    signupOverlay
                );
            }

            const parsedStyle =
                parsed.querySelector("style");

            if (parsedStyle) {
                let css =
                    parsedStyle.textContent;

                css = css.replace(
                    /:root\{[^}]*\}/,
                    ""
                );

                css = css.replace(
                    /\*\{box-sizing:border-box;\}/,
                    ""
                );

                css = css.replace(
                    /html,body\{margin:0;padding:0;\}/,
                    ""
                );

                css = css.replace(
                    /body\{[^}]*\}/,
                    ""
                );

                const styleTag =
                    document.createElement(
                        "style"
                    );

                styleTag.textContent = css;

                document.head.appendChild(
                    styleTag
                );
            }

            const parsedScript =
                parsed.querySelector("script");

            if (parsedScript) {
                const newScript =
                    document.createElement(
                        "script"
                    );

                newScript.textContent =
                    parsedScript.textContent;

                document.body.appendChild(
                    newScript
                );
            }

            if (
                typeof renderWallet ===
                "function"
            ) {
                renderWallet(state);
            }
        })
        .catch(error => {
            console.error(
                "Failed to load wallet-ledger.html:",
                error
            );
        });

    const ledgerCount =
        document.getElementById(
            "ledgerCount"
        );

    const leaderboard =
        document.getElementById(
            "leaderboard"
        );

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }

    function formatNumber(value) {
        return Number(
            value || 0
        ).toLocaleString();
    }

    function getTierClass(tier) {
        const normalized =
            String(
                tier || "common"
            ).toLowerCase();

        switch (normalized) {
            case "rare":
                return "tier-rare";

            case "epic":
                return "tier-epic";

            case "legendary":
                return "tier-legendary";

            case "mythic":
                return "tier-mythic";

            default:
                return "tier-common";
        }
    }

    function getMovementClass(movement) {
        const normalized =
            String(
                movement || "stable"
            )
                .toLowerCase()
                .trim();

        if (
            normalized ===
            "ascending"
        ) {
            return "movement-ascending";
        }

        if (
            normalized ===
            "descending"
        ) {
            return "movement-descending";
        }

        return "movement-stable";
    }

    function getMovementLabel(movement) {
        const normalized =
            String(
                movement || "stable"
            )
                .toLowerCase()
                .trim();

        if (
            normalized ===
            "ascending"
        ) {
            return "ASCENDING ↑";
        }

        if (
            normalized ===
            "descending"
        ) {
            return "DESCENDING ↓";
        }

        return "STABLE";
    }

    function renderCardImage(row) {
        if (!row.image) {
            return `
                <div class="card-placeholder">
                    No Image
                </div>
            `;
        }

        return `
            <img
                class="card-image"
                src="${escapeHtml(row.image)}"
                alt="${escapeHtml(row.card)}"
                loading="lazy"
            >
        `;
    }

    async function loadCardImages(rows) {
        if (!rows.length) {
            return rows;
        }

        const {
            data,
            error
        } = await client
            .from("decks")
            .select(`
                card,
                deck,
                image
            `);

        if (error) {
            console.error(
                "Deck image lookup error:",
                error
            );

            return rows;
        }

        const imageMap = new Map();

        for (
            const deckRow
            of data || []
        ) {
            const key =
                `${deckRow.card}::${deckRow.deck}`;

            imageMap.set(
                key,
                deckRow.image
            );
        }

        return rows.map(row => {
            const key =
                `${row.card}::${row.deck}`;

            return {
                ...row,
                image:
                    imageMap.get(key) ||
                    null
            };
        });
    }

    function renderLeaderboard(rows) {
        if (!rows.length) {
            ledgerCount.textContent =
                "0 cards";

            leaderboard.innerHTML = `
                <div class="message">
                    <div class="message-title">
                        No popularity data
                    </div>

                    <div class="message-copy">
                        The popularity ledger currently
                        contains no cards.
                    </div>
                </div>
            `;

            return;
        }

        ledgerCount.textContent =
            `${rows.length} cards`;

        leaderboard.innerHTML =
            rows.map(
                (row, index) => {
                    const rank =
                        index + 1;

                    const rankClass =
                        rank <= 3
                            ? "rank top-three"
                            : "rank";

                    const movementClass =
                        getMovementClass(
                            row.movement
                        );

                    const movementLabel =
                        getMovementLabel(
                            row.movement
                        );

                    return `
                        <article class="leader-row">

                            <div class="${rankClass}">
                                #${rank}
                            </div>

                            <div class="card-cell">
                                ${renderCardImage(row)}

                                <div class="card-info">

                                    <div class="card-name">
                                        ${escapeHtml(
                                            row.card
                                        )}
                                    </div>

                                    <div class="card-deck">
                                        ${escapeHtml(
                                            row.deck
                                        )}
                                    </div>

                                    <span
                                        class="
                                            tier
                                            ${getTierClass(
                                                row.current_tier
                                            )}
                                        "
                                    >
                                        ${escapeHtml(
                                            row.current_tier ||
                                            "common"
                                        )}
                                    </span>

                                </div>
                            </div>

                            <div class="popularity-cell">
                                <div class="popularity-label">
                                    Popularity
                                </div>

                                <div class="popularity-value">
                                    ${formatNumber(
                                        row.popularity_points
                                    )}
                                </div>
                            </div>

                            <div class="movement-cell">
                                <div class="movement-label">
                                    Movement
                                </div>

                                <div
                                    class="
                                        movement-value
                                        ${movementClass}
                                    "
                                >
                                    ${movementLabel}
                                </div>
                            </div>

                            <div class="stat">
                                <div class="stat-label">
                                    Buys
                                </div>

                                <div class="stat-value">
                                    ${formatNumber(
                                        row.buys
                                    )}
                                </div>
                            </div>

                            <div class="stat">
                                <div class="stat-label">
                                    Sales
                                </div>

                                <div class="stat-value">
                                    ${formatNumber(
                                        row.sales
                                    )}
                                </div>
                            </div>

                            <div class="stat">
                                <div class="stat-label">
                                    Collections
                                </div>

                                <div class="stat-value">
                                    ${formatNumber(
                                        row.total_in_collections
                                    )}
                                </div>
                            </div>

                            <div class="stat">
                                <div class="stat-label">
                                    Fused
                                </div>

                                <div class="stat-value">
                                    ${formatNumber(
                                        row.fused
                                    )}
                                </div>
                            </div>

                            <div class="stat">
                                <div class="stat-label">
                                    Ascensions
                                </div>

                                <div class="stat-value">
                                    ${formatNumber(
                                        row.ascensions
                                    )}
                                </div>
                            </div>

                            <div class="stat">
                                <div class="stat-label">
                                    Dissections
                                </div>

                                <div class="stat-value">
                                    ${formatNumber(
                                        row.dissections
                                    )}
                                </div>
                            </div>

                        </article>
                    `;
                }
            ).join("");
    }

    async function loadLedger() {
        const {
            data,
            error
        } = await client
            .from("popularity_ledger")
            .select(`
                card,
                deck,
                current_tier,
                previous_tier,
                threshold,
                buys,
                sales,
                total_in_collections,
                fused,
                ascensions,
                dissections,
                popularity_points,
                movement,
                updated_at
            `);

        if (error) {
            console.error(
                "Popularity ledger error:",
                error
            );

            ledgerCount.textContent =
                "Unavailable";

            leaderboard.innerHTML = `
                <div class="message">
                    <div class="message-title">
                        Ledger unavailable
                    </div>

                    <div class="message-copy">
                        ${escapeHtml(
                            error.message
                        )}
                    </div>
                </div>
            `;

            return;
        }

        const rows =
            await loadCardImages(
                data || []
            );

        renderLeaderboard(rows);
    }

    loadLedger();
</script>
