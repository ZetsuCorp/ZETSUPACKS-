<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZETSU PACKZ — Packs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A;
  --panel:#141414;
  --panel-2:#1B1B1B;
  --line:#3D3D3D;
  --ink:#EDE6DC;
  --muted:#8F8A82;
  --brass:#D4AF6A;
  --brass-dim:#8A7245;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
  padding:40px 0;
}

.carousel{
  display:flex;gap:28px;overflow-x:auto;overflow-y:visible;
  padding:30px calc(50vw - 115px) 50px;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  width:100vw;
  position:relative;
  left:50%;
  transform:translateX(-50%);
}
.carousel::-webkit-scrollbar{display:none;}

.pack-slot{
  flex:0 0 auto;
  scroll-snap-align:center;
  width:230px;
  position:relative;
}
.pack-container{
  width:100%;
  position:relative;
  display:flex;
  flex-direction:column;
  border-radius:18px;
  background:linear-gradient(180deg, var(--panel-2), var(--panel) 55%, #0D0D0D);
  border:1px solid var(--line);
  overflow:hidden;
  animation:hover-idle 5.5s ease-in-out infinite;
  transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
  cursor:pointer;
  z-index:1;
}
.pack-container::after{
  content:"";
  position:absolute;
  left:8%; right:8%; bottom:-26px;
  height:34px;
  background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);
  filter:blur(4px);
  z-index:-1;
  animation:shadow-idle 5.5s ease-in-out infinite;
}
.pack-container:hover{
  transform:translateY(-10px) rotateX(4deg) rotateY(-4deg);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6), 0 0 40px -12px var(--tier-b);
}
@keyframes hover-idle{
  0%,100%{ transform:translateY(0px); }
  50%{ transform:translateY(-8px); }
}
@keyframes shadow-idle{
  0%,100%{ transform:scale(1); opacity:.55; }
  50%{ transform:scale(.88); opacity:.35; }
}

.pack-container.is-active{
  z-index:3;
  animation:pack-grow 3.4s ease-in-out infinite;
  transform-origin:center center;
  box-shadow:0 34px 64px -18px rgba(0,0,0,.65), 0 0 46px -10px var(--tier-b);
}
.pack-container.is-active::after{
  animation:shadow-grow 3.4s ease-in-out infinite;
}
@keyframes pack-grow{
  0%,100%{ transform:scale(1.08); }
  50%{ transform:scale(1.13); }
}
@keyframes shadow-grow{
  0%,100%{ transform:scale(1.08); opacity:.5; }
  50%{ transform:scale(1.16); opacity:.4; }
}
.pack-container::before{
  content:"";
  position:absolute; inset:-40%;
  background:conic-gradient(from 0deg, var(--tier-a), var(--tier-b), var(--tier-c), var(--tier-a));
  opacity:.14;
  filter:blur(30px);
  z-index:-1;
}

.pack-sparkles{
  position:absolute;
  inset:-36px;
  opacity:0;
  pointer-events:none;
  transition:opacity .4s ease;
}
.pack-sparkles.behind{ z-index:0; }
.pack-sparkles.infront{ z-index:4; }
.pack-container.is-active ~ .pack-sparkles{
  opacity:1;
}

.sparkle{
  position:absolute;
  border-radius:50%;
  animation:sparkle-twinkle ease-in-out infinite;
}
.sparkle.white{
  background:#FFFFFF;
  box-shadow:0 0 8px 2px rgba(255,255,255,.85), 0 0 2px 1px #FFFFFF;
}
.sparkle.gold{
  background:#F2D08A;
  box-shadow:0 0 9px 2px rgba(242,208,138,.9), 0 0 2px 1px #F2D08A;
}

@keyframes sparkle-twinkle{
  0%,100%{ opacity:.4; transform:scale(.55); }
  50%{ opacity:1; transform:scale(1.15); }
}

.deck-info{
  display:flex; align-items:center;
  gap:8px; white-space:nowrap;
  padding:14px 16px 12px;
  border-bottom:3px solid var(--line);
}
.deck-mark{
  flex:0 0 auto;
  width:18px;height:18px;
  background:linear-gradient(135deg,var(--brass),var(--brass-dim));
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
}
.deck-name{
  font-size:11px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.deck-name b{ color:var(--ink); font-weight:700; }

.pack-stage{
  position:relative;
  overflow:hidden;
  aspect-ratio: 245 / 467;
}
.pack-art{
  position:absolute;
  width:155.51%;
  left:-27.755%;
  top:-17.559%;
  height:auto;
  display:block;
  filter:drop-shadow(0 18px 26px rgba(0,0,0,.55));
}
.tier-layer{
  position:absolute; inset:0;
  z-index:2;
  pointer-events:none;
  overflow:hidden;
}
.tier-layer::before{
  content:"";
  position:absolute; inset:-20% -60%;
  background:linear-gradient(100deg,
    transparent 35%,
    var(--tier-a) 47%,
    var(--tier-b) 50%,
    var(--tier-c) 53%,
    transparent 65%);
  opacity:.55;
  mix-blend-mode:screen;
  animation:sheen-sweep 4.5s ease-in-out infinite;
}
@keyframes sheen-sweep{
  0%{ transform:translateX(-60%) translateY(-20%); }
  50%{ transform:translateX(60%) translateY(20%); }
  100%{ transform:translateX(-60%) translateY(-20%); }
}

.pack-info{
  border-top:3px solid var(--line);
  background:rgba(255,255,255,.015);
  padding:10px 0;
  display:flex;
  justify-content:center;
}
.info-pill{
  font-family:'Fredoka',sans-serif;
  font-size:11px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase;
  background:linear-gradient(120deg,var(--tier-a),var(--tier-b),var(--tier-c));
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
  border:1.5px solid var(--line);
  border-radius:20px;
  padding:6px 16px;
  cursor:pointer;
  display:flex; align-items:center; gap:6px;
  background-color:rgba(255,255,255,.04);
  transition:border-color .2s ease;
}
.info-pill:hover{ border-color:var(--tier-b); }
.info-pill .chevron{
  display:inline-block;
  transition:transform .25s ease;
  -webkit-text-fill-color:var(--muted);
}
.pack-container.info-open .info-pill .chevron{ transform:rotate(180deg); }

.info-panel{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:center;
  gap:0;
  background:rgba(8,8,8,.88);
  backdrop-filter:blur(3px);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .25s ease;
  cursor:pointer;
}
.pack-container.info-open .info-panel{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
.info-panel-row{
  display:flex;
  border-top:2px solid var(--line);
  border-bottom:2px solid var(--line);
}
.info-stat{
  flex:1; text-align:center;
  padding:12px 6px 14px;
  border-right:2px solid var(--line);
}
.info-stat:last-child{ border-right:none; }
.info-label{
  font-size:8.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); margin-bottom:4px;
}
.info-value{
  font-family:'Fredoka',sans-serif;
  font-size:14px; font-weight:700; color:var(--ink);
}
.info-value.tier-colored{
  background:linear-gradient(120deg,var(--tier-a),var(--tier-b),var(--tier-c));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
</style>
</head>
<body>

<section id="packs">
  <div class="carousel" id="carousel"></div>
</section>

<script>
if (typeof fmt !== "function") {
  var fmt = function(n){ return n.toLocaleString(); };
}

const PACKS = [
  {
    id:"common", name:"Common", price:500,
    art:"assets/S0pack.png",
    tierColors:["#8C8880","#ADA9A2","#6E6A64"],
    pullRate:"55%", popRank:"#5"
  },
  {
    id:"rare", name:"Rare", price:1000,
    art:"assets/S0pack.png",
    tierColors:["#4FB6A8","#7FD8CC","#2E7A70"],
    pullRate:"28%", popRank:"#4"
  },
  {
    id:"epic", name:"Epic", price:2500,
    art:"assets/S0pack.png",
    tierColors:["#9B6BD6","#C39BF0","#6B3FA0"],
    pullRate:"11%", popRank:"#3"
  },
  {
    id:"legendary", name:"Legendary", price:10000,
    art:"assets/S0pack.png",
    tierColors:["#E8A23D","#F5C46B","#B8781F"],
    pullRate:"5%", popRank:"#2"
  },
  {
    id:"mythic", name:"Mythic", price:15000,
    art:"assets/S0pack.png",
    tierColors:["#FF6B9D","#C77DFF","#4FD1E5"],
    pullRate:"0.8%", popRank:"#1"
  }
];
const CENTER_PACK_INDEX = 2;
const DECK_NAME = "ZETSUMETSU EOe";

let activePackId = PACKS[CENTER_PACK_INDEX].id;

const SPARKLE_POINTS_BEHIND = [
  {l:4,  t:6},  {l:16, t:1},  {l:30, t:5},  {l:46, t:0},  {l:62, t:4},
  {l:78, t:1},  {l:92, t:7},  {l:97, t:22}, {l:99, t:40}, {l:98, t:58},
  {l:95, t:76}, {l:88, t:92}, {l:72, t:98}, {l:55, t:100},{l:38, t:97},
  {l:22, t:93}, {l:8,  t:88}, {l:1,  t:70}, {l:0,  t:50}, {l:2,  t:30},
  {l:10, t:14}, {l:24, t:2},  {l:38, t:9},  {l:54, t:1},  {l:70, t:6},
  {l:86, t:2},  {l:99, t:14}, {l:99, t:32}, {l:99, t:50}, {l:99, t:68},
  {l:99, t:86}, {l:80, t:97}, {l:62, t:99}, {l:44, t:96}, {l:26, t:99},
  {l:12, t:96}, {l:0,  t:82}, {l:0,  t:62}, {l:0,  t:42}, {l:0,  t:20}
];

const SPARKLE_POINTS_INFRONT = [
  {l:22, t:18}, {l:68, t:14}, {l:45, t:32}, {l:80, t:46}, {l:14, t:50},
  {l:60, t:62}, {l:30, t:74}, {l:76, t:82}, {l:48, t:92}, {l:10, t:86},
  {l:36, t:10}, {l:88, t:28}, {l:56, t:48}, {l:6,  t:64}, {l:92, t:66},
  {l:40, t:58}, {l:66, t:38}, {l:20, t:38}
];

function makeSparkles(points, idOffset){
  return points.map((p,i)=>{
    const n = i + idOffset;
    const gold = n % 3 === 0;
    const size = 3 + (n % 5);
    const delay = ((n * 0.53) % 3).toFixed(2);
    const duration = (1.6 + (n % 5) * 0.3).toFixed(2);
    return `<span class="sparkle ${gold?'gold':'white'}" style="left:${p.l}%; top:${p.t}%; width:${size}px; height:${size}px; animation-delay:${delay}s; animation-duration:${duration}s;"></span>`;
  }).join("");
}

function renderCarousel(){
  const carousel = document.getElementById("carousel");
  carousel.innerHTML = PACKS.map(pack=>{
    const [a,b,c] = pack.tierColors;
    return `
      <div class="pack-slot">
        <div class="pack-container ${pack.id===activePackId?'is-active':''}" data-pack="${pack.id}"
             style="--tier-a:${a}; --tier-b:${b}; --tier-c:${c};">

          <div class="deck-info">
            <div class="deck-mark"></div>
            <div class="deck-name">Deck · <b>${DECK_NAME}</b></div>
          </div>

          <div class="pack-stage">
            <img class="pack-art" src="${pack.art}" alt="${pack.name} pack">
            <div class="tier-layer"></div>
            <div class="info-panel" onclick="toggleInfo(this)">
              <div class="info-panel-row">
                <div class="info-stat">
                  <div class="info-label">Pull Rate</div>
                  <div class="info-value">${pack.pullRate}</div>
                </div>
                <div class="info-stat">
                  <div class="info-label">Pop. Rank</div>
                  <div class="info-value tier-colored">${pack.popRank}</div>
                </div>
                <div class="info-stat">
                  <div class="info-label">Value</div>
                  <div class="info-value">${fmt(pack.price)}</div>
                </div>
              </div>
            </div>
          </div>

          <div class="pack-info">
            <div class="info-pill" onclick="toggleInfo(this)">
              Pack Info <span class="chevron">&#9662;</span>
            </div>
          </div>
        </div>
        <div class="pack-sparkles behind">${makeSparkles(SPARKLE_POINTS_BEHIND, 0)}</div>
        <div class="pack-sparkles infront">${makeSparkles(SPARKLE_POINTS_INFRONT, 20)}</div>
      </div>`;
  }).join("");
}

function toggleInfo(pillEl){
  const card = pillEl.closest(".pack-container");
  if (card) card.classList.toggle("info-open");
}

function selectPack(id, smooth){
  if (!id || id === activePackId) { centerOnActivePack(smooth); return; }
  activePackId = id;
  const carousel = document.getElementById("carousel");
  carousel.querySelectorAll(".pack-container").forEach(card=>{
    card.classList.toggle("is-active", card.dataset.pack === activePackId);
  });
  if (typeof renderInfoStrip === "function") renderInfoStrip();
  if (typeof renderBuyHud === "function") renderBuyHud();
  centerOnActivePack(smooth);
}

function computeActivePack(){
  const carousel = document.getElementById("carousel");
  const carouselRect = carousel.getBoundingClientRect();
  const carouselCenter = carouselRect.left + carouselRect.width / 2;

  let closestId = activePackId;
  let closestDist = Infinity;
  carousel.querySelectorAll(".pack-container").forEach(card=>{
    const rect = card.getBoundingClientRect();
    const cardCenter = rect.left + rect.width / 2;
    const dist = Math.abs(cardCenter - carouselCenter);
    if (dist < closestDist){
      closestDist = dist;
      closestId = card.dataset.pack;
    }
  });

  if (closestId !== activePackId){
    activePackId = closestId;
    carousel.querySelectorAll(".pack-container").forEach(card=>{
      card.classList.toggle("is-active", card.dataset.pack === activePackId);
    });
    if (typeof renderInfoStrip === "function") renderInfoStrip();
    if (typeof renderBuyHud === "function") renderBuyHud();
  }
}

function centerOnActivePack(smooth){
  const carousel = document.getElementById("carousel");
  const activeCard = carousel.querySelector(`[data-pack="${activePackId}"]`);
  if (activeCard){
    activeCard.scrollIntoView({ inline: "center", block: "nearest", behavior: smooth ? "smooth" : "auto" });
  }
}

let packsScrollTick = false;
document.getElementById("carousel").addEventListener("scroll", ()=>{
  if (packsScrollTick) return;
  packsScrollTick = true;
  requestAnimationFrame(()=>{
    computeActivePack();
    packsScrollTick = false;
  });
}, {passive:true});

document.getElementById("carousel").addEventListener("click", (e)=>{
  const card = e.target.closest(".pack-container");
  if (!card) return;
  selectPack(card.dataset.pack, true);
});

document.addEventListener("keydown", (e)=>{
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

  const idx = PACKS.findIndex(p => p.id === activePackId);
  if (idx === -1) return;
  const nextIdx = e.key === "ArrowLeft"
    ? Math.max(0, idx - 1)
    : Math.min(PACKS.length - 1, idx + 1);

  if (nextIdx !== idx){
    e.preventDefault();
    selectPack(PACKS[nextIdx].id, true);
  }
});

renderCarousel();
if (typeof renderInfoStrip === "function") renderInfoStrip();
if (typeof renderBuyHud === "function") renderBuyHud();
centerOnActivePack();

/* ==========================================================
   SUPABASE CLIENT — connection is set up and ready, but the
   card pool below still loads from season-0.json for now. Not
   switched over yet because it's unconfirmed whether
   supabase-schema.sql has actually been run against this
   project — if the cards/popularity_ledger tables don't exist
   yet, querying them would just error.
   ========================================================== */
const SUPABASE_URL = "https://jqvnrdjrkdjgjbmqmbbl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_jmEahTk4OssD_IrOZq_6iQ_P6QFFJr6";
let supabaseClient = null;
if (typeof window.supabase !== "undefined"){
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

/* ==========================================================
   REAL CARD POOL — loaded once from season-0.json, keyed by
   tier. Later this fetch gets swapped for a real Supabase query;
   nothing that calls getCardForTier() needs to change when that
   happens.
   ========================================================== */
let CARD_POOL_BY_TIER = { common:[], rare:[], epic:[], legendary:[], mythic:[] };
let cardPoolLoaded = false;

fetch("season-0.json")
  .then(r => r.json())
  .then(deck => {
    Object.keys(deck.tiers).forEach(tier => {
      CARD_POOL_BY_TIER[tier] = deck.tiers[tier].cards;
    });
    cardPoolLoaded = true;
  })
  .catch(err => console.error("Failed to load season-0.json:", err));

/* Just go get a card and put it in the pack — no cross-tier odds,
   no popularity weighting. Picks one card at random from that
   tier's pool. Returns null if the pool for that tier is empty
   or hasn't loaded yet — callers need to handle that case. */
/* Queries Supabase directly now — popularity_ledger holds each
   card's current_tier, joined to cards for the actual name/image.
   Falls back to the local season-0.json pool only if the Supabase
   client isn't available at all. Async now (network call), so
   every caller needs to await this. */
async function getCardForTier(tier){
  if (supabaseClient){
    const { data, error } = await supabaseClient
      .from("popularity_ledger")
      .select("card, cards(*)")
      .eq("current_tier", tier)
      .eq("deck", "Season 0");
    if (error){
      console.error("Supabase query failed:", error);
      return null;
    }
    if (!data || !data.length) return null;
    const pick = data[Math.floor(Math.random() * data.length)];
    return pick.cards;
  }
  const pool = CARD_POOL_BY_TIER[tier];
  if (!pool || !pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

</script>
</body>
</html>
