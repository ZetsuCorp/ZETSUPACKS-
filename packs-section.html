<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pack Container — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A;
  --panel:#141414;
  --panel-2:#1B1B1B;
  --line:#3D3D3D;
  --ink:#EDE6DC;
  --muted:#8F8A82;
  --brass:#D4AF6A;

  /* tier colors — swap this trio per rarity when replicating */
  --tier-a:#FF6B9D;
  --tier-b:#C77DFF;
  --tier-c:#4FD1E5;
  --tier-solid:#C77DFF; /* fallback single-tone reference for the tier */
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 50% 20%, rgba(199,125,255,.08), transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'Space Grotesk',-apple-system,sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:60px 20px;
}

/* ============================================================
   PACK CONTAINER — one floating unit, three internal zones:
   1. deck-info   2. pack-stage (art)   3. pack-info (stats)
   The tier color runs through all three, not just a border.
   ============================================================ */

.pack-container{
  --tier: var(--tier-solid);
  width:230px;
  position:relative;
  display:flex;
  flex-direction:column;
  border-radius:18px;
  background:linear-gradient(180deg, var(--panel-2), var(--panel) 55%, #0D0D0D);
  border:1px solid var(--line);
  overflow:hidden;
  animation:hover-idle 5.5s ease-in-out infinite;
  transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
  cursor:pointer;
}

/* the floating shadow lives OUTSIDE the card, on its own layer,
   so the card can drift without the shadow looking pasted-on */
.pack-container::after{
  content:"";
  position:absolute;
  left:8%; right:8%; bottom:-26px;
  height:34px;
  background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);
  filter:blur(4px);
  z-index:-1;
  animation:shadow-idle 5.5s ease-in-out infinite;
}

.pack-container:hover{
  transform:translateY(-10px) rotateX(4deg) rotateY(-4deg);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6), 0 0 40px -12px var(--tier);
}

@keyframes hover-idle{
  0%,100%{ transform:translateY(0px); }
  50%{ transform:translateY(-8px); }
}
@keyframes shadow-idle{
  0%,100%{ transform:scale(1); opacity:.55; }
  50%{ transform:scale(.88); opacity:.35; }
}

/* tier glow wash behind the whole card */
.pack-container::before{
  content:"";
  position:absolute; inset:-40%;
  background:conic-gradient(from 0deg, var(--tier-a), var(--tier-b), var(--tier-c), var(--tier-a));
  opacity:.14;
  filter:blur(30px);
  z-index:-1;
  animation:tier-spin 12s linear infinite;
}
@keyframes tier-spin{ to{ transform:rotate(360deg); } }

/* ---------- ZONE 1 — deck info ---------- */
.deck-info{
  display:flex; align-items:center; justify-content:flex-start;
  gap:8px; white-space:nowrap;
  padding:14px 16px 12px;
  border-bottom:3px solid var(--line);
}
.deck-id{ display:flex; align-items:center; gap:8px; min-width:0; }
.deck-mark{
  flex:0 0 auto;
  width:18px;height:18px;
  background:linear-gradient(135deg,var(--brass),#8A7245);
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
}
.deck-name{
  font-size:11px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.deck-name b{ color:var(--ink); font-weight:700; }

/* ---------- ZONE 2 — pack art, the "floating" heart of the card ---------- */
.pack-stage{
  position:relative;
  display:flex; align-items:center; justify-content:center;
  padding:0;
}
.pack-stage .glow-floor{
  position:absolute; left:50%; bottom:10px;
  width:170px; height:28px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse, var(--tier), transparent 72%);
  opacity:.5; filter:blur(6px);
}
.pack-art{
  width:100%; height:auto; display:block;
  position:relative; z-index:1;
  filter:drop-shadow(0 18px 26px rgba(0,0,0,.55));
  animation:art-drift 5.5s ease-in-out infinite;
}
@keyframes art-drift{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  50%{ transform:translateY(-6px) rotate(-1.2deg); }
}

/* ---------- ZONE 3 — pack info / stats ---------- */
.pack-info{
  display:flex;
  border-top:3px solid var(--line);
  background:rgba(255,255,255,.015);
}
.info-stat{
  flex:1; text-align:center;
  padding:12px 6px 14px;
  border-right:2px solid var(--line);
}
.info-stat:last-child{ border-right:none; }
.info-label{
  font-size:8.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); margin-bottom:4px;
}
.info-value{
  font-family:'Fredoka',sans-serif;
  font-size:14px; font-weight:700; color:var(--ink);
}
.info-value.tier-colored{
  background:linear-gradient(120deg,var(--tier-a),var(--tier-b),var(--tier-c));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

</style>
</head>
