<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZETSU PACKZ — Packs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A;
  --panel:#141414;
  --panel-2:#1B1B1B;
  --line:#3D3D3D;
  --ink:#EDE6DC;
  --muted:#8F8A82;
  --brass:#D4AF6A;
  --brass-dim:#8A7245;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
  padding:40px 0;
}

.carousel{
  display:flex;gap:28px;overflow-x:auto;overflow-y:visible;
  padding:30px calc(50% - 115px) 50px;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.carousel::-webkit-scrollbar{display:none;}

/* ============================================================
   PACK CONTAINER — one floating unit per pack, doubling as the
   carousel item. Three zones: deck-info (single line) / pack-stage
   (art + tier sheen) / pack-info (collapsible stat pill).
   Every value below comes from the PACKS data array — nothing
   here is hardcoded to one specific pack.
   ============================================================ */

.pack-container{
  flex:0 0 auto;
  scroll-snap-align:center;
  width:230px;
  position:relative;
  display:flex;
  flex-direction:column;
  border-radius:18px;
  background:linear-gradient(180deg, var(--panel-2), var(--panel) 55%, #0D0D0D);
  border:1px solid var(--line);
  overflow:hidden;
  animation:hover-idle 5.5s ease-in-out infinite;
  transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease, border-color .2s ease;
  cursor:pointer;
}
.pack-container::after{
  content:"";
  position:absolute;
  left:8%; right:8%; bottom:-26px;
  height:34px;
  background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);
  filter:blur(4px);
  z-index:-1;
  animation:shadow-idle 5.5s ease-in-out infinite;
}
.pack-container:hover{
  transform:translateY(-10px) rotateX(4deg) rotateY(-4deg);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6), 0 0 40px -12px var(--tier-b);
}
.pack-container.is-active{
  border-color:var(--tier-b);
}
@keyframes hover-idle{
  0%,100%{ transform:translateY(0px); }
  50%{ transform:translateY(-8px); }
}
@keyframes shadow-idle{
  0%,100%{ transform:scale(1); opacity:.55; }
  50%{ transform:scale(.88); opacity:.35; }
}
.pack-container::before{
  content:"";
  position:absolute; inset:-40%;
  background:conic-gradient(from 0deg, var(--tier-a), var(--tier-b), var(--tier-c), var(--tier-a));
  opacity:.14;
  filter:blur(30px);
  z-index:-1;
  animation:tier-spin 12s linear infinite;
}
@keyframes tier-spin{ to{ transform:rotate(360deg); } }

.deck-info{
  display:flex; align-items:center;
  gap:8px; white-space:nowrap;
  padding:14px 16px 12px;
  border-bottom:3px solid var(--line);
}
.deck-mark{
  flex:0 0 auto;
  width:18px;height:18px;
  background:linear-gradient(135deg,var(--brass),var(--brass-dim));
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
}
.deck-name{
  font-size:11px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.deck-name b{ color:var(--ink); font-weight:700; }

.pack-stage{
  position:relative;
  display:flex; align-items:center; justify-content:center;
}
.pack-art{
  width:100%; height:auto; display:block;
  position:relative; z-index:1;
  filter:drop-shadow(0 18px 26px rgba(0,0,0,.55));
  animation:art-drift 5.5s ease-in-out infinite;
}
@keyframes art-drift{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  50%{ transform:translateY(-6px) rotate(-1.2deg); }
}
.tier-layer{
  position:absolute; inset:0;
  z-index:2;
  pointer-events:none;
  overflow:hidden;
}
.tier-layer::before{
  content:"";
  position:absolute; inset:-20% -60%;
  background:linear-gradient(100deg,
    transparent 35%,
    var(--tier-a) 47%,
    var(--tier-b) 50%,
    var(--tier-c) 53%,
    transparent 65%);
  opacity:.55;
  mix-blend-mode:screen;
  animation:sheen-sweep 4.5s ease-in-out infinite;
}
@keyframes sheen-sweep{
  0%{ transform:translateX(-60%) translateY(-20%); }
  50%{ transform:translateX(60%) translateY(20%); }
  100%{ transform:translateX(-60%) translateY(-20%); }
}

.pack-info{
  border-top:3px solid var(--line);
  background:rgba(255,255,255,.015);
  padding:10px 0;
  display:flex;
  justify-content:center;
}
.info-pill{
  font-family:'Fredoka',sans-serif;
  font-size:11px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase;
  background:linear-gradient(120deg,var(--tier-a),var(--tier-b),var(--tier-c));
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
  border:1.5px solid var(--line);
  border-radius:20px;
  padding:6px 16px;
  cursor:pointer;
  display:flex; align-items:center; gap:6px;
  background-color:rgba(255,255,255,.04);
  transition:border-color .2s ease;
}
.info-pill:hover{ border-color:var(--tier-b); }
.info-pill .chevron{
  display:inline-block;
  transition:transform .25s ease;
  -webkit-text-fill-color:var(--muted);
}
.pack-container.info-open .info-pill .chevron{ transform:rotate(180deg); }

.info-panel{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease;
  display:flex;
}
.pack-container.info-open .info-panel{ max-height:80px; }
.info-stat{
  flex:1; text-align:center;
  padding:12px 6px 14px;
  border-right:2px solid var(--line);
  border-top:2px solid var(--line);
}
.info-stat:last-child{ border-right:none; }
.info-label{
  font-size:8.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); margin-bottom:4px;
}
.info-value{
  font-family:'Fredoka',sans-serif;
  font-size:14px; font-weight:700; color:var(--ink);
}
.info-value.tier-colored{
  background:linear-gradient(120deg,var(--tier-a),var(--tier-b),var(--tier-c));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
</style>
</head>
<body>

<section id="packs">
  <div class="carousel" id="carousel"></div>
</section>

<script>
if (typeof fmt !== "function") {
  var fmt = function(n){ return n.toLocaleString(); };
}

const PACKS = [
  {
    id:"common", name:"Common", price:500,
    art:"assets/S0pack.png",
    tierColors:["#8C8880","#ADA9A2","#6E6A64"],
    pullRate:"55%", popRank:"#5"
  },
  {
    id:"rare", name:"Rare", price:1000,
    art:"assets/S0pack.png",
    tierColors:["#4FB6A8","#7FD8CC","#2E7A70"],
    pullRate:"28%", popRank:"#4"
  },
  {
    id:"epic", name:"Epic", price:2500,
    art:"assets/S0pack.png",
    tierColors:["#9B6BD6","#C39BF0","#6B3FA0"],
    pullRate:"11%", popRank:"#3"
  },
  {
    id:"legendary", name:"Legendary", price:10000,
    art:"assets/S0pack.png",
    tierColors:["#E8A23D","#F5C46B","#B8781F"],
    pullRate:"5%", popRank:"#2"
  },
  {
    id:"mythic", name:"Mythic", price:15000,
    art:"assets/S0pack.png",
    tierColors:["#FF6B9D","#C77DFF","#4FD1E5"],
    pullRate:"0.8%", popRank:"#1"
  }
];
const CENTER_PACK_INDEX = 2;
const DECK_NAME = "ZETSUMETSU EOe";

let activePackId = PACKS[CENTER_PACK_INDEX].id;

function renderCarousel(){
  const carousel = document.getElementById("carousel");
  carousel.innerHTML = PACKS.map(pack=>{
    const [a,b,c] = pack.tierColors;
    return `
      <div class="pack-container ${pack.id===activePackId?'is-active':''}" data-pack="${pack.id}"
           style="--tier-a:${a}; --tier-b:${b}; --tier-c:${c};">

        <div class="deck-info">
          <div class="deck-mark"></div>
          <div class="deck-name">Deck · <b>${DECK_NAME}</b></div>
        </div>

        <div class="pack-stage">
          <img class="pack-art" src="${pack.art}" alt="${pack.name} pack">
          <div class="tier-layer"></div>
        </div>

        <div class="pack-info">
          <div class="info-pill" onclick="toggleInfo(this)">
            Pack Info <span class="chevron">&#9662;</span>
          </div>
        </div>
        <div class="info-panel">
          <div class="info-stat">
            <div class="info-label">Pull Rate</div>
            <div class="info-value">${pack.pullRate}</div>
          </div>
          <div class="info-stat">
            <div class="info-label">Pop. Rank</div>
            <div class="info-value tier-colored">${pack.popRank}</div>
          </div>
          <div class="info-stat">
            <div class="info-label">Value</div>
            <div class="info-value">${fmt(pack.price)}</div>
          </div>
        </div>
      </div>`;
  }).join("");
}

function toggleInfo(pillEl){
  const card = pillEl.closest(".pack-container");
  if (card) card.classList.toggle("info-open");
}

function computeActivePack(){
  const carousel = document.getElementById("carousel");
  const carouselRect = carousel.getBoundingClientRect();
  const carouselCenter = carouselRect.left + carouselRect.width / 2;

  let closestId = activePackId;
  let closestDist = Infinity;
  carousel.querySelectorAll(".pack-container").forEach(card=>{
    const rect = card.getBoundingClientRect();
    const cardCenter = rect.left + rect.width / 2;
    const dist = Math.abs(cardCenter - carouselCenter);
    if (dist < closestDist){
      closestDist = dist;
      closestId = card.dataset.pack;
    }
  });

  if (closestId !== activePackId){
    activePackId = closestId;
    carousel.querySelectorAll(".pack-container").forEach(card=>{
      card.classList.toggle("is-active", card.dataset.pack === activePackId);
    });
    if (typeof renderInfoStrip === "function") renderInfoStrip();
    if (typeof renderBuyHud === "function") renderBuyHud();
  }
}

function centerOnActivePack(){
  const carousel = document.getElementById("carousel");
  const activeCard = carousel.querySelector(`[data-pack="${activePackId}"]`);
  if (activeCard){
    activeCard.scrollIntoView({ inline: "center", block: "nearest" });
  }
}

let packsScrollTick = false;
document.getElementById("carousel").addEventListener("scroll", ()=>{
  if (packsScrollTick) return;
  packsScrollTick = true;
  requestAnimationFrame(()=>{
    computeActivePack();
    packsScrollTick = false;
  });
}, {passive:true});

renderCarousel();
if (typeof renderInfoStrip === "function") renderInfoStrip();
if (typeof renderBuyHud === "function") renderBuyHud();
centerOnActivePack();
</script>
</body>
</html>
