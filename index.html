<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZETSU PACKZ — Rip Pack</title>
<style>
:root{
  --bg:#140F1F;
  --panel:#1D1730;
  --panel-2:#251D3B;
  --line:#352A50;
  --ink:#EDE6DC;
  --muted:#9C93AE;
  --brass:#D4AF6A;
  --brass-dim:#8A7245;
  --common:#8A8698;
  --rare:#4FB6A8;
  --epic:#9B6BD6;
  --legendary:#E8A23D;
  --mythic-a:#FF6B9D;
  --mythic-b:#C77DFF;
  --mythic-c:#4FD1E5;
  --danger:#E8636B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%, #241C3C 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
}
a{color:inherit;text-decoration:none;}
.mono{font-family:"SF Mono",ui-monospace,"Cascadia Code",Consolas,monospace;}

/* ---------- HUD ---------- */
.hud{
  position:sticky;top:0;z-index:50;
  background:rgba(20,15,31,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  padding:14px 20px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
}
.hud .brand{display:flex;align-items:baseline;gap:8px;}
.hud .brand .mark{font-size:10px;letter-spacing:.28em;color:var(--brass);text-transform:uppercase;font-weight:700;}
.hud .brand h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;}
.hud .brand h1 span{color:var(--brass);}
.hud nav{display:flex;gap:4px;}
.hud .navlink{
  padding:8px 14px;border-radius:3px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:var(--muted);border:1px solid transparent;
}
.hud .navlink:hover{color:var(--ink);}
.hud .navlink.current{background:var(--brass);color:#1A1425;}
.hud .balance{text-align:right;}
.hud .balance .label{font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;}
.hud .balance .amt{font-size:20px;font-weight:700;color:var(--brass);}

.page{max-width:1080px;margin:0 auto;padding:28px 16px 60px;}

/* ---------- Buttons ---------- */
.btn{
  border:none;border-radius:3px;padding:12px 20px;font-size:13px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:filter .15s ease, transform .1s ease;
}
.btn:active{transform:scale(.98);}
.btn-brass{background:var(--brass);color:#1A1425;}
.btn-brass:hover{filter:brightness(1.08);}
.btn-brass:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--brass-dim);}

/* ---------- Empty state ---------- */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;}
.empty-state .glyph{font-size:32px;margin-bottom:10px;}

/* ---------- Rarity swatches / theming (shared by shop odds + collection cards) ---------- */
.swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.swatch.s-common{background:var(--common);}
.swatch.s-rare{background:var(--rare);}
.swatch.s-epic{background:var(--epic);}
.swatch.s-legendary{background:var(--legendary);}
.swatch.s-mythic{background:linear-gradient(120deg,var(--mythic-a),var(--mythic-b),var(--mythic-c));}

.rar-common{background:linear-gradient(160deg,#2A2836,#1D1B27);border:1px solid var(--common);}
.rar-common .tier,.rar-common .name{color:var(--common);}
.rar-rare{background:linear-gradient(160deg,#173330,#12201F);border:1px solid var(--rare);}
.rar-rare .tier,.rar-rare .name{color:var(--rare);}
.rar-epic{background:linear-gradient(160deg,#2B1F42,#1D1530);border:1px solid var(--epic);}
.rar-epic .tier,.rar-epic .name{color:var(--epic);}
.rar-legendary{background:linear-gradient(160deg,#3A2A12,#241A0C);border:1px solid var(--legendary);}
.rar-legendary .tier,.rar-legendary .name{color:var(--legendary);}
.rar-mythic{background:linear-gradient(160deg,#241830,#1A1424);border:1px solid transparent;position:relative;}
.rar-mythic::after{content:"";position:absolute;inset:-1px;border-radius:inherit;z-index:-1;
  background:linear-gradient(120deg,var(--mythic-a),var(--mythic-b),var(--mythic-c));}
.rar-mythic .tier,.rar-mythic .name{
  background:linear-gradient(120deg,var(--mythic-a),var(--mythic-b),var(--mythic-c));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel-2);border:1px solid var(--brass-dim);color:var(--ink);
  padding:12px 20px;border-radius:6px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:100;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Modal (card detail) ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(10,7,16,.75);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal-backdrop.show{display:flex;}
.modal-card{
  width:260px;border-radius:14px;padding:22px;position:relative;
  display:flex;flex-direction:column;gap:14px;
}
.modal-card .tier{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;}
.modal-card .glyph{font-size:72px;text-align:center;filter:drop-shadow(0 8px 16px rgba(0,0,0,.4));}
.modal-card .name{font-size:20px;font-weight:900;text-transform:uppercase;line-height:1.05;}
.modal-card .value{font-size:12px;opacity:.85;}
.modal-close{
  position:absolute;top:10px;right:12px;background:none;border:none;color:inherit;
  font-size:20px;cursor:pointer;opacity:.7;
}
.modal-close:hover{opacity:1;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}

</style>
<style>
  .stage{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:60vh;position:relative;
  }
  .pack-object{
    width:220px;height:300px;border-radius:10px;
    background:linear-gradient(150deg,var(--panel-2),#2B2145 55%,var(--panel-2));
    border:1px solid var(--brass-dim);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    cursor:pointer;position:relative;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
    transition:transform .18s ease;
  }
  .pack-object:hover{transform:translateY(-4px);}
  .pack-object.ripping{animation:shake .5s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0) rotate(0);}
    20%{transform:translateX(-6px) rotate(-1.5deg);}
    40%{transform:translateX(6px) rotate(1.5deg);}
    60%{transform:translateX(-4px) rotate(-1deg);}
    80%{transform:translateX(4px) rotate(1deg);}
  }
  .pack-object .perf{
    position:absolute;left:0;right:0;top:50%;height:1px;
    background-image:repeating-linear-gradient(90deg, var(--brass-dim) 0 6px, transparent 6px 12px);
  }
  .pack-object .glyph{font-size:44px;}
  .pack-object .label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);font-weight:700;}
  .pack-object .instruction{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}

  .foil-sweep{
    position:absolute;inset:0;pointer-events:none;opacity:0;
    background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 48%, transparent 66%);
    background-size:220% 100%;background-position:120% 0;
  }
  .foil-sweep.sweeping{opacity:1;animation:sweep .55s ease forwards;}
  @keyframes sweep{
    0%{background-position:130% 0;opacity:1;}
    100%{background-position:-30% 0;opacity:0;}
  }

  .reveal-card{
    width:240px;height:330px;border-radius:12px;position:relative;
    display:none;flex-direction:column;justify-content:space-between;padding:18px;overflow:hidden;
    transform:scale(.4) rotateY(90deg);opacity:0;
  }
  .reveal-card.showing{display:flex;animation:cardIn .5s cubic-bezier(.2,.9,.25,1.15) forwards;}
  @keyframes cardIn{
    0%{transform:scale(.4) rotateY(90deg);opacity:0;}
    60%{transform:scale(1.06) rotateY(0deg);opacity:1;}
    100%{transform:scale(1) rotateY(0deg);opacity:1;}
  }
  .reveal-card .tier{font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;opacity:.85;}
  .reveal-card .glyph{font-size:64px;text-align:center;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}
  .reveal-card .name{font-size:19px;font-weight:900;text-transform:uppercase;line-height:1.05;}
  .reveal-card .value{font-size:12px;opacity:.85;}
  .burst{position:absolute;inset:-40%;pointer-events:none;opacity:0;}
  .burst.bursting{animation:burstAnim .7s ease-out forwards;}
  @keyframes burstAnim{
    0%{opacity:.9;transform:scale(.2);}
    100%{opacity:0;transform:scale(1.6);}
  }

  .post-reveal{margin-top:20px;display:flex;gap:10px;opacity:0;pointer-events:none;transition:opacity .3s ease;}
  .post-reveal.show{opacity:1;pointer-events:auto;}
</style>
</head>
<body>
<div id="hud" class="hud"></div>

<main class="page">
  <div class="stage" id="stage"></div>
</main>

<script>
/* ==========================================================
   VAULT — shared data, state, and helpers
   Loaded by every page. State persists across pages via
   localStorage so Shop -> Rip -> Collection stays in sync.
   ========================================================== */

const RARITIES = [
  { id:"common",    label:"Common",    glyphs:["●","▪","○"], valueRange:[8,20]    },
  { id:"rare",      label:"Rare",      glyphs:["◆","✦","◈"], valueRange:[25,60]   },
  { id:"epic",      label:"Epic",      glyphs:["✷","❖","✸"], valueRange:[70,160]  },
  { id:"legendary", label:"Legendary", glyphs:["★","☆","✹"], valueRange:[200,450] },
  { id:"mythic",    label:"Mythic",    glyphs:["◉","✺","❉"], valueRange:[600,1500]}
];
const RARITY_ORDER = ["mythic","legendary","epic","rare","common"];

const NAME_PARTS = {
  prefix:["Iron","Void","Solar","Ashen","Crimson","Gilded","Hollow","Storm","Obsidian","Wraith","Ember","Frost","Rogue","Sable","Verdant"],
  noun:["Warden","Cipher","Relic","Sentinel","Oracle","Marauder","Construct","Effigy","Harbinger","Specter","Engine","Totem","Wyrm","Vanguard","Idol"]
};

function makeCardPool(){
  const pool = [];
  RARITIES.forEach(r=>{
    NAME_PARTS.prefix.forEach((p,i)=>{
      const step = r.id==="mythic"?5: r.id==="legendary"?3: r.id==="epic"?2:1;
      if (i % step === 0){
        const n = NAME_PARTS.noun[(i+RARITIES.indexOf(r)) % NAME_PARTS.noun.length];
        pool.push({ id:r.id+"-"+p+"-"+n, name:p+" "+n, rarity:r.id, glyph:r.glyphs[i % r.glyphs.length] });
      }
    });
  });
  return pool;
}
const CARD_POOL = makeCardPool();

const PACKS = [
  { id:"standard", name:"Standard Pack", tier:"Entry",      price:50,  ceiling:60,   odds:{common:70,rare:23,epic:6,legendary:0.9,mythic:0.1} },
  { id:"premium",  name:"Premium Pack",  tier:"Mid-Tier",   price:150, ceiling:450,  odds:{common:45,rare:35,epic:16,legendary:3.5,mythic:0.5} },
  { id:"elite",    name:"Elite Pack",    tier:"High Roller",price:400, ceiling:1500, odds:{common:20,rare:35,epic:32,legendary:11,mythic:2} }
];

/* ---------------- State persistence ---------------- */
const STORAGE_KEY = "vault_state_v1";

function defaultState(){
  return {
    balance: 1000,
    collection: [],   // [{uid,name,rarity,glyph,value,ts}]
    unopened: [],     // [{uid,packId}]
    firstVisit: true
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  } catch(e){
    return defaultState();
  }
}

function saveState(state){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e){ /* storage unavailable — state just won't persist */ }
}

/* ---------------- Helpers ---------------- */
function fmt(n){ return n.toLocaleString(); }
function rarityMeta(id){ return RARITIES.find(r=>r.id===id); }
function randRange([a,b]){ return Math.floor(a + Math.random()*(b-a)); }
function uid(){ return Date.now()+"-"+Math.random().toString(36).slice(2,7); }

function pullCard(pack){
  const roll = Math.random()*100;
  let acc = 0, chosenRarity = "common";
  for (const r of RARITIES){
    acc += pack.odds[r.id];
    if (roll <= acc){ chosenRarity = r.id; break; }
  }
  const candidates = CARD_POOL.filter(c=>c.rarity===chosenRarity);
  const base = candidates[Math.floor(Math.random()*candidates.length)];
  const meta = rarityMeta(chosenRarity);
  return {
    uid: uid(),
    name: base.name,
    rarity: chosenRarity,
    glyph: base.glyph,
    value: randRange(meta.valueRange),
    ts: Date.now()
  };
}

function toast(msg){
  let t = document.getElementById("toast");
  if (!t){
    t = document.createElement("div");
    t.id = "toast"; t.className = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ---------------- HUD (shared header, injected on every page) ---------------- */
function renderHud(state, currentPage){
  const mount = document.getElementById("hud");
  if (!mount) return;
  const pages = [
    {id:"start", href:"start.html", label:"Start"},
    {id:"shop", href:"shop.html", label:"Pack Shop"},
    {id:"rip", href:"index.html", label:"Rip Pack"},
    {id:"collection", href:"collection.html", label:"Collection"}
  ];
  mount.innerHTML = `
    <a class="brand" href="start.html">
      <span class="mark">Zetsumetsu</span>
      <h1>ZETSU PACKZ</h1>
    </a>
    <nav>
      ${pages.map(p=>`<a class="navlink ${p.id===currentPage?'current':''}" href="${p.href}">${p.label}</a>`).join("")}
    </nav>
    <div class="balance">
      <div class="label">Chips</div>
      <div class="amt mono">${fmt(state.balance)}</div>
    </div>
  `;
}

</script>
<script>
  let state = loadState();
  renderHud(state, "rip");

  const params = new URLSearchParams(location.search);
  const requestedUid = params.get("pack");
  let pending = requestedUid
    ? state.unopened.find(u=>u.uid===requestedUid)
    : state.unopened[0];

  const stage = document.getElementById("stage");
  let currentResult = null;

  function renderEmpty(){
    stage.innerHTML = `
      <div class="empty-state" style="width:100%;">
        <div class="glyph">◇</div>
        No unopened packs. Head to the Pack Shop to buy one.
        <div style="margin-top:16px;"><a class="btn btn-brass" href="shop.html">Go to Pack Shop</a></div>
      </div>`;
  }

  function renderPackObject(){
    const pack = PACKS.find(p=>p.id===pending.packId);
    stage.innerHTML = `
      <div class="pack-object" id="packObject">
        <div class="perf"></div>
        <div class="glyph">◆</div>
        <div class="label">${pack.name.toUpperCase()}</div>
        <div class="instruction">Click to rip</div>
        <div class="foil-sweep" id="foilSweep"></div>
      </div>
      <div class="reveal-card" id="revealCard">
        <div class="burst" id="burst"></div>
        <div class="tier" id="rTier"></div>
        <div class="glyph" id="rGlyph"></div>
        <div>
          <div class="name" id="rName"></div>
          <div class="value mono" id="rValue"></div>
        </div>
      </div>
      <div class="post-reveal" id="postReveal">
        <button class="btn btn-ghost" id="sellNowBtn">Sell for <span id="sellAmt"></span></button>
        <button class="btn btn-brass" id="keepBtn">Keep card</button>
        <a class="btn btn-ghost" href="shop.html">Back to Shop</a>
      </div>
    `;
    document.getElementById("packObject").addEventListener("click", ()=>ripPack(pack));
  }

  function ripPack(pack){
    const packObj = document.getElementById("packObject");
    packObj.classList.add("ripping");
    document.getElementById("foilSweep").classList.add("sweeping");
    packObj.style.pointerEvents = "none";

    setTimeout(()=>{
      packObj.style.display = "none";
      currentResult = pullCard(pack);
      showReveal(currentResult);

      // remove this pack from the unopened tray now that it's ripped
      state.unopened = state.unopened.filter(u=>u.uid!==pending.uid);
      saveState(state);
    }, 480);
  }

  function showReveal(result){
    const reveal = document.getElementById("revealCard");
    const burst = document.getElementById("burst");
    reveal.className = "reveal-card rar-"+result.rarity;
    document.getElementById("rTier").textContent = rarityMeta(result.rarity).label.toUpperCase();
    document.getElementById("rGlyph").textContent = result.glyph;
    document.getElementById("rName").textContent = result.name;
    document.getElementById("rValue").textContent = "Value: " + fmt(result.value) + " chips";

    burst.style.background = result.rarity === "mythic"
      ? "radial-gradient(circle, rgba(199,125,255,.5) 0%, transparent 65%)"
      : `radial-gradient(circle, var(--${result.rarity}) 0%, transparent 65%)`;

    requestAnimationFrame(()=>{
      reveal.classList.add("showing");
      burst.classList.add("bursting");
    });

    document.getElementById("sellAmt").textContent = fmt(result.value) + " chips";
    setTimeout(()=>{ document.getElementById("postReveal").classList.add("show"); }, 500);

    document.getElementById("sellNowBtn").addEventListener("click", ()=>{
      state.balance += currentResult.value;
      saveState(state);
      renderHud(state, "rip");
      toast("Sold " + currentResult.name + " for " + fmt(currentResult.value) + " chips.");
      goNext();
    });
    document.getElementById("keepBtn").addEventListener("click", ()=>{
      state.collection.push(currentResult);
      saveState(state);
      toast("Added " + currentResult.name + " to your collection.");
      goNext();
    });
  }

  function goNext(){
    pending = state.unopened[0];
    if (pending){ renderPackObject(); } else { renderEmpty(); }
  }

  if (!pending){ renderEmpty(); } else { renderPackObject(); }
</script>
</body>
</html>
