<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZETSU PACKZ — Fusion Demo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --page: #0A0A0A;
            --page-shadow: #141414;
            --page-edge: #333333;
            --ink: #EDE6DC;
            --ink-muted: #9A958E;
            --ink-faint: #6E6A64;

            --common: #8C8880;
            --rare: #4FB6A8;
            --epic: #9B6BD6;
            --legendary: #E8A23D;
            --mythic-a: #FF6B9D;
            --mythic-b: #C77DFF;

            --brass: #D4AF6A;
            --brass-dim: #8A7245;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            background: var(--page);
            color: var(--ink);
            font-family: 'Karla', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1.display {
            font-family: 'Fraunces', serif;
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 24px;
        }

        .demo-wrap {
            width: 100%;
            max-width: 480px;
            position: relative;
        }

        /* ============================================================
           SHOWCASE — pedestal (unchanged from the base demo)
           ============================================================ */

        .showcase {
            --tier-a: var(--brass);
            --tier-b: var(--brass-dim);

            position: relative;
            isolation: isolate;
            overflow: hidden;

            border-radius: 10px;
            border: 1px solid var(--page-edge);
            background: #050505;

            padding: 54px 20px 34px;
            margin-bottom: 24px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .showcase::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;

            background-image:
                repeating-linear-gradient(0deg, rgba(120,170,220,.08) 0 1px, transparent 1px 42px),
                repeating-linear-gradient(90deg, rgba(120,170,220,.08) 0 1px, transparent 1px 42px);
        }

        .showcase::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;

            background: radial-gradient(ellipse 55% 50% at 50% 38%, var(--tier-a), transparent 72%);
            opacity: .22;

            transition: background .3s ease, opacity .3s ease;
        }

        /* ============================================================
           CARD STAGE — perspective wrapper for the 3D tilt
           ============================================================ */

        .card-stage {
            position: relative;
            z-index: 2;

            width: 190px;
            aspect-ratio: 5 / 7;

            margin-bottom: -30px;

            perspective: 900px;
        }

        /* Fusion level badge — sits OUTSIDE the card's top-right
           corner, drawn as an actual infinity curve (lemniscate),
           not two separate circles. "F" sits in the left loop, the
           current level number sits in the right loop. */
        .fusion-badge {
            position: absolute;
            top: 150px;
            right: 75px;
            z-index: 10;

            pointer-events: none;
        }

        .fusion-badge-svg {
            width: 74px;
            height: 37px;

            filter: drop-shadow(0 0 3px rgba(0,0,0,.6));
        }

        .fusion-badge-infinity {
            stroke: #FFFFFF;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .fusion-badge-text {
            font-family: 'Karla', sans-serif;
            font-size: 13px;
            font-weight: 800;
            fill: var(--ink);
            text-anchor: middle;
        }

        .showcase-card {
            position: relative;
            width: 100%;
            height: 100%;

            border-radius: 10px;
            overflow: hidden;

            border: 3px solid var(--tier-a);
            box-shadow:
                0 0 46px -6px var(--tier-a),
                0 22px 40px rgba(0,0,0,.6);

            background: #0A0A0A;

            cursor: pointer;

            transform-style: preserve-3d;
            transform: rotateX(var(--ry, 0deg)) rotateY(var(--rx, 0deg)) scale(var(--card-scale, 1));

            transition: transform .12s ease-out, box-shadow .3s ease, border-color .3s ease;
        }

        .showcase-card.settling {
            transition: transform .5s cubic-bezier(.22, 1, .36, 1), box-shadow .3s ease, border-color .3s ease;
        }

        .card-art {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .showcase-face {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(180deg, transparent 55%, rgba(0,0,0,.7) 100%),
                linear-gradient(180deg, transparent 70%, var(--tier-a) 220%);
        }

        /* Ambient container flash — fires on its own timer every so
           often, independent of pointer/tilt. A brief whole-card
           brightness pulse, like a distant flicker. */
        .container-flash {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background: #E8F3FF;
            opacity: 0;
            mix-blend-mode: screen;
        }

        .container-flash.flash-active {
            animation: container-flash-pulse .35s ease-out;
        }

        @keyframes container-flash-pulse {
            0%   { opacity: 0; }
            30%  { opacity: .22; }
            55%  { opacity: .05; }
            75%  { opacity: .14; }
            100% { opacity: 0; }
        }

        .showcase-face .placeholder-mark {
            font-family: 'Fraunces', serif;
            font-size: 42px;
            font-weight: 600;
            color: rgba(255,255,255,.25);
        }

        /* ============================================================
           HOLO LAYERS — pointer-driven, one active class at a time
           Each layer's gradient position/angle is tied to --px/--py
           (0-100, pointer position across the card) so the shine
           moves opposite the tilt, like it's stuck to the surface.
           ============================================================ */

        .holo-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: color-dodge;
            transition: opacity .25s ease;
        }

        .showcase-card[data-finish="spot"] .holo-layer.spot,
        .showcase-card[data-finish="reverse"] .holo-layer.reverse,
        .showcase-card[data-finish="full"] .holo-layer.full,
        .showcase-card[data-finish="prism"] .holo-layer.prism {
            opacity: 1;
        }

        /* Layer 1 — Spot Holo: filled diamond tile pattern (not thin
           crosshatch lines) with a moving shine band across it,
           masked to a centered art silhouette only. */
        .holo-layer.spot {
            -webkit-mask-image: radial-gradient(ellipse 55% 42% at 50% 46%, #000 60%, transparent 100%);
            mask-image: radial-gradient(ellipse 55% 42% at 50% 46%, #000 60%, transparent 100%);
            filter: hue-rotate(calc(var(--px, 50) * 2.4deg));
        }

        /* Non-rotated wrapper carrying the pointer-tracked sweep
           mask. The diamond tiles inside are rotated, but this
           wrapper isn't, so the sweep band still moves straight
           across as the pointer moves — only diamonds inside the
           band are visible, so the moving glare IS made of diamonds. */
        .spot-shine-mask {
            position: absolute;
            inset: 0;
            -webkit-mask-image: linear-gradient(
                115deg,
                transparent calc(var(--px, 50%) - 22%),
                #000 var(--px, 50%),
                transparent calc(var(--px, 50%) + 22%)
            );
            mask-image: linear-gradient(
                115deg,
                transparent calc(var(--px, 50%) - 22%),
                #000 var(--px, 50%),
                transparent calc(var(--px, 50%) + 22%)
            );
        }

        .spot-diamond-tiles {
            position: absolute;
            inset: -40%;
            background-image:
                linear-gradient(45deg, rgba(255,255,255,.7) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,.7) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,.7) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.7) 75%);
            background-size: 132px 132px;
            background-position: 33px 33px, 33px 99px, 99px -33px, -33px 33px;
            transform: rotate(45deg);
        }

        /* Layer 2 — Reverse Holo: shine everywhere EXCEPT the art silhouette */
        .holo-layer.reverse {
            background: linear-gradient(
                115deg,
                transparent calc(var(--px, 50%) - 26%),
                rgba(255,255,255,.8) var(--px, 50%),
                transparent calc(var(--px, 50%) + 26%)
            );
            -webkit-mask-image: radial-gradient(ellipse 55% 42% at 50% 46%, transparent 60%, #000 100%);
            mask-image: radial-gradient(ellipse 55% 42% at 50% 46%, transparent 60%, #000 100%);
            filter: hue-rotate(calc(var(--px, 50) * 2.4deg));
        }

        /* Layer 3 — Full Holo / Cosmos: whole card, repeating starlight pattern */
        .holo-layer.full {
            background:
                repeating-linear-gradient(
                    45deg,
                    rgba(255,120,200,.55) 0%,
                    rgba(255,220,120,.55) 12%,
                    rgba(120,255,200,.55) 24%,
                    rgba(120,180,255,.55) 36%,
                    rgba(255,120,200,.55) 48%
                );
            background-size: 300% 300%;
            background-position: var(--px, 50%) var(--py, 50%);
        }

        /* Layer 4 — Prism / Refractor: hard diagonal bands, faster shift, sharper edges */
        .holo-layer.prism {
            background:
                repeating-linear-gradient(
                    115deg,
                    rgba(255,80,180,.9) 0%,
                    rgba(255,80,180,.9) 6%,
                    rgba(255,210,80,.9) 6%,
                    rgba(255,210,80,.9) 12%,
                    rgba(110,255,180,.9) 12%,
                    rgba(110,255,180,.9) 18%,
                    rgba(100,170,255,.9) 18%,
                    rgba(100,170,255,.9) 24%
                );
            background-size: 220% 220%;
            background-position: var(--px, 50%) var(--py, 50%);
            mix-blend-mode: hard-light;
        }

        /* Base level (no fusion yet) — a calculated electric formation:
           one path travels from a defined anchor (an edge or center)
           to another, with sharp jagged spark kinks along the way,
           via JS as a directional stroke reveal — not a flicker. */
        .holo-layer.electric {
            opacity: 1;
            mix-blend-mode: screen;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .holo-layer.electric svg {
            width: 140%;
            height: 140%;
            overflow: visible;
        }

        .holo-layer.foreground-spark {
            z-index: 10;
        }

        .holo-layer.foreground-spark svg {
            width: 180%;
            height: 180%;
            overflow: visible;
        }

        .arc-path {
            opacity: 0;
        }

        .showcase-platform {
            position: relative;
            z-index: 1;

            width: 280px;
            height: 140px;
            margin-top: -20px;
        }

        .pedestal-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .showcase.fusing .pedestal-svg {
            animation: pedestal-pulse 0.9s ease-in-out infinite;
        }

        @keyframes pedestal-pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.4); }
        }

        .showcase-plaque {
            position: relative;
            z-index: 2;

            margin-top: 18px;
            text-align: center;
        }

        .showcase-name {
            font-family: 'Fraunces', serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: .01em;
            color: var(--ink);
        }

        .showcase-tags {
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .showcase-tier-badge {
            padding: 3px 11px;
            border-radius: 20px;
            border: 1px solid var(--tier-a);

            font-family: 'Karla', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--tier-a);
        }

        .showcase-deck {
            font-size: 12px;
            color: var(--ink-muted);
        }

        .showcase-fuse-btn {
            position: absolute;
            left: 14px;
            bottom: 14px;
            z-index: 3;

            display: flex;
            align-items: center;
            gap: 6px;

            padding: 8px 14px;
            border-radius: 20px;

            background: rgba(0,0,0,.5);
            border: 1px solid var(--tier-a, var(--brass));
            color: var(--ink);

            font-family: 'Karla', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;

            cursor: pointer;
            backdrop-filter: blur(3px);

            transition: background .15s ease, transform .1s ease;
        }

        .showcase-fuse-btn:hover {
            background: rgba(0,0,0,.68);
        }

        .showcase-fuse-btn:active {
            transform: scale(.97);
        }

        .showcase-fuse-btn .fuse-icon {
            color: var(--tier-a, var(--brass));
            font-size: 13px;
            line-height: 1;
        }

        /* ============================================================
           FUSION EFFECT LEVELS — applied to .showcase while testing
           ============================================================ */

        .showcase.fusing .card-stage {
            animation: fuse-pulse-card 0.9s ease-in-out infinite;
        }

        .showcase.fusing::after {
            opacity: .5;
        }

        @keyframes fuse-pulse-card {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.035); }
        }

        .showcase[data-fx-level="1"].fusing::after { opacity: .35; }
        .showcase[data-fx-level="2"].fusing::after { opacity: .5; }
        .showcase[data-fx-level="3"].fusing::after { opacity: .68; }
        .showcase[data-fx-level="4"].fusing::after { opacity: .85; }
        .showcase[data-fx-level="5"].fusing::after { opacity: 1; }

        .showcase[data-fx-level="1"].fusing .card-stage { animation-duration: 1.3s; }
        .showcase[data-fx-level="2"].fusing .card-stage { animation-duration: 1.0s; }
        .showcase[data-fx-level="3"].fusing .card-stage { animation-duration: 0.75s; }
        .showcase[data-fx-level="4"].fusing .card-stage { animation-duration: 0.5s; }
        .showcase[data-fx-level="5"].fusing .card-stage { animation-duration: 0.32s; }

        /* ============================================================
           TEST CONTROLS — not part of the real UI, demo-only
           ============================================================ */

        .controls {
            background: var(--page-shadow);
            border: 1px solid var(--page-edge);
            border-radius: 8px;
            padding: 18px;
        }

        .controls h2 {
            font-family: 'Fraunces', serif;
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 12px;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .controls h2:not(:first-child) {
            margin-top: 18px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .control-row label {
            font-size: 12px;
            color: var(--ink-muted);
        }

        .tier-select {
            background: var(--page);
            border: 1px solid var(--page-edge);
            color: var(--ink);
            border-radius: 4px;
            padding: 6px 10px;
            font-family: 'Karla', sans-serif;
            font-size: 12px;
        }

        .level-buttons, .finish-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .level-btn, .finish-btn {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--page-edge);
            background: var(--page);
            color: var(--ink-muted);
            font-family: 'Karla', sans-serif;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .level-btn {
            padding: 6px 10px;
            text-align: center;
        }

        .level-btn.active, .finish-btn.active {
            background: var(--brass);
            border-color: var(--brass);
            color: #141414;
        }

        .stop-btn {
            margin-top: 4px;
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--page-edge);
            background: transparent;
            color: var(--ink);
            font-family: 'Karla', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .stop-btn:hover {
            border-color: var(--ink-faint);
        }

        .hint {
            font-size: 11px;
            color: var(--ink-faint);
            margin-top: -4px;
            margin-bottom: 14px;
        }
    </style>
</head>

                    <div class="holo-layer electric" id="electricLayer">
                        <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <filter id="arcDistort" x="-100%" y="-100%" width="300%" height="300%">
                                    <feTurbulence
                                        id="arcTurbulence"
                                        type="turbulence"
                                        baseFrequency="0.02 0.03"
                                        numOctaves="1"
                                        seed="3"
                                        result="noise"
                                    />
                                    <feDisplacementMap
                                        in="SourceGraphic"
                                        in2="noise"
                                        scale="5"
                                        xChannelSelector="R"
                                        yChannelSelector="G"
                                    />
                                </filter>
                                <filter id="arcGlow" x="-200%" y="-200%" width="500%" height="500%">
                                    <feGaussianBlur stdDeviation="2.2" result="blur" />
                                    <feMerge>
                                        <feMergeNode in="blur" />
                                        <feMergeNode in="SourceGraphic" />
                                    </feMerge>
                                </filter>
                            </defs>

                            <g filter="url(#arcDistort)" stroke-linecap="round" fill="none">
                                <!-- Calculated formation: a single wavy path with one
                                     jagged spark kinks, built and animated (draw-on travel)
                                     entirely by JS. d/dasharray/dashoffset are all set
                                     at runtime — these two paths share the same shape,
                                     one wide soft glow behind a thin bright core. -->
                                <path id="arcGlowPath0" class="arc-path" filter="url(#arcGlow)" stroke="#9B6BD6" stroke-width="1.2" opacity="0.28" />
                                <path id="arcCorePath0" class="arc-path" stroke="#F1E6FF" stroke-width="0.35" opacity="0.6" />
                                <path id="arcBluePath0" class="arc-path" stroke="#BFE6FF" stroke-width="0.3" opacity="0.55" />

                                <path id="arcCorePath1" class="arc-path" stroke="#F1E6FF" stroke-width="0.35" opacity="0.6" />
                                <path id="arcBluePath1" class="arc-path" stroke="#BFE6FF" stroke-width="0.3" opacity="0.55" />

    <!-- ============================================================
         CONFIG / STATE — DOM refs and lookup tables.
         (carry this over — needed by everything below)
         ============================================================ -->

    <script>
        const TIER_COLORS = {
            common:    ["#8C8880", "#6E6A64"],
            rare:      ["#4FB6A8", "#2F8078"],
            epic:      ["#9B6BD6", "#6B47A0"],
            legendary: ["#E8A23D", "#B8781F"],
            mythic:    ["#FF6B9D", "#C77DFF"]
        };

        const LEVEL_FINISH = {
            "1": "none",
            "2": "spot",
            "3": "reverse",
            "4": "full",
            "5": "prism"
        };

        const showcase = document.getElementById("showcase");
        const cardStage = document.getElementById("cardStage");
        const showcaseCard = document.getElementById("showcaseCard");
        const showcaseTier = document.getElementById("showcaseTier");
        const electricLayer = showcaseCard.querySelector(".holo-layer.electric");
    </script>

    <!-- ============================================================
         TIER & FUSION LEVEL — sets which finish/colors are active.
         (carry this over — this is the real fusion mechanic surface:
         setLevel() is what a fusion upgrade should call)
         ============================================================ -->

    <script>
        function applyTier(tier) {
            const [tierA, tierB] = TIER_COLORS[tier];
            showcase.style.setProperty("--tier-a", tierA);
            showcase.style.setProperty("--tier-b", tierB);
            showcaseTier.textContent = tier;
        }

        function setLevel(level) {
            showcase.dataset.fxLevel = level;
            showcaseCard.dataset.finish = LEVEL_FINISH[level];

            const badgeNum = document.getElementById("fusionBadgeNum");
            if (badgeNum) badgeNum.textContent = level;
        }

        function startFuse() {
            showcase.classList.add("fusing");
        }

        function stopFuse() {
            showcase.classList.remove("fusing");
        }
    </script>

    <!-- ============================================================
         POINTER-REACTIVE TILT + HOLO TRACKING

         On move: compute pointer position as a 0-100% coordinate
         across the card, set --px/--py (drives the holo gradient
         position/mask center) and --rx/--ry (drives the 3D tilt).
         On leave: smoothly settle back to flat/centered.
         (carry this over — this is the real card interaction)
         ============================================================ -->

    <script>
        const MAX_TILT_DEG = 14;
        let lastZapTime = 0;
        const ZAP_THROTTLE_MS = 450;

        // Defined anchors electricity can travel between — an edge
        // midpoint or the center. Formations always start at one of
        // these and travel to another, never a floating random point.
        const ANCHORS = {
            top:         { x: 100, y: 15 },
            bottom:      { x: 100, y: 265 },
            left:        { x: 12,  y: 140 },
            right:       { x: 188, y: 140 },
            topLeft:     { x: 22,  y: 30 },
            topRight:    { x: 178, y: 30 },
            bottomLeft:  { x: 22,  y: 250 },
            bottomRight: { x: 178, y: 250 },
            center:      { x: 100, y: 140 }
        };

        // Every distinct pair of anchors is a valid route — no need
        // to hand-list them, corners included, so formations can
        // travel diagonally too, not just up/down/left/right.
        const ANCHOR_KEYS = Object.keys(ANCHORS);
        const ANCHOR_ROUTES = [];
        for (let i = 0; i < ANCHOR_KEYS.length; i++) {
            for (let j = i + 1; j < ANCHOR_KEYS.length; j++) {
                ANCHOR_ROUTES.push([ANCHOR_KEYS[i], ANCHOR_KEYS[j]]);
            }
        }

        // Build a smooth wave of points from a to b (a few calculated
        // oscillations perpendicular to the direct line — not jitter
        // per-segment, one continuous waveform for the whole path).
        function buildWavePoints(a, b, waves, amplitude, pointCount) {
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const nx = -dy / dist; // perpendicular unit vector
            const ny = dx / dist;
            const phase = Math.random() * Math.PI * 2;

            const points = [];
            for (let i = 0; i <= pointCount; i++) {
                const t = i / pointCount;
                const baseX = a.x + dx * t;
                const baseY = a.y + dy * t;
                const envelope = Math.sin(t * Math.PI); // 0 at ends, 1 at middle — keeps the anchors clean
                const offset = Math.sin(t * waves * Math.PI * 2 + phase) * amplitude * envelope;

                // Small per-point jitter on top of the smooth wave —
                // this is what actually reads as jaggedness; without
                // it every point sits on one clean sine curve.
                const jitter = (Math.random() - 0.5) * amplitude * 0.5 * envelope;

                points.push({ x: baseX + nx * (offset + jitter), y: baseY + ny * (offset + jitter) });
            }
            return points;
        }

        // Insert a sharp jagged kink at one point along the path —
        // a quick angular back-and-forth spark, not a circular loop.
        // Real electric-arc art shows tight zigzag kinks like this,
        // not smooth coils.
        function insertSpark(points, atIndex, size) {
            const p = points[atIndex];
            const prev = points[Math.max(0, atIndex - 1)];

            // perpendicular to the local path direction at this point
            const dx = p.x - prev.x;
            const dy = p.y - prev.y;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            const nx = -dy / len;
            const ny = dx / len;

            const sparkPoints = [
                { x: p.x + nx * size, y: p.y + ny * size },
                { x: p.x - nx * size * 0.7, y: p.y - ny * size * 0.7 },
                { x: p.x + nx * size * 0.4, y: p.y + ny * size * 0.4 }
            ];

            points.splice(atIndex, 0, ...sparkPoints);
        }

        // Convert a point list into a jagged SVG path — straight
        // line segments between points, not smoothed curves. This
        // is what makes it read as electric/jagged rather than a
        // clean flowing wave.
        function pointsToSmoothPath(points) {
            if (points.length < 2) return "";
            let d = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
            for (let i = 1; i < points.length; i++) {
                d += ` L ${points[i].x.toFixed(1)} ${points[i].y.toFixed(1)}`;
            }
            return d;
        }

        function buildElectricFormation() {
            const [startKey, endKey] = ANCHOR_ROUTES[Math.floor(Math.random() * ANCHOR_ROUTES.length)];
            const start = ANCHORS[startKey];
            const end = ANCHORS[endKey];

            const points = buildWavePoints(start, end, 2.5, 14, 16);

            // 1-2 sharp spark kinks scattered along the middle of the
            // formation, inserted back-to-front so earlier indices
            // stay valid after each splice.
            const sparkCount = 1 + Math.floor(Math.random() * 2);
            const usedIndexes = [];
            for (let i = 0; i < sparkCount; i++) {
                let idx;
                do {
                    idx = 5 + Math.floor(Math.random() * 8);
                } while (usedIndexes.includes(idx));
                usedIndexes.push(idx);
            }
            usedIndexes.sort((a, b) => b - a).forEach((idx) => {
                insertSpark(points, idx, 6 + Math.random() * 4);
            });

            return { d: pointsToSmoothPath(points), points };
        }

        // Grow a single tree-branch from a point on the parent line —
        // a short jittered path diverging away from the parent's
        // local direction. May spawn one smaller sub-branch off
        // itself (depth 2), matching the forking, tapering look of
        // real electric-formation reference art.
        function buildBranchSpecs(parentPoints, parentSpawnT, depth) {
            if (depth > 2 || parentPoints.length < 3) return [];

            const specs = [];
            const skipEdge = Math.min(2, Math.floor(parentPoints.length / 4));

            for (let i = skipEdge; i < parentPoints.length - skipEdge; i++) {
                const branchChance = depth === 1 ? 0.3 : 0.4;
                if (Math.random() >= branchChance) continue;

                const p = parentPoints[i];
                const prev = parentPoints[Math.max(0, i - 1)];
                const dirAngle = Math.atan2(p.y - prev.y, p.x - prev.x);
                const side = Math.random() < 0.5 ? 1 : -1;
                const branchAngle = dirAngle + side * (0.55 + Math.random() * 0.7);

                const length = (22 + Math.random() * 20) / depth;
                const segments = 3;
                const segLen = length / segments;

                const branchPoints = [{ x: p.x, y: p.y }];
                let cx = p.x;
                let cy = p.y;
                for (let s = 0; s < segments; s++) {
                    const ang = branchAngle + (Math.random() - 0.5) * 0.5;
                    cx += Math.cos(ang) * segLen;
                    cy += Math.sin(ang) * segLen;
                    branchPoints.push({ x: cx, y: cy });
                }

                const spawnT = Math.min(1, parentSpawnT + (i / parentPoints.length) * 0.15);

                specs.push({
                    d: pointsToSmoothPath(branchPoints),
                    spawnT,
                    strokeWidth: 0.32 / depth,
                    peakOpacity: 0.5 / depth
                });

                if (depth === 1) {
                    specs.push(...buildBranchSpecs(branchPoints, spawnT, depth + 1));
                }
            }

            return specs;
        }

        function renderBranches(branchGroupEl, specs, mainDurationMs) {
            const ns = "http://www.w3.org/2000/svg";
            branchGroupEl.innerHTML = "";

            specs.forEach((spec) => {
                const path = document.createElementNS(ns, "path");
                path.setAttribute("d", spec.d);
                path.setAttribute("stroke", "#BFE6FF");
                path.setAttribute("stroke-width", spec.strokeWidth.toFixed(2));
                path.setAttribute("fill", "none");
                path.setAttribute("stroke-linecap", "round");
                path.setAttribute("opacity", "0");
                branchGroupEl.appendChild(path);

                const length = path.getTotalLength();
                const delay = spec.spawnT * mainDurationMs;

                path.animate(
                    [
                        { strokeDasharray: `${length}`, strokeDashoffset: length, opacity: 0 },
                        { strokeDasharray: `${length}`, strokeDashoffset: 0, opacity: spec.peakOpacity, offset: 0.4 },
                        { strokeDasharray: `${length}`, strokeDashoffset: 0, opacity: 0, offset: 1 }
                    ],
                    { duration: 260, delay, easing: "ease-out", fill: "forwards" }
                );
            });
        }

        const STRAND_DURATION_MS = 650;

        function animateStrand(paths, branchGroupEl, delayMs) {
            const { d, points } = buildElectricFormation();

            paths.forEach((path) => {
                path.setAttribute("d", d);
                const length = path.getTotalLength();
                const peakOpacity = parseFloat(path.getAttribute("opacity")) || 1;

                path.getAnimations().forEach(anim => anim.cancel());

                path.animate(
                    [
                        { strokeDasharray: `${length}`, strokeDashoffset: length, opacity: peakOpacity },
                        { strokeDasharray: `${length}`, strokeDashoffset: 0, opacity: peakOpacity, offset: 0.55 },
                        { strokeDasharray: `${length}`, strokeDashoffset: -length * 0.12, opacity: 0, offset: 1 }
                    ],
                    { duration: STRAND_DURATION_MS, delay: delayMs, easing: "ease-in-out", fill: "forwards" }
                );
            });

            const branchSpecs = buildBranchSpecs(points, 0, 1);
            renderBranches(branchGroupEl, branchSpecs, STRAND_DURATION_MS);
        }

        function maybeTriggerElectric() {
            if (parseInt(showcase.dataset.fxLevel, 10) > 2) return;

            const now = performance.now();
            if (now - lastZapTime < ZAP_THROTTLE_MS) return;
            lastZapTime = now;

            for (let i = 0; i < 3; i++) {
                const glowPath = document.getElementById(`arcGlowPath${i}`);
                const corePath = document.getElementById(`arcCorePath${i}`);
                const bluePath = document.getElementById(`arcBluePath${i}`);
                const whitePath = document.getElementById(`arcWhitePath${i}`);
                const branchGroupEl = document.getElementById(`branchGroup${i}`);
                animateStrand([glowPath, corePath, bluePath, whitePath], branchGroupEl, i * 40);
            }
        }

        function updateFromPointer(clientX, clientY) {
            const rect = showcaseCard.getBoundingClientRect();

            const relX = (clientX - rect.left) / rect.width;
            const relY = (clientY - rect.top) / rect.height;

            const clampedX = Math.min(1, Math.max(0, relX));
            const clampedY = Math.min(1, Math.max(0, relY));

            const px = clampedX * 100;
            const py = clampedY * 100;

            const rx = (clampedX - 0.5) * 2 * MAX_TILT_DEG;
            const ry = (0.5 - clampedY) * 2 * MAX_TILT_DEG;

            showcaseCard.classList.remove("settling");
            showcaseCard.style.setProperty("--px", px + "%");
            showcaseCard.style.setProperty("--py", py + "%");
            showcaseCard.style.setProperty("--rx", rx + "deg");
            showcaseCard.style.setProperty("--ry", ry + "deg");
            showcaseCard.style.setProperty("--card-scale", "1.03");

            maybeTriggerElectric();
        }

        function resetTilt() {
            showcaseCard.classList.add("settling");
            showcaseCard.style.setProperty("--px", "15%");
            showcaseCard.style.setProperty("--py", "20%");
            showcaseCard.style.setProperty("--rx", "0deg");
            showcaseCard.style.setProperty("--ry", "0deg");
            showcaseCard.style.setProperty("--card-scale", "1");
        }

        cardStage.addEventListener("mousemove", (e) => {
            updateFromPointer(e.clientX, e.clientY);
        });

        cardStage.addEventListener("mouseleave", resetTilt);

        cardStage.addEventListener("touchmove", (e) => {
            if (e.touches && e.touches.length) {
                updateFromPointer(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        cardStage.addEventListener("touchend", resetTilt);
    </script>

    <!-- ============================================================
         DEMO-ONLY EVENT BINDINGS + INIT

         Everything in this block wires up the TEST CONTROLS panel
         (tier dropdown, level buttons, fuse/stop buttons). Do NOT
         carry this block over — the real UI will call applyTier(),
         setLevel(), startFuse()/stopFuse() from its own triggers
         (e.g. a fusion confirm action instead of a test button).
         ============================================================ -->

    <script>
        const tierSelect = document.getElementById("tierSelect");
        const levelButtons = document.querySelectorAll(".level-btn");
        const fuseBtn = document.getElementById("fuseBtn");
        const stopBtn = document.getElementById("stopBtn");

        tierSelect.addEventListener("change", (e) => applyTier(e.target.value));

        levelButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                setLevel(btn.dataset.level);
                levelButtons.forEach(b => b.classList.toggle("active", b === btn));
            });
        });

        fuseBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            startFuse();
        });

        stopBtn.addEventListener("click", stopFuse);

        // Ambient container flash — independent of pointer/tilt,
        // fires on its own random interval every so often.
        const containerFlash = document.getElementById("containerFlash");

        function scheduleContainerFlash() {
            const nextDelay = 4000 + Math.random() * 6000; // every 4-10s
            setTimeout(() => {
                if (parseInt(showcase.dataset.fxLevel, 10) <= 2) {
                    containerFlash.classList.remove("flash-active");
                    void containerFlash.offsetWidth;
                    containerFlash.classList.add("flash-active");
                }
                scheduleContainerFlash();
            }, nextDelay);
        }

        // FOREGROUND SPARK — a short streak with a fully random start
        // point and a fully random direction/length. Not derived from
        // ANCHORS, not routed between two fixed sides — it can appear
        // anywhere, including drifting slightly past the card's own
        // edges, so it never reads as "connected to" the container.
        function buildFreeFloatingSpark() {
            const marginX = 30;
            const marginY = 40;

            const start = {
                x: -marginX + Math.random() * (200 + marginX * 2),
                y: -marginY + Math.random() * (280 + marginY * 2)
            };

            const angle = Math.random() * Math.PI * 2;
            const length = 55 + Math.random() * 85;
            const end = {
                x: start.x + Math.cos(angle) * length,
                y: start.y + Math.sin(angle) * length
            };

            const points = buildWavePoints(start, end, 1.5, 7, 9);
            return pointsToSmoothPath(points);
        }

        function triggerForegroundSpark() {
            const d = buildFreeFloatingSpark();
            const glow = document.getElementById("fgSparkGlow");
            const core = document.getElementById("fgSparkCore");

            [glow, core].forEach((path) => {
                path.setAttribute("d", d);
                const length = path.getTotalLength();
                const peakOpacity = parseFloat(path.getAttribute("opacity")) || 1;

                path.getAnimations().forEach(anim => anim.cancel());

                path.animate(
                    [
                        { strokeDasharray: `${length}`, strokeDashoffset: length, opacity: peakOpacity },
                        { strokeDasharray: `${length}`, strokeDashoffset: 0, opacity: peakOpacity, offset: 0.5 },
                        { strokeDasharray: `${length}`, strokeDashoffset: -length * 0.15, opacity: 0, offset: 1 }
                    ],
                    { duration: 420, easing: "ease-in-out", fill: "forwards" }
                );
            });
        }

        function scheduleForegroundSpark() {
            const nextDelay = 3000 + Math.random() * 4000; // every 3-7s, independent of the container flash
            setTimeout(() => {
                if (parseInt(showcase.dataset.fxLevel, 10) <= 2) {
                    triggerForegroundSpark();
                }
                scheduleForegroundSpark();
            }, nextDelay);
        }

        applyTier("mythic");
        setLevel(1);
        resetTilt();
        scheduleContainerFlash();
        scheduleForegroundSpark();
    </script>
