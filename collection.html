<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZETSU PACKZ — Collection</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        /* ============================================================
           TOKENS
           ============================================================ */

        :root {
            /* -- booklet palette -- */
            --page: #0A0A0A;
            --page-shadow: #141414;
            --page-edge: #333333;
            --binding: #3B2A1E;
            --binding-2: #2A1D14;
            --ink: #EDE6DC;
            --ink-muted: #9A958E;
            --ink-faint: #6E6A64;

            /* -- carried over from shop/leaderboard so tiers stay
                  recognizable across every page -- */
            --common: #8C8880;
            --rare: #4FB6A8;
            --epic: #9B6BD6;
            --legendary: #E8A23D;
            --mythic-a: #FF6B9D;
            --mythic-b: #C77DFF;

            /* -- reused header vars (unchanged from shop.html /
                  leaderboard.html so the .hud component matches) -- */
            --panel-2: #1C1C1C;
            --line: #333333;
            --hud-ink: #EDE6DC;
            --brass: #D4AF6A;
            --brass-dim: #8A7245;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--page);
            color: var(--ink);

            font-family: 'Karla', sans-serif;

            min-height: 100vh;
        }

        @media (min-width: 768px) {
            body {
                zoom: 0.60;
            }
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .display {
            font-family: 'Fraunces', serif;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }


        /* ============================================================
           HEADER — same .hud component as shop.html / leaderboard.html
           ============================================================ */

        .hud {
            position: sticky;
            top: 0;
            z-index: 50;

            background: rgba(0, 0, 0, .92);
            backdrop-filter: blur(6px);

            border-bottom: 3px solid var(--line);

            padding: 14px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
            gap: 12px;
        }

        .hud .brand {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0;
        }

        .hud .brand .mark {
            font-size: 10px;
            letter-spacing: .28em;
            color: var(--brass);
            text-transform: uppercase;
            font-weight: 700;
            font-family: 'Karla', sans-serif;
        }

        .hud .brand h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: .02em;
            text-transform: uppercase;
            color: var(--hud-ink);
            font-family: 'Karla', sans-serif;
        }

        .hud nav {
            display: flex;
            gap: 4px;
        }

        .hud .navlink {
            padding: 8px 14px;
            border-radius: 3px;
            font-size: 11px;
            letter-spacing: .12em;
            text-transform: uppercase;
            font-weight: 700;
            color: #9A958E;
            border: 3px solid transparent;
            font-family: 'Karla', sans-serif;
        }

        .hud .navlink:hover {
            color: var(--hud-ink);
        }

        .hud .navlink.current {
            background: var(--brass);
            color: #141414;
        }

        .hud .hud-stats {
            display: flex;
            align-items: center;
            gap: 18px;
        }


        /* ============================================================
           PAGE FRAME — the booklet page sitting under the leather
           binding header. This margin + texture is the one deliberate
           "physical object" move the rest of the page stays quiet for.
           ============================================================ */

        .booklet {
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 28px 50px;
        }

        .book-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;

            margin-bottom: 22px;

            padding-bottom: 16px;
            border-bottom: 2px solid var(--page-edge);
        }

        .book-heading h2 {
            margin: 0;
            font-size: 34px;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1;
        }

        .book-heading .book-sub {
            margin-top: 6px;
            color: var(--ink-muted);
            font-size: 13px;
            max-width: 46ch;
            line-height: 1.5;
        }

        .book-count {
            font-family: 'Fraunces', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--ink-muted);
            white-space: nowrap;
        }

        .book-count strong {
            color: var(--ink);
        }


        /* ============================================================
           FILTER STRIP — a tab, not a toolbar
           ============================================================ */

        .filter-strip {
            display: flex;
            gap: 8px;
        }

        .filter-tab {
            padding: 9px 18px;
            border: 2px solid var(--page-edge);
            background: transparent;
            color: var(--ink-muted);

            font-family: 'Karla', sans-serif;
            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
            transition: background .15s ease, color .15s ease, border-color .15s ease;
        }

        .filter-tab:first-child {
            border-radius: 4px 0 0 4px;
        }

        .filter-tab:last-child {
            border-radius: 0 4px 4px 0;
        }

        .filter-tab + .filter-tab {
            border-left: none;
        }

        .filter-tab.active {
            background: var(--brass);
            border-color: var(--brass);
            color: #141414;
        }

        .filter-tab:not(.active):hover {
            color: var(--ink);
            border-color: var(--ink-faint);
        }


        /* ============================================================
           SHOWCASE — the pedestal display for the selected card.
           This is the page's main visual event; the grid below is
           just how you pick what stands on it.
           ============================================================ */

        .showcase {
            --tier-a: var(--brass);
            --tier-b: var(--brass-dim);

            position: relative;
            isolation: isolate;
            overflow: hidden;

            border-radius: 10px;
            border: 1px solid var(--page-edge);
            background: #050505;

            padding: 54px 20px 34px;
            margin-bottom: 24px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .showcase::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;

            background-image:
                repeating-linear-gradient(0deg, rgba(120,170,220,.08) 0 1px, transparent 1px 42px),
                repeating-linear-gradient(90deg, rgba(120,170,220,.08) 0 1px, transparent 1px 42px);
        }

        .showcase::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;

            background: radial-gradient(ellipse 55% 50% at 50% 38%, var(--tier-a), transparent 72%);
            opacity: .22;

            transition: background .3s ease;
        }

        .showcase-card {
            position: relative;
            z-index: 2;

            width: 190px;
            aspect-ratio: 5 / 7;

            border-radius: 10px;
            overflow: hidden;

            border: 3px solid var(--tier-a);
            box-shadow:
                0 0 46px -6px var(--tier-a),
                0 22px 40px rgba(0,0,0,.6);

            margin-bottom: -30px;

            background: #0A0A0A;

            transition: border-color .3s ease, box-shadow .3s ease;
        }

        .showcase-face {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(180deg, transparent 55%, rgba(0,0,0,.7) 100%),
                linear-gradient(180deg, transparent 70%, var(--tier-a) 220%);
        }

        .showcase-platform {
            position: relative;
            z-index: 1;

            width: 250px;
            height: 60px;
        }

        .showcase-platform .ring {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .showcase-platform .ring-outer {
            width: 250px;
            height: 60px;
            border: 2px solid var(--tier-a);
            opacity: .55;
            box-shadow: 0 0 34px var(--tier-a);
        }

        .showcase-platform .ring-inner {
            width: 180px;
            height: 40px;
            background: radial-gradient(ellipse at center, var(--tier-a), transparent 72%);
            opacity: .4;
            filter: blur(1px);
        }

        .showcase-plaque {
            position: relative;
            z-index: 2;

            margin-top: 18px;
            text-align: center;
        }

        .showcase-name {
            font-family: 'Fraunces', serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: .01em;
            color: var(--ink);
        }

        .showcase-tags {
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .showcase-tier-badge {
            padding: 3px 11px;
            border-radius: 20px;
            border: 1px solid var(--tier-a);

            font-family: 'Karla', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--tier-a);
        }

        .showcase-deck {
            font-size: 12px;
            color: var(--ink-muted);
        }

        .showcase.empty .showcase-card,
        .showcase.empty .showcase-platform,
        .showcase.empty .showcase-fuse-btn {
            display: none;
        }

        .showcase-empty-note {
            position: relative;
            z-index: 2;

            display: none;
            color: var(--ink-muted);
            font-size: 13px;
            padding: 30px 0;
        }

        .showcase.empty .showcase-empty-note {
            display: block;
        }

        .showcase-fuse-btn {
            position: absolute;
            left: 14px;
            bottom: 14px;
            z-index: 3;

            display: flex;
            align-items: center;
            gap: 6px;

            padding: 8px 14px;
            border-radius: 20px;

            background: rgba(0,0,0,.5);
            border: 1px solid var(--tier-a, var(--brass));
            color: var(--ink);

            font-family: 'Karla', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;

            cursor: pointer;
            backdrop-filter: blur(3px);

            transition: background .15s ease, transform .1s ease;
        }

        .showcase-fuse-btn:hover {
            background: rgba(0,0,0,.68);
        }

        .showcase-fuse-btn:active {
            transform: scale(.97);
        }

        .showcase-fuse-btn .fuse-icon {
            color: var(--tier-a, var(--brass));
            font-size: 13px;
            line-height: 1;
        }


        /* ============================================================
           GRID — a compact picker panel, not the whole page. It
           scrolls within itself so the showcase stays put.
           ============================================================ */

        .grid-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .grid-heading .grid-label {
            font-family: 'Fraunces', serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--ink);
        }

        .page-surface {
            background: var(--page-shadow);
            border: 1px solid var(--page-edge);
            border-radius: 6px;

            padding: 22px 22px;

            max-height: 260px;
            overflow-y: auto;

            box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
        }

        .page-surface::-webkit-scrollbar {
            width: 8px;
        }

        .page-surface::-webkit-scrollbar-thumb {
            background: var(--page-edge);
            border-radius: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 16px 12px;
        }

        

        /* ---- card slot ---- */

        .slot {
            position: relative;
            aspect-ratio: 5 / 7;

            border-radius: 6px;
            overflow: hidden;

            cursor: default;
        }

        .slot.owned {
            cursor: pointer;
            box-shadow:
                0 2px 4px rgba(42,32,24,.25),
                0 8px 18px rgba(42,32,24,.18);
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .slot.owned:hover {
            transform: translateY(-3px);
            box-shadow:
                0 4px 8px rgba(42,32,24,.3),
                0 14px 26px rgba(42,32,24,.24);
        }

        .slot.owned:active {
            transform: translateY(-1px) scale(.98);
        }

        .slot.owned {
            background: #0A0A0A;
            border: 2px solid var(--tier-a);
        }

        .slot-face {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;

            padding: 10px;

            background:
                linear-gradient(180deg, transparent 55%, rgba(0,0,0,.7) 100%),
                linear-gradient(180deg, transparent 70%, var(--tier-a) 220%);
        }

        .slot-name {
            font-family: 'Fraunces', serif;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            line-height: 1.15;

            text-shadow: 0 1px 3px rgba(0,0,0,.5);
        }

        .slot-deck {
            margin-top: 3px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: .05em;
            color: rgba(255,255,255,.75);
        }

        .slot-tier-mark {
            position: absolute;
            top: 8px;
            right: 8px;

            width: 9px;
            height: 9px;
            border-radius: 50%;

            background: var(--tier-a);
            box-shadow: 0 0 0 2px rgba(255,255,255,.4);
        }

        /* ---- missing slot: debossed silhouette ---- */

        .slot.missing {
            background: #0A0A0A;
            border: 1.5px dashed rgba(255,255,255,.14);

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: inset 0 2px 6px rgba(0,0,0,.4);
        }

        .slot.missing .silhouette {
            width: 58%;
            height: 68%;
            border-radius: 4px;

            background: var(--tier-a);
            opacity: .22;
        }

        .slot.shake {
            animation: shake .35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        .empty-note {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: var(--ink-muted);
            font-size: 14px;
        }


        /* ============================================================
           SELECTED SLOT — the card currently standing on the pedestal
           ============================================================ */

        .slot.selected {
            outline: 2px solid var(--brass);
            outline-offset: 2px;
        }

        .showcase.empty .showcase-card {
            cursor: default;
        }

        .showcase-card {
            cursor: pointer;
        }


        /* ============================================================
           CARD OVERLAY — opened from the showcase pedestal
           ============================================================ */

        .card-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;

            background: rgba(5, 4, 3, .78);
            backdrop-filter: blur(4px);

            display: none;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .card-overlay.show {
            display: flex;
        }

        .overlay-panel {
            width: min(360px, 90vw);

            display: flex;
            flex-direction: column;
            align-items: center;

            position: relative;
        }

        .overlay-close {
            position: absolute;
            top: -14px;
            right: -14px;
            z-index: 3;

            width: 34px;
            height: 34px;
            border-radius: 50%;

            border: none;
            background: var(--page-shadow);
            color: var(--ink);

            font-size: 16px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 4px 10px rgba(0,0,0,.5);
        }

        .overlay-close:hover {
            background: var(--page-edge);
        }

        .overlay-card {
            width: 100%;
            aspect-ratio: 5 / 7;

            border-radius: 12px;
            overflow: hidden;
            position: relative;

            border: 3px solid var(--tier-a, var(--brass));
            box-shadow:
                0 0 50px -6px var(--tier-a, var(--brass)),
                0 24px 50px rgba(0,0,0,.6);

            background: #0A0A0A;
        }

        .overlay-face {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;

            padding: 22px;

            background:
                linear-gradient(180deg, transparent 55%, rgba(0,0,0,.7) 100%),
                linear-gradient(180deg, transparent 70%, var(--tier-a, var(--brass)) 220%);
        }

        .overlay-tier {
            align-self: flex-start;
            margin-bottom: auto;

            padding: 4px 10px;
            border-radius: 20px;

            background: rgba(0,0,0,.3);

            font-family: 'Karla', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #fff;
        }

        .overlay-name {
            font-family: 'Fraunces', serif;
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            line-height: 1.1;

            text-shadow: 0 2px 6px rgba(0,0,0,.5);
        }

        .overlay-deck {
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,.8);
        }

        .overlay-actions {
            width: 100%;
            display: flex;
            gap: 10px;

            margin-top: 18px;
        }

        .overlay-btn {
            flex: 1;

            padding: 13px 16px;
            border-radius: 6px;
            border: none;

            font-family: 'Karla', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;

            cursor: pointer;
            transition: filter .15s ease, transform .1s ease;
        }

        .overlay-btn:active {
            transform: scale(.98);
        }

        .overlay-btn.save {
            background: var(--brass);
            color: #141414;
        }

        .overlay-btn.save:hover {
            filter: brightness(1.08);
        }

        .overlay-btn.sell {
            background: transparent;
            border: 2px solid var(--page-edge);
            color: var(--ink);
        }

        .overlay-btn.sell:hover {
            border-color: var(--ink-faint);
        }

        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;

            transform: translateX(-50%) translateY(20px);

            background: var(--page-shadow);
            border: 2px solid var(--page-edge);
            color: var(--ink);

            padding: 12px 20px;
            border-radius: 6px;

            font-family: 'Karla', sans-serif;
            font-size: 13px;

            opacity: 0;
            pointer-events: none;

            transition: all .25s ease;

            z-index: 210;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }


        /* ============================================================
           MOBILE
           ============================================================ */

        @media (max-width: 640px) {
            .booklet {
                padding: 24px 14px 40px;
            }

            .book-heading h2 {
                font-size: 26px;
            }

            .showcase {
                padding: 40px 14px 24px;
            }

            .showcase-card {
                width: 150px;
            }

            .showcase-platform {
                width: 190px;
                height: 48px;
            }

            .showcase-platform .ring-outer {
                width: 190px;
                height: 48px;
            }

            .showcase-platform .ring-inner {
                width: 140px;
                height: 32px;
            }

            .page-surface {
                padding: 16px 12px;
                max-height: 220px;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 12px 8px;
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
         HEADER
         ============================================================ -->

    <header id="hud" class="hud"></header>


    <main class="booklet">

        <div class="book-heading">
            <div>
                <h2 class="display">Collection</h2>
                <div class="book-sub">
                    Pick a card below and it takes the pedestal.
                </div>
            </div>

            <div class="book-count">
                <strong id="ownedCount">0</strong> / <span id="totalCount">0</span> collected
            </div>
        </div>

        <div class="showcase empty" id="showcase">
            <div class="showcase-card" id="showcaseCard">
                <div class="showcase-face"></div>
            </div>

            <div class="showcase-platform">
                <div class="ring ring-outer"></div>
                <div class="ring ring-inner"></div>
            </div>

            <div class="showcase-plaque">
                <div class="showcase-name" id="showcaseName"></div>
                <div class="showcase-tags">
                    <span class="showcase-tier-badge" id="showcaseTier"></span>
                    <span class="showcase-deck" id="showcaseDeck"></span>
                </div>
            </div>

            <div class="showcase-empty-note">
                Nothing on display yet — select a card below.
            </div>

            <button class="showcase-fuse-btn" id="fuseBtn">
                <span class="fuse-icon">&#10022;</span>
                Fuse
            </button>
        </div>

        <div class="grid-heading">
            <div class="grid-label">Your cards</div>
            <div class="filter-strip" id="filterStrip">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="owned">Owned</button>
                <button class="filter-tab" data-filter="missing">Missing</button>
            </div>
        </div>

        <div class="page-surface">
            <div class="grid" id="grid"></div>
        </div>

    </main>


    <!-- ============================================================
         CARD OVERLAY — opened from the showcase pedestal
         ============================================================ -->

    <div class="card-overlay" id="cardOverlay">
        <div class="overlay-panel">
            <button class="overlay-close" id="overlayClose">&times;</button>

            <div class="overlay-card" id="overlayCard">
                <div class="overlay-face" id="overlayFace">
                    <span class="overlay-tier" id="overlayTier"></span>
                    <div class="overlay-name" id="overlayName"></div>
                    <div class="overlay-deck" id="overlayDeck"></div>
                </div>
            </div>

            <div class="overlay-actions">
                <button class="overlay-btn sell" id="overlaySell">Sell</button>
                <button class="overlay-btn save" id="overlaySave">Save</button>
            </div>
        </div>
    </div>


    <!-- ============================================================
         BASIC STATE / HELPERS — same shape as shop.html / leaderboard.html
         ============================================================ -->

    <script>
        function defaultState() {
            return {
                collection: [],
                firstVisit: true
            };
        }

        function loadState() {
            return defaultState();
        }

        function saveState(state) {
            // No local save.
            // State is handled by Supabase/sessionStorage.
        }

        function fmt(n) {
            return Number(n).toLocaleString();
        }

        function uid() {
            return (
                Date.now() +
                "-" +
                Math.random().toString(36).slice(2, 7)
            );
        }

        function toast(message) {
            let element = document.getElementById("toast");

            if (!element) {
                element = document.createElement("div");
                element.id = "toast";
                element.className = "toast";
                document.body.appendChild(element);
            }

            element.textContent = message;
            element.classList.add("show");

            clearTimeout(toast._h);

            toast._h = setTimeout(() => {
                element.classList.remove("show");
            }, 1800);
        }

        let state = loadState();
        window.state = state;
    </script>

            mount.innerHTML = `

    <!-- ============================================================
         LOAD WALLET LEDGER — same include as shop.html / leaderboard.html
         ============================================================ -->

    <script>
        fetch("wallet-ledger.html")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`wallet-ledger.html failed: ${response.status}`);
                }
                return response.text();
            })
            .then(html => {
                const parsed = new DOMParser().parseFromString(html, "text/html");

                const walletDiv = parsed.getElementById("wallet");
                const walletMount = document.getElementById("walletMount");

                if (walletDiv && walletMount) {
                    window.walletNode = walletDiv;
                    walletMount.appendChild(walletDiv);
                }

                const ledgerOverlay = parsed.getElementById("ledgerOverlay");
                if (ledgerOverlay) {
                    document.body.appendChild(ledgerOverlay);
                }

                const signupOverlay = parsed.getElementById("signupOverlay");
                if (signupOverlay) {
                    document.body.appendChild(signupOverlay);
                }

                const parsedStyle = parsed.querySelector("style");
                if (parsedStyle) {
                    let css = parsedStyle.textContent;

                    css = css.replace(/:root\{[^}]*\}/, "");
                    css = css.replace(/\*\{box-sizing:border-box;\}/, "");
                    css = css.replace(/html,body\{margin:0;padding:0;\}/, "");
                    css = css.replace(/body\{[^}]*\}/, "");

                    const styleTag = document.createElement("style");
                    styleTag.textContent = css;
                    document.head.appendChild(styleTag);
                }

                const parsedScript = parsed.querySelector("script");
                if (parsedScript) {
                    const newScript = document.createElement("script");
                    newScript.textContent = parsedScript.textContent;
                    document.body.appendChild(newScript);
                }
            })
            .catch(error => {
                console.error("Failed to load wallet-ledger.html:", error);
            });
    </script>


    <!-- ============================================================
         MOCK COLLECTION DATA + GRID / FILTER / SHOWCASE LOGIC

         Demo only — swap MOCK_CARDS for a Supabase read against
         `decks` (+ a per-user ownership join) when this goes live.
         ============================================================ -->

    <script>
        const TIER_COLORS = {
            common:    ["#8C8880", "#6E6A64"],
            rare:      ["#4FB6A8", "#2F8078"],
            epic:      ["#9B6BD6", "#6B47A0"],
            legendary: ["#E8A23D", "#B8781F"],
            mythic:    ["#FF6B9D", "#C77DFF"]
        };

        const DECKS = [
            "Ashfall Requiem",
            "Glasswing Ledger",
            "Neon Choir",
            "Marrow & Marquee"
        ];

        const TIERS = ["common", "rare", "epic", "legendary", "mythic"];

        function buildMockCards() {
            const names = [
                "Ember Warden", "Hollow Pact", "Tideglass Oracle",
                "Riftbound Choir", "Ashen Vow", "Loam Sentinel",
                "Static Requiem", "Marrow Lantern", "Verdigris Saint",
                "Fracture Hymn", "Gilded Undertow", "Cindercourt Regent",
                "Wraithlight Herald", "Copper Litany", "Duskthread Weaver",
                "Bramble Choirmaster", "Ferrous Nocturne", "Salt Cathedral",
                "Amberfall Sentry", "Thornbound Muse", "Glasswing Prophet",
                "Emberline Cantor", "Nightloom Warden", "Vellum Insurgent"
            ];

            return names.map((name, i) => {
                const tier = TIERS[i % TIERS.length];
                const deck = DECKS[i % DECKS.length];

                return {
                    id: uid(),
                    name,
                    deck,
                    tier,
                    owned: (i % 5 !== 0 && i % 7 !== 0)
                };
            });
        }

        const MOCK_CARDS = buildMockCards();

        let activeFilter = "all";

        function filteredCards() {
            if (activeFilter === "owned") {
                return MOCK_CARDS.filter(c => c.owned);
            }
            if (activeFilter === "missing") {
                return MOCK_CARDS.filter(c => !c.owned);
            }
            return MOCK_CARDS;
        }

        function renderCounts() {
            document.getElementById("ownedCount").textContent =
                fmt(MOCK_CARDS.filter(c => c.owned).length);
            document.getElementById("totalCount").textContent =
                fmt(MOCK_CARDS.length);
        }

        function renderGrid() {
            const grid = document.getElementById("grid");
            const cards = filteredCards();

            if (!cards.length) {
                grid.innerHTML = `
                    <div class="empty-note">
                        No cards in this view yet.
                    </div>
                `;
                return;
            }

            grid.innerHTML = cards.map((card) => {
                const [tierA, tierB] = TIER_COLORS[card.tier];
                const isSelected = card.id === selectedId;

                if (card.owned) {
                    return `
                        <div
                            class="slot owned ${isSelected ? "selected" : ""}"
                            data-id="${card.id}"
                            style="--tier-a:${tierA}; --tier-b:${tierB};"
                        >
                            <div class="slot-face">
                                <div class="slot-name">${card.name}</div>
                                <div class="slot-deck">${card.deck}</div>
                            </div>
                            <div class="slot-tier-mark"></div>
                        </div>
                    `;
                }

                return `
                    <div
                        class="slot missing"
                        data-id="${card.id}"
                        style="--tier-a:${tierA};"
                    >
                        <div class="silhouette"></div>
                    </div>
                `;
            }).join("");

            grid.querySelectorAll(".slot.owned").forEach(el => {
                el.addEventListener("click", () => {
                    const card = MOCK_CARDS.find(c => c.id === el.dataset.id);
                    if (card) {
                        selectCard(card);
                    }
                });
            });

            grid.querySelectorAll(".slot.missing").forEach(el => {
                el.addEventListener("click", () => {
                    el.classList.remove("shake");
                    void el.offsetWidth;
                    el.classList.add("shake");
                });
            });
        }

        let selectedId = null;
        let selectedCard = null;

        function selectCard(card) {
            selectedId = card.id;
            selectedCard = card;

            const [tierA, tierB] = TIER_COLORS[card.tier];

            const showcase = document.getElementById("showcase");
            showcase.style.setProperty("--tier-a", tierA);
            showcase.style.setProperty("--tier-b", tierB);
            showcase.classList.remove("empty");

            document.getElementById("showcaseName").textContent = card.name;
            document.getElementById("showcaseDeck").textContent = card.deck;
            document.getElementById("showcaseTier").textContent = card.tier;

            // re-render so the picked slot gets its selected outline
            renderGrid();
        }

        document.getElementById("filterStrip").addEventListener("click", (e) => {
            const btn = e.target.closest(".filter-tab");
            if (!btn) return;

            document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
            btn.classList.add("active");

            activeFilter = btn.dataset.filter;
            renderGrid();
        });


        /* ==========================================================
           CARD OVERLAY
           ========================================================== */

        function openCardOverlay() {
            if (!selectedCard) {
                return;
            }

            const [tierA, tierB] = TIER_COLORS[selectedCard.tier];

            document.getElementById("overlayCard").style.setProperty("--tier-a", tierA);
            document.getElementById("overlayCard").style.setProperty("--tier-b", tierB);
            document.getElementById("overlayName").textContent = selectedCard.name;
            document.getElementById("overlayDeck").textContent = selectedCard.deck;
            document.getElementById("overlayTier").textContent = selectedCard.tier;

            document.getElementById("cardOverlay").classList.add("show");
        }

        function closeCardOverlay() {
            document.getElementById("cardOverlay").classList.remove("show");
        }

        document.getElementById("showcaseCard").addEventListener("click", openCardOverlay);

        document.getElementById("overlayClose").addEventListener("click", closeCardOverlay);

        document.getElementById("cardOverlay").addEventListener("click", (e) => {
            if (e.target.id === "cardOverlay") {
                closeCardOverlay();
            }
        });

        document.getElementById("overlaySave").addEventListener("click", () => {
            if (!selectedCard) return;
            toast(`${selectedCard.name} saved to collection.`);
            closeCardOverlay();
        });

        document.getElementById("overlaySell").addEventListener("click", () => {
            if (!selectedCard) return;
            toast(`${selectedCard.name} sold.`);
            closeCardOverlay();
        });

        document.getElementById("fuseBtn").addEventListener("click", (e) => {
            e.stopPropagation();
            if (!selectedCard) return;
            toast(`Fuse ${selectedCard.name} — coming soon.`);
        });

        renderCounts();
        renderGrid();

        const firstOwned = MOCK_CARDS.find(c => c.owned);
        if (firstOwned) {
            selectCard(firstOwned);
        }
    </script>

</body>
