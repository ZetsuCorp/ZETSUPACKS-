<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZETSU PACKZ — Collection</title>
<style>
@property --k {
  syntax: '<number>';
  initial-value: -1;
  inherits: true;
}
@property --ang {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

:root{
  --bg:#140F1F;
  --panel:#1D1730;
  --panel-2:#251D3B;
  --line:#352A50;
  --ink:#EDE6DC;
  --muted:#9C93AE;
  --brass:#D4AF6A;
  --brass-dim:#8A7245;
  --common:#8A8698;
  --rare:#4FB6A8;
  --epic:#9B6BD6;
  --legendary:#E8A23D;
  --mythic-a:#FF6B9D;
  --mythic-b:#C77DFF;
  --mythic-c:#4FD1E5;
  --danger:#E8636B;
}
*{box-sizing:border-box;margin:0;}
html,body{padding:0;height:100%;}
body{
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%, #241C3C 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none;}
.mono{font-family:"SF Mono",ui-monospace,"Cascadia Code",Consolas,monospace;}

/* ---------- HUD ---------- */
.hud{
  position:relative;z-index:50;flex:none;
  background:rgba(20,15,31,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  padding:14px 20px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
}
.hud .brand{display:flex;align-items:baseline;gap:8px;}
.hud .brand .mark{font-size:10px;letter-spacing:.28em;color:var(--brass);text-transform:uppercase;font-weight:700;}
.hud .brand h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;}
.hud nav{display:flex;gap:4px;}
.hud .navlink{
  padding:8px 14px;border-radius:3px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:var(--muted);border:1px solid transparent;
}
.hud .navlink:hover{color:var(--ink);}
.hud .navlink.current{background:var(--brass);color:#1A1425;}
.hud .balance{text-align:right;}
.hud .balance .label{font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;}
.hud .balance .amt{font-size:20px;font-weight:700;color:var(--brass);}

/* ---------- Buttons ---------- */
.btn{
  border:none;border-radius:3px;padding:12px 20px;font-size:13px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:filter .15s ease, transform .1s ease;
}
.btn:active{transform:scale(.98);}
.btn-brass{background:var(--brass);color:#1A1425;}
.btn-brass:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--brass-dim);}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;margin:40px auto;max-width:420px;}
.empty-state .glyph{font-size:32px;margin-bottom:10px;}

.rar-common{background:linear-gradient(160deg,#2A2836,#1D1B27);}
.rar-rare{background:linear-gradient(160deg,#173330,#12201F);}
.rar-epic{background:linear-gradient(160deg,#2B1F42,#1D1530);}
.rar-legendary{background:linear-gradient(160deg,#3A2A12,#241A0C);}
.rar-mythic{background:linear-gradient(160deg,#241830,#1A1424);}

/* ---------- Toolbar ---------- */
.toolbar{
  flex:none;display:flex;justify-content:space-between;align-items:center;
  padding:12px 20px;flex-wrap:wrap;gap:10px;
  border-bottom:1px solid var(--line);
}
.toolbar .count{font-size:12px;color:var(--muted);letter-spacing:.05em;}
.toolbar .hint{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;}

/* ---------- Circular scroll gallery ---------- */
.gallery-scroll{
  flex:1 1 auto;
  min-height:0;
  overflow-y:scroll;
  scrollbar-width:none;
  position:relative;
  container-type:size;
  container-name:gallery;
}
.gallery-scroll::-webkit-scrollbar{display:none;}
.gallery-track{
  height:calc(var(--n, 1)*100%);
  min-height:100%;
}
.scene{
  position:sticky;top:0;
  height:100cqh;
  overflow:hidden;
  perspective:50em;
  display:grid;
  place-items:center;
  animation:k 1s linear;
  animation-timeline:scroll();
}
@keyframes k{ to{ --k:1; } }

.assembly{
  --dir:0;
  --r:calc(2 + var(--dir))/3;
  --w:clamp(4em, min(46cqh, 26cqw), 15em);
  --z:calc(-.5*var(--w)/tan(.5turn/var(--n, 1)));
  display:grid;
  transform-style:preserve-3d;
  place-self:center;
  translate:0 0 var(--z);
  rotate:var(--dir) calc(1 - var(--dir)) 0 calc((var(--k) + .5)*-1turn);
}
@media (max-aspect-ratio: 2/3){ .assembly{ --dir:1; } }

.card-node{
  grid-area:1/1;
  --j:calc(var(--i, 0)/var(--n, 1));
  --dif-lin:calc(var(--j) - mod(var(--k) + 1, 1));
  --abs-lin:abs(var(--dif-lin));
  --dif-mid:calc(.5 - var(--abs-lin));
  --abs-mid:abs(var(--dif-mid));
  --dif-arc:calc(2*(.5 - var(--abs-mid)));
  --lim:.35;
  --sel:max(0, calc((var(--lim) - var(--dif-arc))/var(--lim)));
  --out:calc(1 - var(--sel));
  width:var(--w);
  aspect-ratio:var(--r);
  transform:
    rotate3d(var(--dir), calc(1 - var(--dir)), 0, calc(var(--j)*1turn))
    translatez(var(--z));
  transform-style:preserve-3d;
  cursor:pointer;
}

.card-face{
  --ang:calc(-45deg + 0deg);
  grid-area:1/1;
  width:100%;height:100%;
  overflow:hidden;
  position:relative;
  border-radius:.6em;
  border:solid 2px #0000;
  box-shadow:5px 5px 18px rgba(0,0,0,.55);
  background:
    linear-gradient(#0000 0 0) padding-box,
    repeating-conic-gradient(from var(--ang),
      #0000 0% 15%,
      color-mix(in srgb, var(--brass) calc(var(--sel)*100%), #333) 20% 30%,
      #0000 35% 50%)
    border-box;
  display:grid;grid-template-rows:1fr auto;
  padding:16px;gap:8px;
  transition:.35s ease-out;
  isolation:isolate;
}
.card-face::before{
  content:"";position:absolute;inset:0;z-index:-1;
}
.card-face.rar-common::before{background:linear-gradient(160deg,#2A2836,#1D1B27);}
.card-face.rar-rare::before{background:linear-gradient(160deg,#173330,#12201F);}
.card-face.rar-epic::before{background:linear-gradient(160deg,#2B1F42,#1D1530);}
.card-face.rar-legendary::before{background:linear-gradient(160deg,#3A2A12,#241A0C);}
.card-face.rar-mythic::before{background:linear-gradient(160deg,#241830,#1A1424);}
.card-face::after{
  content:"";position:absolute;inset:0;
  opacity:var(--out);
  background:#03071e;mix-blend-mode:color;
  pointer-events:none;
}

.c-glyph{
  align-self:center;justify-self:center;font-size:3em;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.4));
}
.c-info{opacity:round(up, var(--sel));text-shadow:1px 1px 1px #0006;}
.c-tier{font-size:.6em;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--brass);}
.c-name{font-size:.85em;font-weight:900;text-transform:uppercase;line-height:1.1;}
.c-foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
.c-value{font-size:.7em;opacity:.85;}
.c-sell{
  background:transparent;border:1px solid var(--brass);color:var(--brass);
  padding:3px 8px;border-radius:3px;cursor:pointer;font-size:.6em;
  letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  pointer-events:auto;
}
.c-sell:hover{background:var(--brass);color:#1A1425;}

.gallery-hint{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  pointer-events:none;
}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel-2);border:1px solid var(--brass-dim);color:var(--ink);
  padding:12px 20px;border-radius:6px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:100;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (prefers-reduced-motion: reduce){
  .scene{animation:none;}
}
@supports not (animation-timeline: scroll()){
  .fallback-warning{display:block !important;}
}
.fallback-warning{
  flex:none;
  display:none;margin:16px 20px;padding:12px 16px;border-left:3px solid var(--brass-dim);
  background:var(--panel-2);font-size:12px;color:var(--muted);border-radius:3px;
}
</style>
</head>
<body>
<div id="hud" class="hud"></div>

<div class="toolbar">
  <div class="count" id="collSummary"></div>
  <div class="hint">Scroll, or use ↑ / ↓, to rotate the collection</div>
</div>

<div class="fallback-warning">Your browser doesn't support CSS scroll-driven animation yet, so this rotating view may not animate smoothly. Try a recent Chrome or Firefox (with the scroll-driven-animation flag) build.</div>

<div id="galleryWrap" style="flex:1 1 auto;display:flex;flex-direction:column;min-height:0;">
  <!-- filled by JS: either the gallery, or an empty state -->
</div>

<script>
/* ==========================================================
   VAULT — shared data, state, and helpers
   ========================================================== */

const RARITIES = [
  { id:"common",    label:"Common",    glyphs:["●","▪","○"], valueRange:[8,20]    },
  { id:"rare",      label:"Rare",      glyphs:["◆","✦","◈"], valueRange:[25,60]   },
  { id:"epic",      label:"Epic",      glyphs:["✷","❖","✸"], valueRange:[70,160]  },
  { id:"legendary", label:"Legendary", glyphs:["★","☆","✹"], valueRange:[200,450] },
  { id:"mythic",    label:"Mythic",    glyphs:["◉","✺","❉"], valueRange:[600,1500]}
];
const RARITY_ORDER = ["mythic","legendary","epic","rare","common"];

const NAME_PARTS = {
  prefix:["Iron","Void","Solar","Ashen","Crimson","Gilded","Hollow","Storm","Obsidian","Wraith","Ember","Frost","Rogue","Sable","Verdant"],
  noun:["Warden","Cipher","Relic","Sentinel","Oracle","Marauder","Construct","Effigy","Harbinger","Specter","Engine","Totem","Wyrm","Vanguard","Idol"]
};

function makeCardPool(){
  const pool = [];
  RARITIES.forEach(r=>{
    NAME_PARTS.prefix.forEach((p,i)=>{
      const step = r.id==="mythic"?5: r.id==="legendary"?3: r.id==="epic"?2:1;
      if (i % step === 0){
        const n = NAME_PARTS.noun[(i+RARITIES.indexOf(r)) % NAME_PARTS.noun.length];
        pool.push({ id:r.id+"-"+p+"-"+n, name:p+" "+n, rarity:r.id, glyph:r.glyphs[i % r.glyphs.length] });
      }
    });
  });
  return pool;
}
const CARD_POOL = makeCardPool();

const PACKS = [
  { id:"standard", name:"Standard Pack", tier:"Entry",      price:50,  ceiling:60,   odds:{common:70,rare:23,epic:6,legendary:0.9,mythic:0.1} },
  { id:"premium",  name:"Premium Pack",  tier:"Mid-Tier",   price:150, ceiling:450,  odds:{common:45,rare:35,epic:16,legendary:3.5,mythic:0.5} },
  { id:"elite",    name:"Elite Pack",    tier:"High Roller",price:400, ceiling:1500, odds:{common:20,rare:35,epic:32,legendary:11,mythic:2} }
];

const STORAGE_KEY = "vault_state_v1";

function defaultState(){
  return { balance: 1000, collection: [], unopened: [], firstVisit: true };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  } catch(e){ return defaultState(); }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}
function fmt(n){ return n.toLocaleString(); }
function rarityMeta(id){ return RARITIES.find(r=>r.id===id); }

function toast(msg){
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), 1800);
}

function renderHud(state, currentPage){
  const mount = document.getElementById("hud");
  if (!mount) return;
  const pages = [
    {id:"start", href:"start.html", label:"Start"},
    {id:"shop", href:"shop.html", label:"Pack Shop"},
    {id:"rip", href:"index.html", label:"Rip Pack"},
    {id:"collection", href:"collection.html", label:"Collection"}
  ];
  mount.innerHTML = `
    <a class="brand" href="start.html">
      <span class="mark">Zetsumetsu</span>
      <h1>ZETSU PACKZ</h1>
    </a>
    <nav>
      ${pages.map(p=>`<a class="navlink ${p.id===currentPage?'current':''}" href="${p.href}">${p.label}</a>`).join("")}
    </nav>
    <div class="balance">
      <div class="label">Chips</div>
      <div class="amt mono">${fmt(state.balance)}</div>
    </div>
  `;
}

/* ==========================================================
   Collection page — circular scroll gallery
   ========================================================== */

let state = loadState();
renderHud(state, "collection");

const wrap = document.getElementById("galleryWrap");
const summary = document.getElementById("collSummary");

function buildGallery(){
  if (!state.collection.length){
    wrap.innerHTML = `<div class="empty-state">
      <div class="glyph">◇</div>
      Nothing kept yet — rip a pack and choose "Keep card".
      <div style="margin-top:16px;"><a class="btn btn-brass" href="shop.html">Go to Pack Shop</a></div>
    </div>`;
    summary.textContent = "0 cards collected";
    return;
  }

  const sorted = [...state.collection].sort(
    (a,b)=>RARITY_ORDER.indexOf(a.rarity)-RARITY_ORDER.indexOf(b.rarity)
  );
  const n = sorted.length;
  const totalValue = state.collection.reduce((s,c)=>s+c.value,0);
  summary.textContent = n + " card" + (n===1?"":"s") + " collected · worth " + fmt(totalValue) + " chips";

  wrap.innerHTML = `
    <div class="gallery-scroll" id="galleryScroll" style="--n:${n};">
      <div class="gallery-track" style="--n:${n};">
        <div class="scene">
          <div class="assembly" style="--n:${n};">
            ${sorted.map((card,i)=>`
              <div class="card-node" style="--i:${i};--n:${n};" data-uid="${card.uid}">
                <div class="card-face rar-${card.rarity}">
                  <div class="c-glyph">${card.glyph}</div>
                  <div class="c-info">
                    <div class="c-tier">${rarityMeta(card.rarity).label}</div>
                    <div class="c-name">${card.name}</div>
                    <div class="c-foot">
                      <span class="c-value mono">${fmt(card.value)}</span>
                      <button class="c-sell" data-sell="${card.uid}">Sell</button>
                    </div>
                  </div>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      </div>
      <div class="gallery-hint">↑ / ↓ to browse</div>
    </div>
  `;

  const galleryScroll = document.getElementById("galleryScroll");
  const scene = wrap.querySelector(".scene");

  // infinite-loop snap-back, adapted from the scroll-driven-animation source
  function snapIfNeeded(k){
    if (Math.abs(k) > .5){
      galleryScroll.scrollTo(
        0,
        .5*(k - Math.sign(k) + 1)*(galleryScroll.scrollHeight - galleryScroll.clientHeight)
      );
    }
  }
  snapIfNeeded(-1);
  galleryScroll.addEventListener("scroll", ()=>{
    const k = parseFloat(getComputedStyle(scene).getPropertyValue("--k")) || 0;
    snapIfNeeded(k);
  });

  // keyboard support
  galleryScroll.tabIndex = 0;
  galleryScroll.addEventListener("keydown", (e)=>{
    const step = galleryScroll.clientHeight / n;
    if (e.key === "ArrowDown"){ galleryScroll.scrollBy({top:step, behavior:"smooth"}); e.preventDefault(); }
    if (e.key === "ArrowUp"){ galleryScroll.scrollBy({top:-step, behavior:"smooth"}); e.preventDefault(); }
  });

  wrap.querySelectorAll("[data-sell]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      sellCard(btn.dataset.sell);
    });
  });
}

function sellCard(cardUid){
  const idx = state.collection.findIndex(c=>c.uid===cardUid);
  if (idx === -1) return;
  const card = state.collection[idx];
  if (!confirm("Sell " + card.name + " for " + fmt(card.value) + " chips? This can't be undone.")) return;
  state.collection.splice(idx,1);
  state.balance += card.value;
  saveState(state);
  renderHud(state, "collection");
  toast("Sold " + card.name + " for " + fmt(card.value) + " chips.");
  buildGallery();
}

buildGallery();
</script>
</body>
</html>
