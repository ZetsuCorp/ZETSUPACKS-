<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZETSU PACKZ — Collection</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --page: #0A0A0A;
            --page-shadow: #141414;
            --page-edge: #333333;
            --binding: #3B2A1E;
            --binding-2: #2A1D14;
            --ink: #EDE6DC;
            --ink-muted: #9A958E;
            --ink-faint: #6E6A64;

            --common: #8C8880;
            --rare: #4FB6A8;
            --epic: #9B6BD6;
            --legendary: #E8A23D;
            --mythic-a: #FF6B9D;
            --mythic-b: #C77DFF;

            --panel-2: #1C1C1C;
            --line: #333333;
            --hud-ink: #EDE6DC;
            --brass: #D4AF6A;
            --brass-dim: #8A7245;

            /* Merged in from shop.html so wallet-ledger.html's
               overlay/backdrop/close-X CSS (which references these
               names) resolves identically on this page. */
            --bg: #0A0A0A;
            --panel: #141414;
            --muted: #9A958E;
            --mythic-c: #4FD1E5;
            --danger: #E8636B;
        }

        * { box-sizing: border-box; }

        html, body { margin: 0; padding: 0; }

        body {
            background: var(--page);
            color: var(--ink);
            font-family: 'Karla', sans-serif;
            min-height: 100vh;
        }

        @media (min-width: 768px) {
            body { zoom: 0.60; }
        }

        a { color: inherit; text-decoration: none; }

        .display { font-family: 'Fraunces', serif; }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }

        .hud {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(0, 0, 0, .92);
            backdrop-filter: blur(6px);
            border-bottom: 3px solid var(--line);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .hud .brand { display: flex; flex-direction: column; align-items: flex-start; gap: 0; }

        .hud .brand .mark {
            font-size: 10px;
            letter-spacing: .28em;
            color: var(--brass);
            text-transform: uppercase;
            font-weight: 700;
            font-family: 'Karla', sans-serif;
        }

        .hud .brand h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: .02em;
            text-transform: uppercase;
            color: var(--hud-ink);
            font-family: 'Karla', sans-serif;
        }

        .hud nav { display: flex; gap: 4px; }

        .hud .navlink {
            padding: 8px 14px;
            border-radius: 3px;
            font-size: 11px;
            letter-spacing: .12em;
            text-transform: uppercase;
            font-weight: 700;
            color: #9A958E;
            border: 3px solid transparent;
            font-family: 'Karla', sans-serif;
        }

        .hud .navlink:hover { color: var(--hud-ink); }

        .hud .navlink.current { background: var(--brass); color: #141414; }

        .hud .hud-stats { display: flex; align-items: center; gap: 18px; }

        .booklet { max-width: 1280px; margin: 0 auto; padding: 40px 28px 50px; }

        .book-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--page-edge);
        }

        .book-heading h2 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -0.01em; line-height: 1; }

        .book-heading .book-sub { margin-top: 6px; color: var(--ink-muted); font-size: 13px; max-width: 46ch; line-height: 1.5; }

        .book-count { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: var(--ink-muted); white-space: nowrap; }

        .book-count strong { color: var(--ink); }

        .filter-strip { display: flex; gap: 8px; }

        .filter-tab {
            padding: 9px 18px;
            border: 2px solid var(--page-edge);
            background: transparent;
            color: var(--ink-muted);
            font-family: 'Karla', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s ease, color .15s ease, border-color .15s ease;
        }

        .filter-tab:first-child { border-radius: 4px 0 0 4px; }
        .filter-tab:last-child { border-radius: 0 4px 4px 0; }
        .filter-tab + .filter-tab { border-left: none; }
        .filter-tab.active { background: var(--brass); border-color: var(--brass); color: #141414; }
        .filter-tab:not(.active):hover { color: var(--ink); border-color: var(--ink-faint); }

        .grid-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

        .grid-heading .grid-label { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; color: var(--ink); }

        .page-surface {
            background: var(--page-shadow);
            border: 1px solid var(--page-edge);
            border-radius: 6px;
            padding: 22px 22px;
            max-height: 260px;
            overflow-y: auto;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
        }

        .page-surface::-webkit-scrollbar { width: 8px; }
        .page-surface::-webkit-scrollbar-thumb { background: var(--page-edge); border-radius: 4px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 16px 12px; }

        .slot { position: relative; aspect-ratio: 5 / 7; border-radius: 6px; overflow: hidden; cursor: default; }

        .slot.owned {
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(42,32,24,.25), 0 8px 18px rgba(42,32,24,.18);
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .slot.owned:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(42,32,24,.3), 0 14px 26px rgba(42,32,24,.24); }
        .slot.owned:active { transform: translateY(-1px) scale(.98); }
        .slot.owned { background: #0A0A0A; border: 2px solid var(--tier-a); }

        .slot-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slot-face {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
            background:
                linear-gradient(180deg, transparent 55%, rgba(0,0,0,.7) 100%),
                linear-gradient(180deg, transparent 70%, var(--tier-a) 220%);
        }

        .slot-name { font-family: 'Fraunces', serif; font-size: 13px; font-weight: 600; color: #fff; line-height: 1.15; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
        .slot-deck { margin-top: 3px; font-size: 9px; font-weight: 600; letter-spacing: .05em; color: rgba(255,255,255,.75); }

        .slot-tier-mark {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--tier-a);
            box-shadow: 0 0 0 2px rgba(255,255,255,.4);
        }

        .slot.missing {
            background: #0A0A0A;
            border: 1.5px dashed rgba(255,255,255,.14);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 6px rgba(0,0,0,.4);
        }

        .slot.missing .silhouette { width: 58%; height: 68%; border-radius: 4px; background: var(--tier-a); opacity: .22; }

        .slot.shake { animation: shake .35s ease; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        .empty-note { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--ink-muted); font-size: 14px; }

        .slot.selected { outline: 2px solid var(--brass); outline-offset: 2px; }

        .site-footer {
            border-top: 3px solid var(--line);
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--page-shadow);
            border: 2px solid var(--page-edge);
            color: var(--ink);
            padding: 12px 20px;
            border-radius: 6px;
            font-family: 'Karla', sans-serif;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: all .25s ease;
            z-index: 210;
        }

        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 640px) {
            .booklet { padding: 24px 14px 40px; }
            .book-heading h2 { font-size: 26px; }
            .page-surface { padding: 16px 12px; max-height: 220px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px 8px; }
        }
    </style>
</head>

<body>

    <header id="hud" class="hud"></header>

    <main class="booklet">

        <div class="book-heading">
            <div>
                <h2 class="display">Collection</h2>
                <div class="book-sub">Pick a card below and it takes the pedestal.</div>
            </div>

            <div class="book-count">
                <strong id="ownedCount">0</strong> / <span id="totalCount">0</span> collected
            </div>
        </div>

        <div id="showcaseMount"></div>

        <div class="grid-heading">
            <div class="grid-label">Your cards</div>
            <div class="filter-strip" id="filterStrip">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="owned">Owned</button>
                <button class="filter-tab" data-filter="missing">Missing</button>
            </div>
        </div>

        <div class="page-surface">
            <div class="grid" id="grid"></div>
        </div>

    </main>

    <footer class="site-footer">
        <span>Zetsumetsu Corporation</span>
        <span>Collection</span>
    </footer>

    <script>
        function defaultState() {
            return { collection: [], firstVisit: true };
        }

        function loadState() { return defaultState(); }
        function saveState(state) {}

        function fmt(n) { return Number(n).toLocaleString(); }

        function uid() {
            return Date.now() + "-" + Math.random().toString(36).slice(2, 7);
        }

        function toast(message) {
            let element = document.getElementById("toast");
            if (!element) {
                element = document.createElement("div");
                element.id = "toast";
                element.className = "toast";
                document.body.appendChild(element);
            }
            element.textContent = message;
            element.classList.add("show");
            clearTimeout(toast._h);
            toast._h = setTimeout(() => { element.classList.remove("show"); }, 1800);
        }

        let state = loadState();
        window.state = state;
    </script>

    <script>
        function renderHud(state, currentPage) {
            const mount = document.getElementById("hud");
            if (!mount) return;

            const pages = [
                { id: "leaderboard", href: "leaderboard.html", label: "Leaderboard" },
                { id: "start", href: "start.html", label: "Start" },
                { id: "shop", href: "shop.html", label: "Pack Shop" },
                { id: "collection", href: "collection.html", label: "Collection" }
            ];

            mount.innerHTML = `
                <a class="brand" href="start.html">
                    <span class="mark">Zetsumetsu EOe</span>
                    <h1>ZETSU PACKZ</h1>
                </a>

                <nav>
                    ${pages.map(page => `
                        <a class="navlink ${page.id === currentPage ? "current" : ""}" href="${page.href}">
                            ${page.label}
                        </a>
                    `).join("")}
                </nav>

                <div class="hud-stats">
                    <div id="walletMount"></div>
                </div>
            `;

            if (window.walletNode) {
                const walletMount = document.getElementById("walletMount");
                if (walletMount) walletMount.appendChild(window.walletNode);
                if (typeof renderWallet === "function") renderWallet(state);
            }
        }

        renderHud(state, "collection");
    </script>

    <script>
        fetch("wallet-ledger.html")
            .then(response => {
                if (!response.ok) throw new Error(`wallet-ledger.html failed: ${response.status}`);
                return response.text();
            })
            .then(html => {
                const parsed = new DOMParser().parseFromString(html, "text/html");

                const walletDiv = parsed.getElementById("wallet");
                const walletMount = document.getElementById("walletMount");

                if (walletDiv && walletMount) {
                    window.walletNode = walletDiv;
                    walletMount.appendChild(walletDiv);
                }

                const ledgerOverlay = parsed.getElementById("ledgerOverlay");
                if (ledgerOverlay) document.body.appendChild(ledgerOverlay);

                const signupOverlay = parsed.getElementById("signupOverlay");
                if (signupOverlay) document.body.appendChild(signupOverlay);

                const parsedStyle = parsed.querySelector("style");
                if (parsedStyle) {
                    let css = parsedStyle.textContent;
                    css = css.replace(/:root\{[^}]*\}/, "");
                    css = css.replace(/\*\{box-sizing:border-box;\}/, "");
                    css = css.replace(/html,body\{margin:0;padding:0;\}/, "");
                    css = css.replace(/body\{[^}]*\}/, "");
                    const styleTag = document.createElement("style");
                    styleTag.textContent = css;
                    document.head.appendChild(styleTag);
                }

                const parsedScript = parsed.querySelector("script");
                if (parsedScript) {
                    const newScript = document.createElement("script");
                    newScript.textContent = parsedScript.textContent;
                    document.body.appendChild(newScript);
                }
            })
            .catch(error => {
                console.error("Failed to load wallet-ledger.html:", error);
            });
    </script>

    <script>
        fetch("showcase.html")
            .then(response => {
                if (!response.ok) throw new Error(`showcase.html failed: ${response.status}`);
                return response.text();
            })
            .then(html => {
                const parsed = new DOMParser().parseFromString(html, "text/html");

                const showcaseMount = document.getElementById("showcaseMount");
                const showcaseDiv = parsed.getElementById("showcase");
                const overlayDiv = parsed.getElementById("cardOverlay");

                if (showcaseDiv && showcaseMount) showcaseMount.appendChild(showcaseDiv);
                if (overlayDiv) document.body.appendChild(overlayDiv);

                const parsedStyle = parsed.querySelector("style");
                if (parsedStyle) {
                    const styleTag = document.createElement("style");
                    styleTag.textContent = parsedStyle.textContent;
                    document.head.appendChild(styleTag);
                }

                const parsedScript = parsed.querySelector("script");
                if (parsedScript) {
                    const newScript = document.createElement("script");
                    newScript.textContent = parsedScript.textContent;
                    document.body.appendChild(newScript);
                }

                if (typeof window.onShowcaseReady === "function") {
                    window.onShowcaseReady();
                }
            })
            .catch(error => {
                console.error("Failed to load showcase.html:", error);
            });
    </script>

    <!-- ============================================================
         REAL COLLECTION DATA — wallet_ledger (player id)
         -> player_inventory (one real column per card: card_1..card_555)
         -> decks (display info), matched by column name
         ============================================================ -->

    <script>
        let CARDS = [];

        let activeFilter = "all";
        let currentSelectedId = null;

        // player_inventory: one row per player, one column per card
        // (card_1, card_2, ... card_555). Each column is a fixed
        // 7-character code, always populated, never null:
        //   position 1: Y/N   owned
        //   positions 2-4: 3-digit quantity, zero-padded (e.g. "001")
        //   position 5: Y/N   active
        //   position 6: Y/N   equipped
        //   position 7: Y/N   fused
        // Example: "Y001YYY" = owned, qty 001, active, equipped, fused.
        // Default/unowned value: "N000NNN".

        function decodeCardCode(code) {
            const safe = code || "N000NNN";

            return {
                owned: safe[0] === "Y",
                quantity: parseInt(safe.slice(1, 4), 10) || 0,
                active: safe[4] === "Y",
                equipped: safe[5] === "Y",
                fused: safe[6] === "Y"
            };
        }

        function encodeCardCode({ owned, quantity, active, equipped, fused }) {
            const ownedChar = owned ? "Y" : "N";
            const qtyStr = String(Math.max(0, quantity || 0)).padStart(3, "0").slice(-3);
            const activeChar = active ? "Y" : "N";
            const equippedChar = equipped ? "Y" : "N";
            const fusedChar = fused ? "Y" : "N";

            return ownedChar + qtyStr + activeChar + equippedChar + fusedChar;
        }

        async function loadCollectionCards() {
            const client = walletClient();
            const playerId = window.walletRow.id;

            const { data: invRow, error: invErr } = await client
                .from("player_inventory")
                .select("*")
                .eq("player_id", playerId)
                .maybeSingle();

            if (invErr) {
                console.error("Failed to load player_inventory:", invErr);
            }

            const { data: deckRows, error: deckErr } = await client
                .from("decks")
                .select("*")
                .order("card_number", { ascending: true });

            if (deckErr) {
                console.error("Failed to load decks:", deckErr);
                return [];
            }

            return (deckRows || []).map((deck) => {
                const cardNumber = deck.card_number;
                const columnName = "card_" + cardNumber;
                const code = invRow ? invRow[columnName] : null;
                const decoded = decodeCardCode(code);

                return {
                    id: cardNumber,
                    card_number: cardNumber,
                    name: deck.card,
                    deck: deck.deck,
                    image: deck.image,
                    tier: (deck.current_tier || "common").toLowerCase(),
                    owned: decoded.owned,
                    quantity: decoded.quantity,
                    active: decoded.active,
                    equipped: decoded.equipped,
                    fused: decoded.fused
                };
            });
        }

        // WRITE side — updates one card's column for this player.
        // Pass only the fields changing; anything omitted keeps its
        // current value. Reads the current code first so a partial
        // update (e.g. just toggling "equipped") doesn't clobber
        // owned/quantity/active/fused.
        async function updateCardEntry(playerId, cardNumber, updates) {
            const client = walletClient();
            const columnName = "card_" + cardNumber;

            const { data: invRow, error: invErr } = await client
                .from("player_inventory")
                .select(columnName)
                .eq("player_id", playerId)
                .maybeSingle();

            if (invErr) {
                console.error("Failed to read " + columnName + ":", invErr);
                throw invErr;
            }

            const existing = decodeCardCode(invRow ? invRow[columnName] : null);

            const merged = encodeCardCode({
                owned: updates.owned !== undefined ? updates.owned : existing.owned,
                quantity: updates.quantity !== undefined ? updates.quantity : existing.quantity,
                active: updates.active !== undefined ? updates.active : existing.active,
                equipped: updates.equipped !== undefined ? updates.equipped : existing.equipped,
                fused: updates.fused !== undefined ? updates.fused : existing.fused
            });

            const { data, error } = await client
                .from("player_inventory")
                .update({ [columnName]: merged })
                .eq("player_id", playerId)
                .select()
                .single();

            if (error) {
                console.error("Failed to write " + columnName + ":", error);
                throw error;
            }

            return data;
        }

        function filteredCards() {
            if (activeFilter === "owned") return CARDS.filter(c => c.owned);
            if (activeFilter === "missing") return CARDS.filter(c => !c.owned);
            return CARDS;
        }

        function renderCounts() {
            document.getElementById("ownedCount").textContent = fmt(CARDS.filter(c => c.owned).length);
            document.getElementById("totalCount").textContent = fmt(CARDS.length);
        }

        function renderGrid() {
            const grid = document.getElementById("grid");
            const cards = filteredCards();
            const tierColors = window.TIER_COLORS || {};

            if (!cards.length) {
                grid.innerHTML = `<div class="empty-note">No cards in this view yet.</div>`;
                return;
            }

            grid.innerHTML = cards.map((card) => {
                const [tierA, tierB] = tierColors[card.tier] || ["#8C8880", "#6E6A64"];
                const isSelected = card.id === currentSelectedId;

                if (card.owned) {
                    return `
                        <div class="slot owned ${isSelected ? "selected" : ""}" data-id="${card.id}" style="--tier-a:${tierA}; --tier-b:${tierB};">
                            ${card.image ? `<img class="slot-img" src="${card.image}" alt="${card.name}">` : ""}
                            <div class="slot-face">
                                <div class="slot-name">${card.name}</div>
                                <div class="slot-deck">${card.deck}</div>
                            </div>
                            <div class="slot-tier-mark"></div>
                        </div>
                    `;
                }

                return `
                    <div class="slot missing" data-id="${card.id}" style="--tier-a:${tierA};">
                        <div class="silhouette"></div>
                    </div>
                `;
            }).join("");

            grid.querySelectorAll(".slot.owned").forEach(el => {
                el.addEventListener("click", () => {
                    const card = CARDS.find(c => c.id === el.dataset.id);
                    if (card && typeof window.selectCard === "function") {
                        currentSelectedId = card.id;
                        window.selectCard(card);
                        renderGrid();
                    }
                });
            });

            grid.querySelectorAll(".slot.missing").forEach(el => {
                el.addEventListener("click", () => {
                    el.classList.remove("shake");
                    void el.offsetWidth;
                    el.classList.add("shake");
                });
            });
        }

        document.getElementById("filterStrip").addEventListener("click", (e) => {
            const btn = e.target.closest(".filter-tab");
            if (!btn) return;

            document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
            btn.classList.add("active");

            activeFilter = btn.dataset.filter;
            renderGrid();
        });

        window.onShowcaseReady = function () {
            if (!CARDS.length) return;
            const firstOwned = CARDS.find(c => c.owned);
            if (firstOwned) {
                currentSelectedId = firstOwned.id;
                window.selectCard(firstOwned);
                renderGrid();
            }
        };

        function waitForWallet(timeoutMs) {
            return new Promise((resolve) => {
                if (window.walletRow && window.walletRow.id) {
                    resolve(true);
                    return;
                }

                const start = Date.now();
                const interval = setInterval(() => {
                    if (window.walletRow && window.walletRow.id) {
                        clearInterval(interval);
                        resolve(true);
                    } else if (Date.now() - start > timeoutMs) {
                        clearInterval(interval);
                        resolve(false);
                    }
                }, 100);
            });
        }

        async function initCollection() {
            const walletReady = await waitForWallet(8000);

            if (!walletReady) {
                console.error("Wallet never loaded — not checking collection.");
                return;
            }

            CARDS = await loadCollectionCards();
            renderCounts();
            renderGrid();

            if (typeof window.selectCard === "function") {
                const firstOwned = CARDS.find(c => c.owned);
                if (firstOwned) {
                    currentSelectedId = firstOwned.id;
                    window.selectCard(firstOwned);
                    renderGrid();
                }
            }
        }

        initCollection();
