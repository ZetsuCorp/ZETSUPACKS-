<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZETSU PACKZ — Pack Shop</title>
<style>
/* ============================================================
   TOKENS — shared design variables, base reset
   ============================================================ */
:root{
  --bg:#140F1F;
  --panel:#1D1730;
  --panel-2:#251D3B;
  --line:#352A50;
  --ink:#EDE6DC;
  --muted:#9C93AE;
  --brass:#D4AF6A;
  --brass-dim:#8A7245;
  --common:#8A8698;
  --rare:#4FB6A8;
  --epic:#9B6BD6;
  --legendary:#E8A23D;
  --mythic-a:#FF6B9D;
  --mythic-b:#C77DFF;
  --mythic-c:#4FD1E5;
  --danger:#E8636B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%, #241C3C 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
}
a{color:inherit;text-decoration:none;}
.mono{font-family:"SF Mono",ui-monospace,"Cascadia Code",Consolas,monospace;}

/* ============================================================
   SECTION: HEADER — top brand / nav / packs counter / balance
   ============================================================ */
.hud{
  position:sticky;top:0;z-index:50;
  background:rgba(20,15,31,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  padding:14px 20px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
}
.hud .brand{display:flex;align-items:baseline;gap:8px;}
.hud .brand .mark{font-size:10px;letter-spacing:.28em;color:var(--brass);text-transform:uppercase;font-weight:700;}
.hud .brand h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;}
.hud .brand h1 span{color:var(--brass);}
.hud nav{display:flex;gap:4px;}
.hud .navlink{
  padding:8px 14px;border-radius:3px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:var(--muted);border:1px solid transparent;
}
.hud .navlink:hover{color:var(--ink);}
.hud .navlink.current{background:var(--brass);color:#1A1425;}
.hud .hud-stats{display:flex;align-items:center;gap:18px;}
.hud .balance{text-align:right;}
.hud .balance .label{font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;}
.hud .balance .amt{font-size:20px;font-weight:700;color:var(--brass);}
.hud .packs-count{
  display:flex;align-items:center;gap:6px;
  color:var(--ink);border:1px solid var(--line);border-radius:20px;
  padding:6px 12px;
}
.hud .packs-count .icon{font-size:14px;color:var(--brass);}
.hud .packs-count .num{font-size:14px;font-weight:800;}
.hud .packs-count:hover{border-color:var(--brass-dim);}

/* ============================================================
   SHARED — buttons, empty state, rarity theming, toast, modal
   (used across Main/Info/Packs, not section-specific)
   ============================================================ */
.page{max-width:1080px;margin:0 auto;padding:28px 16px 60px;}

.btn{
  border:none;border-radius:3px;padding:12px 20px;font-size:13px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:filter .15s ease, transform .1s ease;
}
.btn:active{transform:scale(.98);}
.btn-brass{background:var(--brass);color:#1A1425;}
.btn-brass:hover{filter:brightness(1.08);}
.btn-brass:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--brass-dim);}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;}
.empty-state .glyph{font-size:32px;margin-bottom:10px;}

.swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.swatch.s-common{background:var(--common);}
.swatch.s-rare{background:var(--rare);}
.swatch.s-epic{background:var(--epic);}
.swatch.s-legendary{background:var(--legendary);}
.swatch.s-mythic{background:linear-gradient(120deg,var(--mythic-a),var(--mythic-b),var(--mythic-c));}

.rar-common{background:linear-gradient(160deg,#2A2836,#1D1B27);border:1px solid var(--common);}
.rar-common .tier,.rar-common .name{color:var(--common);}
.rar-rare{background:linear-gradient(160deg,#173330,#12201F);border:1px solid var(--rare);}
.rar-rare .tier,.rar-rare .name{color:var(--rare);}
.rar-epic{background:linear-gradient(160deg,#2B1F42,#1D1530);border:1px solid var(--epic);}
.rar-epic .tier,.rar-epic .name{color:var(--epic);}
.rar-legendary{background:linear-gradient(160deg,#3A2A12,#241A0C);border:1px solid var(--legendary);}
.rar-legendary .tier,.rar-legendary .name{color:var(--legendary);}
.rar-mythic{background:linear-gradient(160deg,#241830,#1A1424);border:1px solid transparent;position:relative;}
.rar-mythic::after{content:"";position:absolute;inset:-1px;border-radius:inherit;z-index:-1;
  background:linear-gradient(120deg,var(--mythic-a),var(--mythic-b),var(--mythic-c));}
.rar-mythic .tier,.rar-mythic .name{
  background:linear-gradient(120deg,var(--mythic-a),var(--mythic-b),var(--mythic-c));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel-2);border:1px solid var(--brass-dim);color:var(--ink);
  padding:12px 20px;border-radius:6px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:100;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(10,7,16,.75);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal-backdrop.show{display:flex;}
.modal-card{
  width:260px;border-radius:14px;padding:22px;position:relative;
  display:flex;flex-direction:column;gap:14px;
}
.modal-card .tier{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;}
.modal-card .glyph{font-size:72px;text-align:center;filter:drop-shadow(0 8px 16px rgba(0,0,0,.4));}
.modal-card .name{font-size:20px;font-weight:900;text-transform:uppercase;line-height:1.05;}
.modal-card .value{font-size:12px;opacity:.85;}
.modal-close{
  position:absolute;top:10px;right:12px;background:none;border:none;color:inherit;
  font-size:20px;cursor:pointer;opacity:.7;
}
.modal-close:hover{opacity:1;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}
</style>

<style>
.section-label{
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;
  margin:0 0 14px;
}

/* ============================================================
   SECTION: MAIN > INFO — strip showing the currently active pack
   ============================================================ */
#info{margin-bottom:6px;}
.info-strip{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
  padding:12px 16px;margin-top:4px;
}
.info-strip .info-name{font-size:13px;font-weight:800;text-transform:uppercase;}
.info-strip .info-price{font-size:12px;color:var(--brass);}

/* ============================================================
   SECTION: MAIN > PACKS — the pack carousel + individual cards
   ============================================================ */
.pack-tier{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--brass);}
.pack-name{font-size:22px;font-weight:900;text-transform:uppercase;line-height:1;}
.odds-list{
  display:flex;flex-direction:column;gap:4px;font-size:11px;
}
.odds-row{display:flex;justify-content:space-between;color:var(--muted);}

.carousel{
  display:flex;gap:16px;overflow-x:auto;
  padding:10px calc(50% - min(120px, 38vw)) 22px;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.carousel::-webkit-scrollbar{display:none;}

.pack-stage{
  flex:0 0 auto;
  width:min(240px, 76vw);
  scroll-snap-align:center;
  background:linear-gradient(160deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:10px;
  padding:22px 18px 18px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  box-shadow:0 20px 45px -25px rgba(0,0,0,.6);
  transition:border-color .2s ease, box-shadow .2s ease;
}
.pack-stage.is-active{
  border-color:var(--brass-dim);
  box-shadow:0 20px 45px -25px rgba(0,0,0,.6), 0 0 0 1px rgba(212,175,106,.15);
}
.pack-stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg, rgba(212,175,106,.04) 0px, rgba(212,175,106,.04) 1px, transparent 1px, transparent 14px);
}
.stage-art{
  width:120px;height:164px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:46px;
  border:1px solid var(--line);position:relative;
}
.stage-tier{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--brass);}
.stage-name{font-size:19px;font-weight:900;text-transform:uppercase;line-height:1;text-align:center;}

.stat-row{
  display:flex;width:100%;justify-content:space-between;
  border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
  padding:12px 0;margin-top:2px;
}
.stat{text-align:center;flex:1;}
.stat .stat-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.stat .stat-value{font-size:13px;font-weight:800;}
.stat .stat-value.min{color:var(--ink);}
.stat .stat-value.max{color:var(--legendary);}

.page{padding-bottom:110px;} /* leave room for the fixed bottom hud */

/* ============================================================
   SECTION: HUD / FOOTER — fixed bottom bar, buys the active pack
   ============================================================ */
.buy-hud{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(20,15,31,.96);backdrop-filter:blur(6px);
  border-top:1px solid var(--line);
  padding:14px 20px;
  display:flex;justify-content:space-between;align-items:center;gap:16px;
}
.buy-hud .buy-hud-info{display:flex;flex-direction:column;gap:2px;}
.buy-hud .buy-hud-label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
.buy-hud .buy-hud-name{font-size:15px;font-weight:900;text-transform:uppercase;}
.buy-hud .buy-hud-buy{flex:none;padding:12px 22px;}
</style>
</head>
<body>

<!-- ============================================================
     HEADER
     ============================================================ -->
<header id="hud" class="hud"></header>

<main class="page">

  <!-- ============================================================
       MAIN > INFO
       ============================================================ -->
  <section id="info">
    <p class="section-label">Card Shop</p>
    <div class="info-strip" id="infoStrip"></div>
  </section>

  <!-- ============================================================
       MAIN > PACKS
       ============================================================ -->
  <section id="packs">
    <div class="carousel" id="carousel"></div>
  </section>

</main>

<!-- ============================================================
     HUD / FOOTER
     ============================================================ -->
<footer class="buy-hud" id="buyHud"></footer>

<script>
/* ==========================================================
   DATA — rarities, card names, pack tiers
   ========================================================== */

const RARITIES = [
  { id:"common",    label:"Common",    glyphs:["●","▪","○"], valueRange:[8,20]    },
  { id:"rare",      label:"Rare",      glyphs:["◆","✦","◈"], valueRange:[25,60]   },
  { id:"epic",      label:"Epic",      glyphs:["✷","❖","✸"], valueRange:[70,160]  },
  { id:"legendary", label:"Legendary", glyphs:["★","☆","✹"], valueRange:[200,450] },
  { id:"mythic",    label:"Mythic",    glyphs:["◉","✺","❉"], valueRange:[600,1500]}
];
const RARITY_ORDER = ["mythic","legendary","epic","rare","common"];

const NAME_PARTS = {
  prefix:["Iron","Void","Solar","Ashen","Crimson","Gilded","Hollow","Storm","Obsidian","Wraith","Ember","Frost","Rogue","Sable","Verdant"],
  noun:["Warden","Cipher","Relic","Sentinel","Oracle","Marauder","Construct","Effigy","Harbinger","Specter","Engine","Totem","Wyrm","Vanguard","Idol"]
};

function makeCardPool(){
  const pool = [];
  RARITIES.forEach(r=>{
    NAME_PARTS.prefix.forEach((p,i)=>{
      const step = r.id==="mythic"?5: r.id==="legendary"?3: r.id==="epic"?2:1;
      if (i % step === 0){
        const n = NAME_PARTS.noun[(i+RARITIES.indexOf(r)) % NAME_PARTS.noun.length];
        pool.push({ id:r.id+"-"+p+"-"+n, name:p+" "+n, rarity:r.id, glyph:r.glyphs[i % r.glyphs.length] });
      }
    });
  });
  return pool;
}
const CARD_POOL = makeCardPool();

// The 5 rarity tiers, per the locked Popularity Ledger economics.
// Buy Price = Redemption Value at every tier — no separate pack odds,
// no separate pack pricing. Buying a tier guarantees that rarity;
// which specific card design you get is randomized at rip time.
// Chips are pegged at 100 chips = $1 (matches the rest of the app).
const PACKS = [
  { id:"common",    name:"Common",    price:500   }, // $5
  { id:"rare",      name:"Rare",      price:1000  }, // $10
  { id:"epic",      name:"Epic",      price:2500  }, // $25
  { id:"legendary", name:"Legendary", price:10000 }, // $100
  { id:"mythic",    name:"Mythic",    price:15000 }  // $150
];
const CENTER_PACK_INDEX = 2; // Epic — default starting/centered tier

/* ==========================================================
   STATE — persisted to localStorage, shared across all pages
   ========================================================== */

const STORAGE_KEY = "vault_state_v1";

function defaultState(){
  return {
    balance: 1000,
    collection: [],   // [{uid,name,rarity,glyph,value,ts}]
    unopened: [],     // [{uid,packId}]
    firstVisit: true
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  } catch(e){
    return defaultState();
  }
}

function saveState(state){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e){ /* storage unavailable — state just won't persist */ }
}

/* ==========================================================
   HELPERS
   ========================================================== */

function fmt(n){ return n.toLocaleString(); }
function rarityMeta(id){ return RARITIES.find(r=>r.id===id); }
function uid(){ return Date.now()+"-"+Math.random().toString(36).slice(2,7); }

function toast(msg){
  let t = document.getElementById("toast");
  if (!t){
    t = document.createElement("div");
    t.id = "toast"; t.className = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), 1800);
}
</script>

<script>
/* ==========================================================
   SECTION: HEADER — render function
   ========================================================== */

function renderHud(state, currentPage){
  const mount = document.getElementById("hud");
  if (!mount) return;
  const pages = [
    {id:"start", href:"start.html", label:"Start"},
    {id:"shop", href:"shop.html", label:"Pack Shop"},
    {id:"rip", href:"index.html", label:"Rip Pack"},
    {id:"collection", href:"collection.html", label:"Collection"}
  ];
  mount.innerHTML = `
    <a class="brand" href="start.html">
      <span class="mark">Zetsumetsu</span>
      <h1>ZETSU PACKZ</h1>
    </a>
    <nav>
      ${pages.map(p=>`<a class="navlink ${p.id===currentPage?'current':''}" href="${p.href}">${p.label}</a>`).join("")}
    </nav>
    <div class="hud-stats">
      <a class="packs-count" href="index.html" title="Unopened packs">
        <span class="icon">&#9670;</span>
        <span class="num mono">${state.unopened.length}</span>
      </a>
      <div class="balance">
        <div class="label">Chips</div>
        <div class="amt mono">${fmt(state.balance)}</div>
      </div>
    </div>
  `;
}
</script>

<script>
/* ==========================================================
   PAGE CONTROLLER — wires INFO, PACKS, and HUD/FOOTER together
   ========================================================== */

let state = loadState();
renderHud(state, "shop");

let activePackId = PACKS[CENTER_PACK_INDEX].id; // single source of truth —
                                                 // carousel scroll drives this,
                                                 // Info strip + Hud/Footer both just read it

/* ---------------- MAIN > PACKS ---------------- */

function renderCarousel(){
  const carousel = document.getElementById("carousel");
  carousel.innerHTML = PACKS.map(pack=>{
    // the tier IS the rarity now — no more weighted odds across rarities,
    // buying a tier guarantees that rarity
    const rarClass = pack.id;

    return `
      <div class="pack-stage ${pack.id===activePackId?'is-active':''}" data-pack="${pack.id}">
        <div class="stage-tier">${pack.name} Tier</div>
        <div class="stage-art rar-${rarClass}">&#9670;</div>
        <div class="stage-name">${pack.name}</div>
        <div class="stat-row">
          <div class="stat">
            <div class="stat-label">Buy Price</div>
            <div class="stat-value min">${fmt(pack.price)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Redemption Value</div>
            <div class="stat-value max">${fmt(pack.price)}</div>
          </div>
        </div>
      </div>`;
  }).join("");
}

// whichever card is nearest the carousel's center becomes "active" —
// this is the link between PACKS, INFO, and the HUD/FOOTER
function computeActivePack(){
  const carousel = document.getElementById("carousel");
  const carouselRect = carousel.getBoundingClientRect();
  const carouselCenter = carouselRect.left + carouselRect.width / 2;

  let closestId = activePackId;
  let closestDist = Infinity;
  carousel.querySelectorAll(".pack-stage").forEach(card=>{
    const rect = card.getBoundingClientRect();
    const cardCenter = rect.left + rect.width / 2;
    const dist = Math.abs(cardCenter - carouselCenter);
    if (dist < closestDist){
      closestDist = dist;
      closestId = card.dataset.pack;
    }
  });

  if (closestId !== activePackId){
    activePackId = closestId;
    // just flip the active highlight, no full re-render (keeps scroll position stable)
    carousel.querySelectorAll(".pack-stage").forEach(card=>{
      card.classList.toggle("is-active", card.dataset.pack === activePackId);
    });
    renderInfoStrip();
    renderBuyHud();
  }
}

function centerOnActivePack(){
  const carousel = document.getElementById("carousel");
  const activeCard = carousel.querySelector(`[data-pack="${activePackId}"]`);
  if (activeCard){
    activeCard.scrollIntoView({ inline: "center", block: "nearest" });
  }
}

/* ---------------- MAIN > INFO ---------------- */

function renderInfoStrip(){
  const pack = PACKS.find(p=>p.id===activePackId);
  document.getElementById("infoStrip").innerHTML = `
    <span class="info-name">${pack.name}</span>
    <span class="info-price mono">${fmt(pack.price)} chips</span>
  `;
}

/* ---------------- HUD / FOOTER ---------------- */

function renderBuyHud(){
  const pack = PACKS.find(p=>p.id===activePackId);
  const affordable = state.balance >= pack.price;
  document.getElementById("buyHud").innerHTML = `
    <div class="buy-hud-info">
      <div class="buy-hud-label">Selected Pack</div>
      <div class="buy-hud-name">${pack.name}</div>
    </div>
    <button class="btn btn-brass buy-hud-buy" id="buyHudBtn" ${affordable?'':'disabled'}>
      Buy for ${fmt(pack.price)} chips
    </button>
  `;
  document.getElementById("buyHudBtn").addEventListener("click", ()=>buyPack(activePackId));
}

function buyPack(packId){
  const pack = PACKS.find(p=>p.id===packId);
  if (state.balance < pack.price){ toast("Not enough chips."); return; }
  state.balance -= pack.price;
  state.unopened.push({ uid: uid(), packId: pack.id });
  saveState(state);
  renderHud(state, "shop"); // updates the HEADER's packs-count + balance
  renderBuyHud();
  toast(pack.name + " added to your unopened packs.");
}

/* ---------------- Scroll wiring ---------------- */

let scrollTick = false;
document.getElementById("carousel").addEventListener("scroll", ()=>{
  if (scrollTick) return;
  scrollTick = true;
  requestAnimationFrame(()=>{
    computeActivePack();
    scrollTick = false;
  });
}, {passive:true});

/* ---------------- Init ---------------- */

renderCarousel();
renderInfoStrip();
renderBuyHud();
centerOnActivePack();
</script>
</body>
</html>
